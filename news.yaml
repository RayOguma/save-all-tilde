# お知らせ。タイトル画面の「お知らせ」に出る（src/news.ts で読みこみ、src/ui/panels.ts の showTitle で出す）。
# 新しいものを上に書く。まだ読んでいないお知らせには「NEW」がつく（読んだかどうかは、遊ぶ人のブラウザに残す）。
#   date:  日付（"2026-10-08" のように、クォートで囲む）
#   title: 見出し
#   body:  本文。1つの項目が1つの段落。`ls` のようにバッククォートで囲むと、コマンドの枠で出る
# 公開するビルドでは、このコメントは取り除かれる（vite.config.ts）

- date: "2026-10-08"
  title: 遊びやすくなりました
  body:
    - 遊んでくれたみなさん、感想をありがとうございます！ いただいた声をもとに、次のところを直しました。
    - お知らせ ― タイトル画面に「📢 お知らせ」をつくりました。アップデートなどのお知らせは、ここに出します。まだ読んでいないお知らせがあると、数と赤い●でお知らせします。
    - 📖 コマンド手帳 ― 並べ方を「新しい順・覚えた順・ABC順」から選べるようになりました（はじめは新しい順で、新しく覚えたコマンドがいちばん上に来ます）。上の欄で、コマンドの名前や説明からさがすこともできます。
    - 章を選ぶ ― 章の終わりで「セーブして終わる」を選ぶと、次の章が「？？？」のまま選べなかったのを直しました。
    - つづきから ― 押したときに、どの章からつづくのかを出すようにしました。
    - 章を選ぶ・はじめから ― セーブがあるときは、上書きしてよいか、たずねるようにしました。まちがえて押しても、「やめておく」でもどれます。
    - 章を選ぶ ― 「＜ もどる」を、画面の左上に置きました。
    - 地図と手帳の幅 ― ターミナルとの境目をドラッグすると、広げたりせばめたりできます。もとにもどすときは、境目をダブルクリックするか、⚙ 設定の「もとの幅にもどす」を押してください。
    - 文字の大きさ ― ⚙ 設定で「小・中・大・特大」から選べるようになりました。
    - 設定 ― タイトル画面からも「⚙ 設定」を開けるようになりました。音量や文字の大きさなどを、遊びはじめる前に変えられます。
    - 地図 ― 「…」で切れている名前は、マウスを乗せると全部見えます。
    - 入力欄 ― いまいる場所の住所を入力欄の上の行に出して、長いコマンドも最後まで見えるようにしました。
