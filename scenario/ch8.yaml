# 第8章｜記憶の書庫 — 真相（grep・diff・history・|）
#
# 書き方は ch0〜ch7.yaml の先頭を参照。この章で増えたもの:
#   grep       grep 探す言葉 記録の名前...。名前の * は、いまの場所の名前に広がる（*.log）。見つけた記録は、イベントの found に使える
#   |          history | grep kill のように、左のコマンドが出した行を grep に流しこむ（| のうしろは grep だけ）
#   from       イベントの from: コマンド名。パイプで、そのコマンドの出した行を流しこまれたときだけ
#   identified イベントの identified: パス。そのリンクの正体を見破っているとき（ls -l・file のあと）
#   "<shadow>" "<light>"  せりふの途中の演出（記録の影で画面が暗く沈み、曲が止まる／首飾りの光ではらわれる）
#   clear の history  その章で打ったはずのコマンド（「章を選ぶ」で後の章から始めたときの history）
#
# 物語の流れ（フラグの順）:
#   met_syslo（grep を覚える。シスロが仲間に）→ grep_found（grep モリビト *.log。どの村も 7月12日 09:00 に停止。書庫番の組に入る）
#   → read_record（守り人の棚。作成者が「不明」）→ found_old_record（ls -a で隠された .守り人.log.1）→ told_diff（diff を覚える）
#   → diff_seen（作成者はスドウ。一度自分で止め、十日後に動かしなおした）
#   → restart_known（昔の記録を grep。直すには、設計図と作成者の鍵束がいる）→ checked_bag（ls ~/かばん。設計図はある）
#   → found_origin（file 守り人の原本。原本は作成者の手元に置く決まり → 札は /root を指している）
#   → read_ledger（奥の間の、きみの記録）→ read_history（history。| を覚える。あの日の言葉を確かめたい）
#   → history | grep kill（記録の影。首飾りが守る）= ch8_clear

chapter: { no: 8, title: 記憶の書庫, startIf: ch7_clear, startAt: /var/log }

# この章をクリアすると手に入るもの（「章を選ぶ」で次の章から始めるとき、テストの準備に使う）
clear:
  flags: [met_syslo, grep_found, read_record, found_old_record, told_diff, diff_seen, restart_known, checked_bag,
          found_origin, entered_back, read_ledger, read_history, faced_kill, ch8_clear]
  learned: [grep, "grep *.log", diff, "grep |"]
  groups: [書庫番]
  discovered: [/var/log, /var/log/村々の記録, /var/log/守り人の棚, /var/log/昔の記録, /var/log/奥の間]
  history: [ls, cat シスロ, cd 村々の記録, grep モリビト *.log, cd ../守り人の棚, cat 守り人.log, ls -a,
            diff .守り人.log.1 守り人.log, cd ../昔の記録, grep モリビト *.log, ls ~/かばん, cd ../守り人の棚,
            file 守り人の原本, cd ../奥の間, cat きみの記録, history, history | grep kill]

characters:
  シスロ: { sprite: syslo, color: "#c8a8e8", voice: 620 }
  記録の影: { sprite: inkshadow, color: "#9a7ab8", voice: 150 }

intro:
  - "（塔を降り、谷の底へ。霧の中に、石づくりの大きな建物が建っていた。）"
  - "（重い扉を押すと……天井まで届く本棚が、どこまでも続いている。）"
  - "（紙とインクの匂い。どこかで、ペンが走る音がする。）"
  - "コダマ: ……記憶の書庫。世界じゅうの記録が眠る場所じゃ。モリビトを直す手がかりも、ここにあるやもしれぬ。"
guide:
  - "[まずは `ls` で、あたりを見渡してみよう。]"

objectives:
  - if: ch8_clear
    text: "第9章「賢者の庵」は制作中です"
  - if: read_history
    text: "あの日唱えた言葉を、自分の記録から探そう（`|`）"
  - if: read_ledger
    text: "自分の記録を読もう（`history`）"
  - if: found_origin
    text: "奥の間へ行こう"
  - if: checked_bag
    text: "『守り人の原本』の札が、どこを指しているのか調べよう"
  - if: restart_known
    text: "かばんの中に、設計図があるか確かめよう"
  - if: diff_seen
    text: "昔の記録から、モリビトを動かしなおしたときのことを探そう"
  - if: told_diff
    text: "二つの記録を見比べよう（`diff`）"
  - if: read_record
    text: "隠された古い版の記録を探そう"
  - if: grep_found
    text: "守り人の棚で、モリビトの記録を読もう"
  - if: met_syslo
    text: "村々の記録から、モリビトのことを探そう（`grep`）"
  - text: "書庫の番人を探そう"

hints:
  - if: ch8_clear
    steps: ["第8章はここまで。遊んでくれてありがとう！"]
  - if: read_history
    steps:
      - "あの日、モリビトを止めたときに唱えた言葉を、自分の記録から探そう。"
      - "`|` で、`history` の出した行を `grep` に流しこむ。探す言葉は、あの日唱えた言葉。"
      - "`history | grep kill`"
  - if: read_ledger
    steps:
      - "自分の記録を読もう。"
      - "これまで唱えた言葉は `history` で読める。"
      - "`history`"
  - if: found_origin
    steps:
      - "シスロが、奥の間で待っている。"
      - "奥の間に、きみの記録がある。`cd` で行って、`cat` で読もう。"
      - "`cd /var/log/奥の間` → `cat きみの記録`"
  - if: checked_bag
    steps:
      - "原本は、作成者の手元にある。『守り人の原本』の札が、どこを指しているのか調べよう。"
      - "札の正体を調べるのは、もつれ沼で覚えた言葉。鍵のかけ方と一緒に見る言葉でも分かる。"
      - "`cd /var/log/守り人の棚` → `file 守り人の原本`（または `ls -l`）"
  - if: restart_known
    steps:
      - "設計図は、山道の祠で預かったはず。かばんの中を確かめよう。"
      - "入らずに中をのぞく言葉で、かばんの住所を書く。"
      - "`ls ~/かばん`"
  - if: diff_seen
    steps:
      - "十日止まったときの記録が、昔の記録の棚にあるはず。"
      - "`grep` で、たくさんの記録からまとめて探そう。"
      - "`cd /var/log/昔の記録` → `grep モリビト *.log`"
  - if: told_diff
    steps:
      - "古い版と今の版の記録を、見比べよう。"
      - "見比べるのは `diff 古い記録 新しい記録`。"
      - "`diff .守り人.log.1 守り人.log`"
  - if: read_record
    steps:
      - "古い版の記録（名前のうしろに `.1`）が、棚のどこかに隠されているはず。"
      - "隠れているものを見るのは、チルダ村で覚えた言葉。"
      - "`ls -a`"
  - if: grep_found
    steps:
      - "守り人の棚で、モリビトの記録を読もう。棚は、書庫番の組の者だけが入れる。"
      - "棚へ行って、記録を読む。入っている組は、ムラガレで覚えた言葉で確かめられる。"
      - "`cd /var/log/守り人の棚` → `ls` → `cat 守り人.log`"
  - if: met_syslo
    steps:
      - "村々の記録から、モリビトのことを探そう。"
      - "言葉で探すのは `grep`。`*` で、たくさんの記録をまとめて探せる。"
      - "`cd 村々の記録` → `grep モリビト *.log`"
  - steps:
      - "書庫の中に、だれかいるようだ。"
      - "まわりを見るのは `ls`、話しかけるのは `cat`。"
      - "`ls` → `cat シスロ`"

events:
  # どの村の記録にも「7月12日 09:00 モリビト、停止」。スドウが記録を書き換えていた
  - on: grep
    arg: モリビト
    found: /var/log/村々の記録/書庫.log
    once: grep_found
    joinGroup: 書庫番
    lines:
      - "{name}: どの村の記録にも……『7月12日 09:00 モリビト、停止』……。"
      - "コダマ: 物見の塔の大時計が止まっていたのも、7月12日の9時であったな。"
      - "{name}: （……{me}が、石碑の言葉を唱えた時だ。）"
      - "シスロ: ……それに、ここを見てください。『スドウ、モリビトの記録を書き換える』。"
      - "シスロ: 書庫の記録は、書き足すことはできても、書き換えてはならない掟です。……守り人の棚へ、行ってみましょう。"
      - "シスロ: あの棚は、書庫番の組の者しか入れないんです。あなたも、しばらく書庫番の組に入れておきますね。"
      - "{name}: {me}が、書庫番の組に……。"
  # 入っている組を確かめる（寄り道）
  - on: groups
    if: grep_found
    once: checked_groups
    lines:
      - "{name}: ムラガレと、書庫番……。{me}、ふたつの組に入ってるんだ。"
      - "コダマ: 組に入るたびに、開く扉が増えていくのう。"
  # 守り人の記録。作成者が「不明」。古い版は、まだ見つけていない
  - on: cat
    target: /var/log/守り人の棚/守り人.log
    if: "!found_old_record"
    once: read_record
    lines:
      - "{name}: 作成者……『不明』？"
      - "シスロ: おかしいですね。先代の番人から、この記録には、たしかに作成者の名があったと聞いています。"
      - "シスロ: 書き換えたのなら、古い版が残っているはずです。書庫の掟では、古くなった記録は、名のうしろに `.1` をつけて、棚にとっておくんです。"
      - "{name}: でも、棚には `.1` の記録なんて、見当たらないよ。"
      - "コダマ: ……見えぬように、隠されておるのやもしれぬ。チルダ村の守り人が、そうであったようにな。"
      - "シスロ: それに……この棚の記録は、書庫で書き写したものなんです。作成者が自分の手で書いた、いちばん最初の記録……原本は、作成者の手元に置く決まりで。"
      - "シスロ: その原本のありかを指しているのが、棚の『守り人の原本』の札です。"
  # 先に ls -a で古い版を見つけていたとき
  - on: cat
    target: /var/log/守り人の棚/守り人.log
    if: found_old_record
    once: read_record
    set: [told_diff]
    learn: [diff]
    lines:
      - "{name}: 作成者……『不明』？ じゃあ、さっきの隠れてた `.守り人.log.1` は……。"
      - "シスロ: 古い版ですね。書庫の掟では、古くなった記録は、名のうしろに `.1` をつけて、とっておくんです。"
      - "シスロ: 二つの記録のちがいは、`diff` で見比べられます。`diff 古い記録 新しい記録` と唱えると、ちがう行だけが出てきます。"
      - "シスロ: `<` は前の記録だけにある行、`>` はあとの記録だけにある行です。"
      - "{name}: ねえ、棚の『守り人の原本』っていう札は？"
      - "シスロ: この棚の記録は、書庫で書き写したものなんです。作成者が自分の手で書いた、いちばん最初の記録……原本は、作成者の手元に置く決まりで、あの札が、そのありかを指しています。"
  # 隠された古い版を見つけた。diff を覚える
  - on: ls
    if: "found_old_record & read_record"
    once: told_diff
    learn: [diff]
    lines:
      - "{name}: あった！ `.守り人.log.1`……名前の前に `.` がついて、隠されてた。"
      - "シスロ: 古い版ですね。……二つの記録のちがいは、`diff` で見比べられます。"
      - "シスロ: `diff 古い記録 新しい記録` と唱えると、ちがう行だけが出てきます。`<` は前の記録だけにある行、`>` はあとの記録だけにある行です。"
  # 見比べると、作成者はスドウ。一度、自分で止め、十日後に動かしなおした
  - on: diff
    target: /var/log/守り人の棚/.守り人.log.1
    if: told_diff
    once: diff_seen
    lines:
      - "{name}: 作成者……スドウ……！？"
      - "{name}: モリビトを作ったのは、スドウだったんだ……。"
      - "シスロ: それに、消された行が、もうひとつ。『作成者みずから、一度だけ守り人を止めたことがある。十日のあいだ、世界の時は止まった』……。"
      - "コダマ: スドウが……自らの手で、モリビトを止めた……？"
      - "{name}: {me}と、同じことを……。"
      - "{name}: ……でも、見て。『作成者は、守り人を動かしなおし』って書いてある。一度止まったモリビトを、スドウは、動かしなおしたんだ！"
      - "コダマ: ならば、モリビトは直せる、ということじゃな……！"
      - "シスロ: 十日止まったときの記録なら、昔の記録の棚にあるはずです。どうやって動かしなおしたのか、分かるかもしれません。"
  # 昔の記録。直すには、設計図と、作成者の鍵束がいる
  - on: grep
    arg: モリビト
    found: /var/log/昔の記録/十年前.log
    once: restart_known
    lines: &restart
      - "{name}: 『モリビトを直すには、守り人の設計図と、作成者の鍵束がいる』……！"
      - "シスロ: 十年前、スドウ様はそうして、モリビトを動かしなおしたんですね。"
      - "コダマ: 設計図……山道の祠で預かった、あの包みのことではないか？"
      - "{name}: かばんに入れたままだ。確かめてみる！"
  - on: grep
    arg: スドウ
    found: /var/log/昔の記録/十年前.log
    once: restart_known
    lines: *restart
  # かばんに、設計図はある
  - on: ls
    target: ~/かばん
    if: restart_known
    once: checked_bag
    lines:
      - "{name}: あった。`設計図.tar.gz`……！"
      - "コダマ: スドウは『もしものときのために、設計図を山道に預けた』と書き残しておった。……このときのため、であったか。"
      - "{name}: 設計図は、ここにある。あとは、スドウの鍵束……。スドウに会えば、モリビトを直せるんだ！"
      - "シスロ: スドウ様の行き先……。そうだ、『守り人の原本』の札！"
      - "シスロ: 原本は、作成者の手元に置く決まりです。作成者がスドウ様なら、札の行き先は、スドウ様の住まいのはず。"
      - "{name}: 名前も、歩みの記録も消したのに、札は残ってるの？"
      - "シスロ: 見落とされたのか……それとも、わざと残していかれたのか。札がどこを指しているのか、正体を確かめてみてください。"
  # 『守り人の原本』の札は、/root（賢者の庵）を指している
  - on: file
    arg: 守り人の原本
    if: checked_bag
    once: found_origin
    lines: &origin
      - "{name}: 『守り人の原本』の札は……`/root/庵/守り人の原本` を指してる。"
      - "シスロ: `/root`……雲の上の、賢者の庵です。原本は、作成者の手元に。……やっぱり、スドウ様は、庵にいらっしゃるんですね。"
      - "{name}: でも、札をたどっても、その先には行けない……。"
      - "シスロ: 雲の上は、ここからは遠すぎて、札ではたどれないんです。……庵へは、自分の足で登るしかありません。"
      - "コダマ: スドウは、庵におる。……もう、すぐそこじゃ。"
      - "シスロ: ……その前に。奥の間へ、来ていただけますか。あなたに、見てほしい記録があるんです。"
  - on: ls
    identified: /var/log/守り人の棚/守り人の原本
    if: checked_bag
    once: found_origin
    lines: *origin
  # 自分の記録。あの日の言葉を、自分の目で確かめたい。| を覚える
  - on: history
    if: read_ledger
    once: read_history
    learn: ["grep |"]
    lines:
      - "{name}: これ……{me}が、これまで唱えてきた言葉、ぜんぶ……。"
      - "コダマ: ……この中に、あの日の言葉もあるのじゃな。"
      - "{name}: うん。……スドウは、自分がモリビトを止めたことを、記録から消した。でも{me}は、消したくない。"
      - "{name}: スドウに会ったら、モリビトを止めたのは{me}だって、ちゃんと話して……直してほしいって、頼むんだ。だから、あの日の言葉を、自分の目で確かめておきたい。"
      - "シスロ: ……あなたが、モリビトを。……そうでしたか。"
      - "シスロ: わかりました。長い記録から、ひとつの言葉を探すときは、`|` を使います。"
      - "シスロ: `history | grep 探す言葉` と書くと、`history` の出した行を、そのまま `grep` に流しこんで、その言葉を含む行だけを抜き出せるんです。"
      - "{name}: あの日、{me}が唱えたのは……`kill`。"
  # kill の行。記録の影が襲い、首飾りが守る
  - on: grep
    from: history
    arg: kill
    if: read_ledger
    once: ch8_clear
    set: [faced_kill]
    lines:
      - "{name}: ……`kill .モリビト`。"
      - "（その一行だけが、じわりと黒くにじんだ。）"
      - "<shadow>"
      - "（にじんだ墨が、帳面からあふれ出した。黒い影になって、{name}のまわりで渦を巻く。）"
      - "記録の影: ……オマエガ……トメタ……。"
      - "記録の影: ……ムラモ……トキモ……ミンナ……オマエガ……。"
      - "{name}: ……うん……{me}が……止めたんだ……。"
      - "（足もとから、影が這いあがってくる。冷たくて、重くて……息が、うまくできない――）"
      - "<light>"
      - "（そのとき。胸もとの首飾りが、まばゆく光った。）"
      - "コダマ: 人の子よ！ 森の加護を、忘れたか！"
      - "（光に触れた影が、ほどけるように、墨のしずくに戻っていく。）"
      - "コダマ: 言うたであろう。その首飾りは、災いから、おまえを守る、と。"
      - "{name}: コダマ……。"
      - "コダマ: 過ちの記録は、消えぬ。……じゃが、記録に呑まれる必要もない。よく見よ、その下の行を。"
      - "{name}: `kill 0999`……。坑道で、みんなを守るために唱えた言葉……。"
      - "シスロ: 同じ言葉でも、意味はまるでちがいますね。……記録は消せません。でも、書き足すことはできるんです。"
      - "シスロ: あなたは、もう書き足しはじめていますよ。"
      - "{name}: ……うん。"
      - "シスロ: スドウ様は、ご自分の名を、記録から消してしまった。……でも、あなたは、自分の記録から目をそらさなかった。"
      - "シスロ: 賢者の庵は、雲の上。書庫の屋根から、空へ続く階段があります。"
      - "コダマ: 忘れるでないぞ、人の子。われらが旅に出たのは、モリビトを動かしなおし、チルダ村を元に戻すためじゃ。"
      - "{name}: うん。設計図は、かばんにある。あとは、スドウの鍵束……。"
      - "{name}: スドウに会って、モリビトを直してもらう。……チルダ村のみんなを、元に戻すんだ。"
      - "<chapterEnd>"

companions:
  - name: コダマ
    joinIf: kodama_joined
    variants:
      - at: /var/log
        lines: ["コダマ: 紙とインクの匂いじゃ。……ここには、われらの旅の記録も、残っておるのかもしれぬな。"]
  # 書庫の番人。会うと、書庫の中を一緒に回ってくれる
  - name: シスロ
    joinIf: "met_syslo & !ch8_clear"
    lines: ["シスロ: `grep モリビト *.log` で、村々の記録から探せます。`スドウ` で探してみるのも、いいかもしれません。"]
    variants:
      - if: read_history
        lines: ["シスロ: `history | grep 探す言葉` で、その言葉の行だけを探せます。"]
      - if: read_ledger
        lines: ["シスロ: 自分の記録は、`history` で読めます。"]
      - if: found_origin
        lines: ["シスロ: 奥の間へ来てください。`/var/log/奥の間` です。"]
      - if: checked_bag
        lines: ["シスロ: 原本は、作成者の手元に置く決まり。『守り人の原本』の札がどこを指しているのか、確かめてみてください。"]
      - if: restart_known
        lines: ["シスロ: 設計図は、あなたのかばんに？ 確かめてみてください。"]
      - if: diff_seen
        lines: ["シスロ: 昔の記録の棚に、十日止まったときの記録があるはずです。`/var/log/昔の記録` です。"]
      - if: told_diff
        lines: ["シスロ: `diff 古い記録 新しい記録` で、ちがう行だけが出てきます。"]
      - if: read_record
        lines: ["シスロ: 古い版は、名のうしろに `.1`。……どこかに、隠されているのかもしれません。"]
      - if: grep_found
        lines: ["シスロ: 守り人の棚へ行ってみましょう。`/var/log/守り人の棚` です。"]

places:
  # 第7章で頂上から見えた /var/log（記憶の書庫）に、中身を足す
  - path: /var/log
    icon: shelf
    theme: library
    bgm: 湖上の社
    children:
      - name: シスロ
        owner: シスロ
        visibleIf: "!met_syslo"
        mark: "!met_syslo"
        set: [met_syslo]
        learn: [grep, "grep *.log"]
        lines:
          - "（高い本棚のあいだで、丸めがねの女の人が、帳面に何かを書きこんでいる。）"
          - "シスロ: ……あら。お客さまなんて、めずらしいですね。わたしはシスロ。この記憶の書庫の、番人です。"
          - "{name}: {me}は{name}。モリビトを直す方法と、スドウっていう人の行き先を探してるんだ。"
          - "シスロ: スドウ様……。ときどき、この書庫にもいらしていました。でも、どこへ行かれたのかは……。"
          - "シスロ: 旅人の歩みは、ふつうなら、ここの記録に残るんです。けれど、スドウ様の歩みだけは、ところどころ抜け落ちていて……。"
          - "{name}: 抜け落ちて……？"
          - "シスロ: ええ。……モリビトのことなら、記録にたくさん残っているはずです。そこから、スドウ様の手がかりも見つかるかもしれません。"
          - "シスロ: でも、記録はとても多いんです。ひとつずつ読んでいたら、日が暮れてしまいますよ。"
          - "{name}: どうすればいいの？"
          - "シスロ: 言葉で探すんです。`grep` のうしろに、探したい言葉と、探す記録の名前を書きます。"
          - "シスロ: たとえば `grep モリビト チルダ村.log` なら、チルダ村の記録から、『モリビト』という言葉が出てくる行だけを抜き出せます。"
          - "{name}: 記録がたくさんあるときは……？"
          - "シスロ: 記録の名前は、どれも `.log` で終わります。名前に `*` を使って `*.log` と書けば、『.log で終わる記録ぜんぶ』から、まとめて探せますよ。"
          - "{name}: `*`……！ 迷いの森で、道しるべを探すときに使ったしるしだ。"
          - "シスロ: ふふ、知っています。あなたが森で `*` を使って道しるべを探したことも、ちゃんと、この書庫に記録されていますから。"
          - "{name}: えっ……{me}のことまで？"
          - "シスロ: ええ。この書庫には、旅人の歩みも、書きこまれるんです。……さあ、わたしもご一緒しますね。"
