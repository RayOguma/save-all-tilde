# 第5章｜廃墟山道 — 眠る人々（tar -tzf・tar -xzf・tar -czf）
#
# 書き方は ch0〜ch4.yaml の先頭を参照。この章で増えたもの:
#   archive    包み（.tar.gz）の中身。ふつうの書き方で、人・物・場所を書く。tar -xzf でほどくと、いまいる場所に出てくる
#              （包みは、置いてある場所でしかほどけない。中に包みを入れれば、包みの中の包みになる）
#   onList     tar -tzf で中をのぞいたときのイベント
#   onExtract  tar -xzf でほどいたときのイベント
#   allow の cmd: tar   tar -czf でまとめてよい物（from）と、できる包み（to）
#
# 物語の流れ（フラグの順）:
#   pass_shown（関所で cat ~/かばん/通行証）→ read_note（書き置き。tar を覚える）
#   → listed_kaya（tar -tzf）→ rescued_kaya（tar -xzf）→ kaya_told（耳石の鼓動。kill の日だと気づく）
#   → told_shrine（スドウを探していると話す。もういないが、古い祠に箱を置いていった）
#   → reached_shrine（崖の上で、祠の住所を find で調べ、ln -s で渡る）→ found_blueprint（古い箱をほどくと、紙の束）
#   → named_blueprint（mv で「設計図」と名札をつける）→ read_tag（添え書きで tar -czf を覚える）
#   → blueprint_packed（tar -czf）→ blueprint_in_bag（mv で、かばんへ）→ reported_kaya（カヤに知らせる。この先の道）
#   → ch5_clear（狭い抜け道から坑道へ）
#   寄り道: rescued_make・rescued_yam（包みをほどく）、rescued_zip（隠れた包み → 包みの中の包み）
#
# この章から、物語の中のヒントは控えめにする。新しいコマンド（tar）は書き方まで教えるが、
# おさらいのコマンド（find・ln -s・mv・ls -a）は、何をしたいかだけ。書き方は hints の3段目で出す

chapter: { no: 5, title: 廃墟山道, startIf: ch4_clear, startAt: /var/backups }

# この章をクリアすると手に入るもの（「章を選ぶ」で次の章から始めるとき、テストの準備に使う）
clear:
  flags: [pass_shown, read_note, listed_kaya, rescued_kaya, kaya_told, told_shrine, reached_shrine, listed_box,
          found_blueprint, named_blueprint, read_tag, blueprint_packed, blueprint_in_bag, reported_kaya, ch5_clear]
  learned: [tar, "tar -tzf", "tar -xzf", "tar -czf"]
  discovered: [/var, /var/backups]
  ops:
    - { op: untar, path: /var/backups/崩れた宿場/瓦礫の山/カヤ.tar.gz, to: /var/backups/崩れた宿場/瓦礫の山 }
    - { op: untar, path: /var/backups/古い祠/古い箱.tar.gz, to: /var/backups/古い祠 }
    - { op: mv, from: /var/backups/古い祠/紙の束, to: /var/backups/古い祠/設計図 }
    - { op: tar, from: /var/backups/古い祠/設計図, to: /var/backups/古い祠/設計図.tar.gz }
    - { op: mv, from: /var/backups/古い祠/設計図.tar.gz, to: /home/チルダ村/かばん/設計図.tar.gz }

characters:
  イプタ: { sprite: iputa, color: "#c0a070", voice: 300 }
  カヤ: { sprite: kaya, color: "#e0a0b8", voice: 700 }
  メイク: { sprite: meiku, color: "#b0b0a0", voice: 340 }
  ヤム: { sprite: yamu, color: "#a8d080", voice: 760 }
  ジップ: { sprite: zippu, color: "#f0c050", voice: 920 }

allow:
  # 紙の束に「設計図」と名札をつける（mv で名前を変える。第4章のおさらい）
  - cmd: mv
    from: /var/backups/古い祠/紙の束
    to: /var/backups/古い祠/設計図
    if: "found_blueprint & !named_blueprint"
    wrong:
      - "コダマ: 名をつけるだけなら、置き場所は変えずともよかろう。"
  # 設計図をまとめる。祠でまとめても、かばんの中に直接まとめてもよい
  - cmd: tar
    from: /var/backups/古い祠/設計図
    to: /var/backups/古い祠/設計図.tar.gz
    if: "read_tag & !blueprint_packed"
    noExt:
      - "コダマ: ……書き置きに、包みの名には `.tar.gz` を添えよ、とあったな。"
    wrong:
      - "コダマ: ……中身は設計図であろう。包みの名も、それと分かるようにしておくがよい。"
  - cmd: tar
    from: /var/backups/古い祠/設計図
    to: ~/かばん/設計図.tar.gz
    if: "read_tag & !blueprint_packed"
    noExt:
      - "コダマ: ……書き置きに、包みの名には `.tar.gz` を添えよ、とあったな。"
  - cmd: mv
    from: /var/backups/古い祠/設計図.tar.gz
    to: ~/かばん/設計図.tar.gz
    if: "blueprint_packed & !blueprint_in_bag"
    wrong:
      - "コダマ: その包みは、かばんにしまうのであろう。"

intro:
  - "（市場町イチバから北へ。細い山道を、ひたすら登っていく。）"
  - "（やがて、崩れた石垣と、灰色の山肌が見えてきた。）"
  - "コダマ: ……静かすぎる。鳥の声もせぬ。"
  - "（道の先に、関所の柵が立っている。）"
guide:
  - "[まずは `ls` で、あたりを見渡してみよう。]"

objectives:
  - if: ch5_clear
    text: "第6章「坑道アナグラ」は制作中です"
  - if: reported_kaya
    text: "狭い抜け道を通って、先へ進もう"
  - if: blueprint_in_bag
    text: "カヤに、祠の箱のことを知らせよう"
  - if: blueprint_packed
    text: "設計図の包みを、かばんにしまおう"
  - if: read_tag
    text: "設計図を、かばんに入る大きさにまとめよう"
  - if: named_blueprint
    text: "箱の添え書きを読もう"
  - if: found_blueprint
    text: "紙の束に、名前をつけておこう"
  - if: reached_shrine
    text: "古い祠の箱を、あらためてからほどこう"
  - if: told_shrine
    text: "崖の向こうの、古い祠へ渡ろう"
  - if: kaya_told
    text: "カヤの話を、もう少し聞こう"
  - if: rescued_kaya
    text: "目を覚ましたカヤに、話を聞こう"
  - if: read_note
    text: "包みの中をあらためてから、ほどこう（`tar`）"
  - if: pass_shown
    text: "崩れた宿場を調べよう"
  - text: "関所を通ろう"

hints:
  - if: ch5_clear
    steps: ["第5章はここまで。遊んでくれてありがとう！"]
  - if: reported_kaya
    steps:
      - "カヤによると、狭い抜け道の先は、坑道アナグラに出る。"
      - "狭い抜け道は、山道の入口（`/var/backups`）にある。"
      - "`cd /var/backups/狭い抜け道`"
  - if: blueprint_in_bag
    steps:
      - "祠の箱のことを、カヤに知らせよう。"
      - "カヤは、崩れた宿場の、瓦礫の山にいる。"
      - "`cd /var/backups/崩れた宿場/瓦礫の山` → `cat カヤ`"
  - if: blueprint_packed
    steps:
      - "設計図の包みなら、かばんに入りそうだ。"
      - "運ぶのは `mv`。かばんの住所は `~/かばん`。"
      - "`mv 設計図.tar.gz ~/かばん/`"
  - if: read_tag
    steps:
      - "設計図の束は大きすぎて、かばんに入らない。添え書きに、まとめ方が書いてあった。"
      - "まとめるのは `tar -czf 新しい包みの名前 まとめる物`。"
      - "`tar -czf 設計図.tar.gz 設計図`"
  - if: named_blueprint
    steps:
      - "箱の中には、添え書きもあった。読んでみよう。"
      - "読むのは `cat`。"
      - "`cat 添え書き`"
  - if: found_blueprint
    steps:
      - "名もない紙の束では、どれがどれだか分からなくなる。「設計図」と名前をつけておこう。"
      - "名前を変えるのは `mv`（第4章で、看板の名前を直した）。"
      - "`mv 紙の束 設計図`"
  - if: reached_shrine
    steps:
      - "古い箱は、包みだ。ほどく前に、中をあらためよう。"
      - "`tar -tzf` でのぞいてから、包みのそばで `tar -xzf` でほどく。"
      - "`tar -tzf 古い箱.tar.gz` → `tar -xzf 古い箱.tar.gz`"
  - if: told_shrine
    steps:
      - "古い祠は、崖の向こうにある。道は途切れている。"
      - "沼でしたように、飛び石（リンク）をつなげば渡れる。行き先の祠の住所は、「祠」とつく場所を探せば分かる。"
      - "`cd /var/backups/崖の上` → `find /var/backups -name \"*祠*\"` → `ln -s /var/backups/古い祠 飛び石` → `cd 飛び石`"
  - if: kaya_told
    steps:
      - "スドウを探していることを、カヤに話してみよう。"
      - "カヤは、崩れた宿場の、瓦礫の山にいる。"
      - "`cd /var/backups/崩れた宿場/瓦礫の山` → `cat カヤ`"
  - if: rescued_kaya
    steps:
      - "包みから出てきたカヤに、話を聞こう。"
      - "話しかけるのは `cat`。"
      - "`cat カヤ`"
  - if: read_note
    steps:
      - "包みの名前を見ると、中に人がいそうだ。ほどく前に、中をあらためよう。"
      - "`tar -tzf 包み` でのぞき、包みのそばで `tar -xzf 包み` でほどく。"
      - "`cd /var/backups/崩れた宿場/瓦礫の山` → `tar -tzf カヤ.tar.gz` → `tar -xzf カヤ.tar.gz`"
  - if: pass_shown
    steps:
      - "崩れた宿場の瓦礫のどこかで、だれかが眠っている。そばの石に、書き置きがある。"
      - "読むのは `cat`。"
      - "`cd /var/backups/崩れた宿場` → `cat スドウの書き置き`"
  - steps:
      - "関所の番人に止められた。この先へ行くには、通行証がいる。"
      - "通行証は、かばんの中だ。読んで見せよう。"
      - "`cat ~/かばん/通行証`"

events:
  # 関所で、かばんの通行証を見せる（第4章のアプトの通行証）
  - on: cat
    at: /var/backups
    target: ~/かばん/通行証
    once: pass_shown
    lines:
      - "（かばんの通行証を、イプタに見せた。）"
      - "イプタ: ……アプトの通行証か。あいつの客なら、間違いはない。"
      - "イプタ: 通ってよし。……だが、この先は山崩れで、誰もおらんぞ。"
      - "コダマ: ……誰もおらぬ、か。"
  # 紙の束に「設計図」と名札をつけたら
  - on: mv
    exists: [/var/backups/古い祠/設計図]
    once: named_blueprint
    lines:
      - "（紙の束に、「設計図」と名札をつけた。）"
      - "コダマ: ……箱の中には、もうひとつ、なにか添えてあるようだな。"
  # 設計図をまとめたら
  - on: tar
    exists: [/var/backups/古い祠/設計図.tar.gz]
    once: blueprint_packed
    lines:
      - "（設計図の束が、小さな包みになった。）"
      - "{name}: これなら、かばんに入りそう。"
  # かばんの中に、直接まとめたとき
  - on: tar
    exists: [~/かばん/設計図.tar.gz]
    once: blueprint_in_bag
    set: [blueprint_packed]
    lines: &stored
      - "（設計図の包みを、かばんにしまった。）"
      - "コダマ: ……カヤに、知らせてゆこう。手がかりを見つけた、とな。"
  - on: mv
    exists: [~/かばん/設計図.tar.gz]
    once: blueprint_in_bag
    lines: *stored

companions:
  - name: コダマ
    joinIf: kodama_joined
    variants:
      - at: /var/backups
        lines:
          - "コダマ: ……山が、静まりかえっておる。関所の者に、通してもらわねばな。"
      - at: /var/backups/崩れた宿場
        lines:
          - "コダマ: 瓦礫の奥から、いくつも寝息が聞こえる。……ひとつ残らず、起こしてやりたいものだ。"
      - at: /var/backups/古い祠
        lines:
          - "コダマ: スドウは、なぜこれを、こんな山奥に預けたのであろうな。"

places:
  # 第0章で「？？？」として置いてあった /var（書庫と山道）に、廃墟山道を足す
  - path: /var
    visibleIf: ch4_clear
    children:
      - name: backups
        label: 廃墟山道
        icon: ruins
        theme: ruins
        bgm: 妖精の森のワルツ
        children:
          - name: イプタ
            mark: "!pass_shown"
            lines:
              - "イプタ: 止まれ。ここは山道の関所だ。"
              - "イプタ: この先へ行くなら、通行証を見せな。"
              - "{name}: 通行証……。"
            variants:
              - if: pass_shown
                lines: ["イプタ: 通ってよし。……この先は崩れて、誰もおらんはずだがな。"]
          - name: 関所の立て札
            icon: board
            lines:
              - "【山道の関所】"
              - "「この先、通行証なき者の立ち入りを禁ず」"

          - name: 崩れた宿場
            icon: ruins
            gate:
              if: "!pass_shown"
              lines: ["（関所の柵が、道をふさいでいる。イプタに通行証を見せないと、通れない。）"]
            onEnter:
              - once: entered_inn_ruins
                lines:
                  - "（崩れた家々。瓦礫のあちこちから、かすかな寝息が聞こえる。）"
                  - "{name}: 寝息……？ だれか、瓦礫の下にいるの？"
                  - "コダマ: 気配は、瓦礫の奥からだ。……そばの石に、なにか書きつけてあるな。"
            children:
              - name: スドウの書き置き
                icon: scroll
                mark: "pass_shown & !read_note"
                set: [read_note]
                learn: [tar, "tar -tzf", "tar -xzf"]
                lines:
                  - "（崩れた石に、細い字で書きつけてある。）"
                  - "「山が崩れる。宿場のみなを、包みにして眠らせた。包みの名には、みな `.tar.gz` と添えた。包みを作るときも、そう名づけよ。縛った包みのしるしだ。」"
                  - "「ほどくときは、まず中をあらためよ。中の名も知らずにほどけば、思わぬ物が散らばる。」"
                  - "「あらためるには `tar -tzf 包み`。ほどくには、包みのそばで `tar -xzf 包み`。 ― S」"
                  - "{name}: 宿場の人たちを、包みに……？ じゃあ、あの寝息は……！"
                  - "コダマ: うむ。瓦礫の奥で、包みの中の者たちが眠っておるのだ。`.tar.gz` と名のつくものを、探してみよ。"
                  - "コダマ: `-t` は中をのぞく、`-x` はほどく。`z` は縛った縄、`f` のうしろに包みの名を書く……ということらしい。"
                  - "{name}: まず中をのぞいて、それから、包みのそばでほどく……。"
                variants:
                  - if: read_note
                    lines:
                      - "「山が崩れる。宿場のみなを、包みにして眠らせた。包みの名には、みな `.tar.gz` と添えた。包みを作るときも、そう名づけよ。縛った包みのしるしだ。」"
                      - "「あらためるには `tar -tzf 包み`。ほどくには、包みのそばで `tar -xzf 包み`。 ― S」"
              - name: 耳石
                icon: stone
                lines:
                  - "（宿場の真ん中に立つ、大きな石だ。耳を当ててみても、何も聞こえない。）"
                  - "（……いや。すぐそばの瓦礫のすきまから、小さな寝息がする。）"
                variants:
                  - if: rescued_zip
                    lines: ["（耳を当てても、何も聞こえない。……鼓動は、止まったままだ。）"]
                  - if: kaya_told
                    lines:
                      - "（耳を当ててみる。……カヤの言うとおり、鼓動は聞こえない。）"
                      - "（かわりに、すぐそばの瓦礫のすきまから、小さな寝息がする。）"
              # 寄り道: 瓦礫のすきまに隠れた包み（ls -a）。ほどくと、中にまた包み
              - name: .崩れた荷.tar.gz
                icon: package
                lines: ["（瓦礫のすきまに押しこまれた、小さな包みだ。中から、小さな寝息がする。）"]
                onExtract:
                  once: opened_outer
                  lines:
                    - "（包みをほどくと、中から、もうひとつ小さな包みが出てきた。）"
                    - "{name}: 包みの中に、また包み……。"
                archive:
                  - name: ジップ.tar.gz
                    icon: package
                    lines: ["（さらに小さな包みだ。……まだ、寝息がする。）"]
                    onExtract:
                      once: rescued_zip
                      lines:
                        - "（小さな包みがほどけると、男の子が、ぱちりと目を開けた。）"
                        - "ジップ: ……あっ！ やっと出られた！ 包みの中の、そのまた中って、せまいんだもん！"
                    archive:
                      - name: ジップ
                        lines:
                          - "ジップ: ぼく、ジップ！ 荷物の中にかくれて遊んでたら、まとめて包まれちゃったの。"
                          - "ジップ: 包みの中に包み……ほどいても、まだ包み。……ふう、こわかった！"
                          - "{name}: ふふ、もう大丈夫だよ。"
                        variants:
                          - if: ch5_clear
                            lines: ["ジップ: こんどは、包みの外でかくれんぼするね！"]
              - name: 瓦礫の山
                icon: rock
                children:
                  - name: カヤ.tar.gz
                    icon: package
                    mark: "read_note & !rescued_kaya"
                    lines: ["（固く縛られた包みだ。中から、かすかに寝息が聞こえる。）"]
                    onList:
                      once: listed_kaya
                      lines: ["{name}: カヤ……人の名前だ！ この包みの中に、人がいる。"]
                    onExtract:
                      once: rescued_kaya
                      lines:
                        - "（包みがほどけると、中から、ひとりの娘が、ゆっくりと身を起こした。）"
                        - "カヤ: ……ん……。ここは……宿場……？ あたし、どうして……。"
                    archive:
                      - name: カヤ
                        mark: "!kaya_told | !told_shrine | (blueprint_in_bag & !reported_kaya)"
                        set: [kaya_told]
                        lines:
                          - "カヤ: 助けてくれたんだね。ありがとう。あたしはカヤ。この宿場の「聞き番」さ。"
                          - "{name}: 聞き番……？"
                          - "カヤ: この宿場にはね、耳石っていう大きな石があるんだ。前は、その石に、遠くの守り人の鼓動が、とくん、とくんって響いてたんだよ。"
                          - "カヤ: うちの家は代々、その音を聞いて、山の支えの調子を見てきたんだよ。"
                          - "{name}: 守り人の、鼓動……。"
                          - "カヤ: 鼓動は、前から少しずつ弱ってた。……でも、ある日、ぷつりと止まったんだ。"
                          - "カヤ: その日から、山の支えが弱って……あっという間に、山が崩れた。"
                          - "（ぷつりと、止まった。……あの日、{me}が `kill` と唱えた、あのときだ。）"
                          - "{name}: …………。"
                          - "コダマ: ……人の子よ。顔色が悪いぞ。"
                          - "{name}: ……ううん。なんでもない。"
                          - "カヤ: 崩れる前にね、鍵束を下げた男の人が来たんだ。その人が、宿場のみんなを包みにして、眠らせた。"
                          - "カヤ: 守るためだったんだと思う。……でも、人をあんなふうに包んでしまえるなんて、少しこわかった。"
                          - "{name}: 鍵束……。スドウだ。"
                        variants:
                          - if: reported_kaya
                            lines: ["カヤ: スドウに会えたら、宿場のみんなは無事だって、伝えておくれ。"]
                          # 祠の箱の中身を、かばんにしまったら、知らせに戻る。この先の道を教えてもらう
                          - if: blueprint_in_bag
                            set: [reported_kaya]
                            lines:
                              - "{name}: カヤ、祠の箱を開けてきたよ。中には、なにかの設計図が入ってた。"
                              - "カヤ: 設計図……？ スドウが、わざわざ崖の向こうに置いていくくらいだもの。きっと、大事な物だね。"
                              - "{name}: うん。スドウを探す手がかりになるかもしれない。"
                              - "カヤ: ……この先へ行くなら、山道の入口の、狭い抜け道を通るといい。山の奥の、坑道アナグラに出るよ。"
                              - "カヤ: スドウも、みんなを包み終えたあと、抜け道のほうへ歩いていったんだ。どこまで行ったのかは、分からないけど。"
                              - "{name}: 坑道……。ありがとう、カヤ。"
                              - "カヤ: 耳石の鼓動が、また聞こえる日が来るといいな。……気をつけてね。"
                          - if: told_shrine
                            lines: ["カヤ: 古い祠は、崖の向こうだよ。……気をつけてね。"]
                          # 2回目: スドウを探していると話すと、もういないこと、祠に箱を置いていったことを思い出す
                          - if: kaya_told
                            set: [told_shrine]
                            lines:
                              - "{name}: カヤ。{me}たち、その人……スドウを探して、旅をしてきたんだ。"
                              - "カヤ: そうなの？ ……もう、ここにはいないと思うよ。みんなを包み終えたら、すぐに出ていったから。"
                              - "カヤ: そういえば、包みながら、ひとりごとを言ってたっけ。『わしも年じゃ。あとを継ぐ者を探さねば』って。"
                              - "{name}: あとを、継ぐ……？"
                              - "カヤ: それと……崖の向こうの古い祠に、箱をひとつ置いていった気がする。なにが入ってるかは、分からないけど。"
                              - "{name}: 古い祠……。行ってみる！"
              - name: 崩れた家の跡
                icon: rock
                children:
                  - name: 石工.tar.gz
                    icon: package
                    lines: ["（大きな包みだ。中から、いびきのような寝息が聞こえる。）"]
                    onList:
                      once: listed_make
                      lines: ["{name}: メイク……この包みにも、だれかいる。"]
                    onExtract:
                      once: rescued_make
                      lines:
                        - "（包みがほどけると、がっしりした男が、大きく伸びをした。）"
                        - "メイク: ……ふあぁ。よく寝た……って、うわっ、宿場がめちゃくちゃだ！"
                    archive:
                      - name: メイク
                        lines:
                          - "メイク: おれはメイク、宿場の石工だ。石垣を組むのが仕事さ。"
                          - "メイク: 崩れたもんは、また組めばいい。……だが、山の支えが戻らねえと、組んだそばから崩れちまう。"
                          - "{name}: 山の支え……。"
                          - "メイク: 助けてくれた礼だ。崖の上は、足もとが脆い。気をつけて歩けよ。"
                        variants:
                          - if: ch5_clear
                            lines: ["メイク: さあて、石垣を組みなおすか。……あんたも、気をつけてな。"]
              - name: 崩れた井戸
                icon: well
                children:
                  - name: 羊飼い.tar.gz
                    icon: package
                    lines: ["（包みのそばに、羊の毛が落ちている。中から、小さな寝息がする。）"]
                    onList:
                      once: listed_yam
                      lines: ["{name}: ヤム……この包みにも、人がいる。"]
                    onExtract:
                      once: rescued_yam
                      lines:
                        - "（包みがほどけると、羊飼いの少年が、きょろきょろとあたりを見回した。）"
                        - "ヤム: ……あれ？ ぼくの羊たちは……？"
                    archive:
                      - name: ヤム
                        lines:
                          - "ヤム: ぼくはヤム。羊飼いだよ。……羊たち、山の向こうへ逃げちゃったのかな。"
                          - "ヤム: 包みになって眠ってるあいだ、ずっと夢を見てたんだ。鍵束の音が、ちりん、ちりんって、坑道のほうへ遠ざかっていく夢。"
                          - "{name}: 坑道のほうへ……。"
                        variants:
                          - if: ch5_clear
                            lines: ["ヤム: 羊たちを探しに行かなきゃ。……きみも、探している人に会えるといいね。"]

          - name: 崖の上
            icon: rock
            mode: "rwxrwxrwx"
            linkable: true
            children: []
            gate:
              if: "!pass_shown"
              lines: ["（関所の柵が、道をふさいでいる。イプタに通行証を見せないと、通れない。）"]
            onEnter:
              # カヤに祠のことを聞く前に来たときは、景色だけ
              - if: "!told_shrine"
                once: entered_cliff
                lines:
                  - "（崖の先で、道がぷっつりと途切れている。向こう岸に、小さな祠が見える。）"
              - if: told_shrine
                once: cliff_talk
                lines:
                  - "（崖の先で、道がぷっつりと途切れている。向こう岸に、小さな祠が見える。）"
                  - "コダマ: ……沼でも、こんなふうに道が途切れておったな。"
                  - "{name}: 飛び石でしょ？ 覚えてるよ！ ……でも、あの呪文には、行き先の住所が要るんだった。"
                  - "{name}: 祠の住所なんて、分からないよ……。"
                  - "コダマ: 分からぬなら、調べればよい。名をすべて知らずとも、「祠」とつく場所を探せば、見つかろう。"

          # 崖の向こう。飛び石（リンク）を通らないと入れない。find で見つけるか、渡るまで、地図にも ls にも出ない
          - name: 古い祠
            icon: shrine
            # 設計図をまとめて（tar -czf）、かばんへ運び出す（mv）ので、書きこめる
            mode: "rwxrwxrwx"
            needsLink:
              - "（崖にへだてられて、ここからは行けない。）"
            onEnter:
              - once: reached_shrine
                lines:
                  - "（飛び石を渡って、崖の向こうの祠にたどりついた。）"
                  - "（苔むした祠の中に、古い箱の包みがひとつ、置かれている。）"
            children:
              - name: 古い箱.tar.gz
                icon: package
                mark: "reached_shrine & !found_blueprint"
                lines: ["（古い木の箱を、縄でぎゅっと縛った包みだ。）"]
                onList:
                  once: listed_box
                  lines: ["{name}: 紙の束と、添え書き……？ 人じゃないみたい。"]
                onExtract:
                  once: found_blueprint
                  lines:
                    - "（包みをほどくと、古い紙の束と、一枚の添え書きが出てきた。）"
                    - "（紙には、細かな図と、びっしりと書きこまれた文字。……なんだろう、これ。）"
                    - "コダマ: ……なにかの、設計図のように見えるな。"
                    - "{name}: 設計図……？"
                    - "コダマ: 名もない紙の束のままでは、どれがどれだか分からなくなろう。設計図なら、「設計図」と名づけておくがよい。"
                archive:
                  # ほどいたあと、プレイヤーが mv で「設計図」と名札をつける
                  - name: 紙の束
                    icon: scroll
                    movable: true
                    onMv:
                      - "（紙の束は大きすぎて、かばんの口に入らない。）"
                      - "コダマ: ……添え書きに、なにか書いてあったのではないか。"
                    children:
                      - name: 一枚目
                        icon: item
                        lines:
                          - "（細かな図と、びっしりと書きこまれた文字。古い字で、ほとんど読めない。）"
                          - "（かろうじて読めるのは、「見守り、数え、回す」という言葉だけだ。）"
                      - name: 二枚目
                        icon: item
                        lines:
                          - "「鼓動は、枝分かれして、各地の支えへ届く。耳石は、その音を聞くための石」"
                          - "{name}: 耳石……。カヤの宿場の、あの石のことだ。"
                      - name: 三枚目
                        icon: item
                        lines:
                          - "「止まったものを目覚めさせるには、まず形を直し、そして――」"
                          - "（その先は、鍵束の形をした印で、かたく封じられている。）"
                  - name: 添え書き
                    icon: scroll
                    mark: "named_blueprint & !read_tag"
                    set: [read_tag]
                    learn: ["tar -czf"]
                    lines:
                      - "（スドウの字で、短く書きつけてある。）"
                      - "「この箱を開けた者へ。中の物は大きい。持ち出すなら、まとめ直してゆけ。」"
                      - "「まとめるには `tar -czf 新しい包みの名前 まとめる物`。 ― S」"
                      - "コダマ: `-c` は、まとめる、か。……包みは、ほどくだけでなく、作ることもできるのだな。"
                    variants:
                      - if: read_tag
                        lines:
                          - "「この箱を開けた者へ。中の物は大きい。持ち出すなら、まとめ直してゆけ。」"
                          - "「まとめるには `tar -czf 新しい包みの名前 まとめる物`。 ― S」"

          - name: 狭い抜け道
            icon: path
            children: []
            gate:
