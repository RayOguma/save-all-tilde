                lines:
                  - "（細い抜け道を、手さぐりで進んでいく。だんだん、あたりが暗くなってきた。）"
                  - "コダマ: ……この先が、坑道アナグラか。"
                  - "（耳石の鼓動を止めたのは、{me}だ。……いつか、ちゃんと向き合わなきゃ。）"
                  - "{name}: スドウも、この道を通っていったんだね。……どこまで行けば、会えるんだろう。"
                  - "コダマ: 道は、まだ続いておる。ひとつずつ、進むしかあるまい。"
                effect: chapterEnd
