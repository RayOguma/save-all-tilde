# 第3章｜ムラガレ — 心を閉ざした村（ls -l の鍵・chmod・groups・write）
#
# 書き方は ch0〜ch2.yaml の先頭を参照。この章で増えたもの:
#   group      組（グループ）。なければ持ち主と同じ名前の組
#   onWrite    write で声を届けられたときの反応。上から順に、if と has（どれかの言葉が入っているか）が合った最初のもの
#   chown / chmod / joinGroup   話しかけたときやイベントで、持ち主・鍵のかけ方・プレイヤーの組を変える
#   onChmod    場所の鍵を chmod で変えたあとの反応。上から順に、can（変えたあとに持っている鍵。"x" など）が合った最初のもの
#
# 物語の流れ（フラグの順）:
#   talked_haru（ハルの咳）→ met_groupu（鍵の読み方・chmod。空き家を譲られる）→ akiya_unlocked（chmod で開けた）
#   → entered_akiya（グロウプ婆が外から write で話しかける。ハルの兄の病）（組に入る・groups。ハルの薬を頼まれる・write）= asked_medicine
#   → asked_herb（write で頼むと、薬草を頼まれる）→ herb_found（物置の棚を find で探す。第1章のおさらい）→ got_herb（物置）→ medicine_open（薬を作って扉を開けてくれる）
#   → got_medicine（ハルの薬と、兄の分の薬）→ gave_haru → ch3_clear

chapter: { no: 3, title: ムラガレ, startIf: ch2_clear, startAt: /home/ムラガレ }

# この章をクリアすると手に入るもの（「章を選ぶ」で次の章から始めるとき、テストの準備に使う）
clear:
  flags: [talked_haru, met_groupu, akiya_unlocked, entered_akiya, asked_medicine, asked_herb, herb_found, got_herb, medicine_open, got_medicine,
          gave_haru, ch3_clear]
  learned: [chmod, groups, write]
  groups: [ムラガレ]
  perms:
    /home/ムラガレ/空き家: { owner: きみ, mode: "rwx------" }
    /home/ムラガレ/薬屋: { mode: "rwx---r-x" }

characters:
  グロウプ婆: { sprite: groupu, color: "#c8a0e0", voice: 420 }
  ハル: { sprite: haru, color: "#a0d0f0", voice: 620 }
  薬屋のじいさん: { sprite: herbalist, color: "#a8d890", voice: 320 }

intro:
  - "（家々の扉は、どれもかたく閉ざされている。道には、誰もいない。）"
  - "{name}: チルダ村と、同じ……？ でも、草は風に揺れてる……。"
  - "コダマ: ……止まってはおらぬ。この村は、ゆっくりと冷えておるのだ。"
  - "コダマ: 時は流れておるが、ぬくもりが抜けていくような……そんな気配よ。"
guide:
  - "[まずは `ls` で、村を見渡してみよう。]"

objectives:
  - if: ch3_clear
    text: "第4章「市場町イチバ」は制作中です"
  - if: gave_haru
    text: "グロウプ婆に知らせよう"
  - if: got_medicine
    text: "ハルに薬を届けよう"
  - if: medicine_open
    text: "薬屋に、薬を取りに行こう"
  - if: got_herb
    text: "薬屋のじいさんに、薬草のことを知らせよう（`write`）"
  - if: asked_herb
    text: "物置で薬草を探そう（`find`）"
  - if: asked_medicine
    text: "薬屋のじいさんに、ハルの薬を頼もう（`write`）"
  - if: akiya_unlocked
    text: "空き家に入ってみよう"
  - if: met_groupu
    text: "空き家の鍵を開けよう（`chmod`）"
  - if: talked_haru
    text: "グロウプ婆に会おう"
  - text: "村の様子を調べよう"

hints:
  - if: gave_haru
    steps:
      - "ハルに薬を届けたことを、グロウプ婆に知らせよう。"
      - "グロウプ婆の家は、ムラガレ（`/home/ムラガレ`）の中にある。"
      - "`cd /home/ムラガレ/グロウプ婆の家` → `cat グロウプ婆`"
  - if: got_medicine
    steps:
      - "ハルに、胸の薬を届けよう。"
      - "ハルは、ムラガレ（`/home/ムラガレ`）の中にいる。"
      - "`cd /home/ムラガレ` → `cat ハル`"
  - if: medicine_open
    steps:
      - "薬屋のじいさんが、扉を開けてくれた。薬を取りに行こう。"
      - "`ls -l` で見ると、薬屋の鍵の右の三文字（よその人）に x がついたはずだ。"
      - "`cd /home/ムラガレ/薬屋` → `cat 薬屋のじいさん`"
  - if: got_herb
    steps:
      - "薬草が手に入った。じいさんに知らせよう。"
      - "閉じた扉ごしに声を届けるのは `write`。ことばに「薬草」を入れよう。"
      - "`write 薬屋のじいさん \"薬草を持ってきました\"`"
  - if: asked_herb
    steps:
      - "薬草は、村の物置にあるらしい。物置は、村の組の者しか入れない。"
      - "`ls -l` で物置の鍵を見よう。真ん中の三文字は「家族（同じ組の人）」への許しだ。`groups` で、自分の組も確かめよう。"
      - "`cd /home/ムラガレ/物置` → `find . -name \"*薬草*\"` → `cat 棚/下の段/干した薬草`"
  - if: asked_medicine
    steps:
      - "薬屋の扉は閉まっている。でも、声なら届く。ハルの薬を頼もう。"
      - "`write 名前 \"ことば\"` で声を届けよう。ていねいに頼むのが大事だ。"
      - "`write 薬屋のじいさん \"ハルの薬をください\"`"
  - if: akiya_unlocked
    steps:
      - "空き家の鍵が開いた。中に入ってみよう。"
      - "空き家は、ムラガレ（`/home/ムラガレ`）の中にある。"
      - "`cd /home/ムラガレ/空き家`"
  - if: met_groupu
    steps:
      - "空き家は、もうきみのものだ。自分の家なら、鍵のかけ方を変えられる。"
      - "`chmod` のあとに「だれに」「開けるか閉めるか」「どの鍵」を書く。`u` は自分、`+` は開ける、`rwx` はぜんぶの鍵。"
      - "`chmod u+rwx /home/ムラガレ/空き家` → `cd /home/ムラガレ/空き家`"
  - if: talked_haru
    steps:
      - "村長のグロウプ婆の家だけは、まだ開いているらしい。"
      - "グロウプ婆の家は、ムラガレ（`/home/ムラガレ`）の中にある。"
      - "`cd グロウプ婆の家` → `cat グロウプ婆`"
  - steps:
      - "村の中に、誰かいるようだ。"
      - "話しかけるには `cat`。"
      - "`ls` → `cat ハル`"

events:
  # 物置の棚から、find で干した薬草を見つけたら
  - on: find
    found: /home/ムラガレ/物置/棚/下の段/干した薬草
    if: asked_herb
    once: herb_found
    lines:
      - "{name}: あった！ 棚の、下の段だ。"
      - "[見つけた道のりで `cat 棚/下の段/干した薬草` と書けば、取り出せる。]"

companions:
  - name: コダマ
    joinIf: kodama_joined
    variants:
      - at: /home/ムラガレ
        lines:
          - "コダマ: ……守り人を失うた村でも、失われ方によって、傷み方は違うのであろう。"
          - "コダマ: ぷつりと止まったおまえの村は、時ごと凍りついた。じわじわ弱ったこの村は、ぬくもりだけが抜けていく。"
          - "コダマ: 扉は閉まっておっても、中の者は生きておる。声を届けてやるがよい。"

places:
  - path: /home/ムラガレ
    # 冷えていく村は、曲なし
    bgm: none
    owner: グロウプ婆
    group: ムラガレ
    children:
      - name: 掲示板
        icon: board
        lines:
          - "【ムラガレ 掲示板】"
          - "・薬屋 本日休業（……いつまで？）"
          - "・物置は、村の組の者なら誰でも使ってよし"
          - "※ 扉が開かぬ家には、`write` で声をかけること ― グロウプ"

      - name: ハル
        owner: ハル
        mark: "!talked_haru | (got_medicine & !gave_haru)"
        set: [talked_haru]
        lines:
          - "ハル: ……ごほっ、ごほっ。……ああ、ごめんよ。旅の人かい？ めずらしいね、こんな村に。"
          - "ハル: 見てのとおりさ。誰も彼も、心を閉ざしちまった。扉を叩いても、返事もない。"
          - "ハル: ……あんたの村も？ そうかい……ここだけの話じゃ、なかったんだね。"
          - "{name}: ……チルダ村も、みんな止まってしまって。"
          - "ハル: ……ごほっ。村長のグロウプ婆に会うといいよ。あの家だけは、まだ開いてる。"
        variants:
          - if: gave_haru
            lines:
              - "ハル: 薬のおかげで、胸が楽になったよ。"
              - "ハル: グロウプ婆が待ってるよ。顔を出しておやり。"
              - "ハル: ……兄さんを、頼んだよ。"
          - if: got_medicine
            set: [gave_haru]
            lines:
              - "{name}: ハル、薬屋のじいさんから、薬をもらってきたよ。"
              - "ハル: ……え？ あたしに？"
              - "（ハルは薬を飲んだ。しばらくすると、咳がおさまってきた。）"
              - "ハル: ……楽になった。ありがとう。"
              - "ハル: これ、兄さんがいつも飲んでた薬と、同じ匂いがする。……そっか、あたしも、兄さんと同じ病気だったんだね。"
              - "{name}: お兄さんの分も、預かってる。坑道を通ることになったら、必ず届けるよ。"
              - "ハル: ……兄さんを、頼んだよ。"
              - "ハル: ……そうだ。グロウプ婆がね、あんたが戻ったら、顔を出すように言ってたよ。"
              - "{name}: グロウプ婆が？ わかった、行ってみる。"
          - if: talked_haru
            lines:
              - "ハル: ごほっ……。だいじょうぶ、いつものことさ。"
              - "ハル: グロウプ婆の家は、すぐそこだよ。"

      - name: グロウプ婆の家
        icon: house
        theme: wood
        owner: グロウプ婆
        children:
          - name: グロウプ婆
            owner: グロウプ婆
            mark: "(talked_haru & !met_groupu) | (gave_haru & !ch3_clear)"
            set: [met_groupu]
            learn: [chmod]
            chown: { path: /home/ムラガレ/空き家, owner: きみ }
            lines:
              - "グロウプ婆: ……おや、見ない顔じゃね。チルダ村の子かい。"
              - "グロウプ婆: わしはグロウプ。この村の組をまとめとる婆じゃ。"
              - "グロウプ婆: 見てのとおり、村の者はみな、扉を閉ざしてしもうた。"
              - "{name}: どうして、みんな……？"
              - "グロウプ婆: この村にもな、「見えない支え」がおったんじゃ。村の時を回し、みなの心をつないでおった。"
              - "グロウプ婆: じゃが、ある日ぷつりと消えたのではない。少しずつ、少しずつ弱っていって……気がついたら、おらんようになっとった。"
              - "{name}: ……チルダ村も、守り人のモリビトが止まって……。でも、チルダ村は一瞬で、みんな止まってしまった。話すこともできなくて……。"
              - "グロウプ婆: そうかい……。ぷつりと止められたなら、時も止まる。うちのは、じわじわと弱った。"
              - "グロウプ婆: だから、みな動けはするし、話もできる。……じゃが心が冷えて、扉を閉ざしてしもうた。作物は育たんし、病も重うなりやすうなった。"
              - "{name}: ……{me}たちの村だけじゃ、なかったんだ。"
              - "グロウプ婆: ……扉のことを教えておこう。`ls -l` で見える rwx の並びは、扉にかかった鍵のかけ方じゃ。"
              - "グロウプ婆: `r` は、窓から中をのぞける。`w` は、中に物を置ける。`x` は、扉を開けて中へ入れる。"
              - "グロウプ婆: それが三文字ずつ、三組並んどる。左から「持ち主」、真ん中が「家族」――同じ組の者、右が「よその人」への許しじゃ。"
              - "{name}: 持ち主と、家族と、よその人……。"
              - "グロウプ婆: `-` は、その鍵が閉まっとるしるし。たとえば `drwx------` なら……。"
              - "{name}: 待って。いちばん前の `d` は？ 三文字ずつなら、ひとつ多いよ。"
              - "グロウプ婆: ほっほ、よう見とるの。先頭の一文字は鍵ではない。それが「何か」のしるしじゃ。"
              - "グロウプ婆: `d` は場所――家や部屋のように、中へ入れるもの。人や物なら `-`。沼の道しるべのようなリンクなら `l` じゃ。"
              - "{name}: じゃあ `drwx------` は……場所で、持ち主だけが、のぞけて、置けて、入れる？"
              - "グロウプ婆: そのとおり。持ち主のほかは、だれも入れん。"
              - "グロウプ婆: ……そうじゃ、村はずれの空き家を、お前にやろう。旅の宿にでも使うがええ。"
              - "{name}: えっ、いいんですか！？"
              - "（グロウプ婆は、帳面に何かを書きつけた。）"
              - "グロウプ婆: 持ち主を変えるのは、村長の仕事よ。……お前の村の長も、そういう名だろう？ ほっほ。"
              - "グロウプ婆: 自分の家なら、鍵のかけ方は自分で変えられる。`chmod` と唱えるがええ。change mode――鍵のかけ方を変える、という意味じゃ。"
              - "{name}: `chmod`……。どうやって唱えるの？"
              - "グロウプ婆: `chmod` のうしろに、「だれの」「開けるか閉めるか」「どの鍵を」の三つをくっつけて書く。それから、間をあけて家の名前じゃ。"
              - "グロウプ婆: 「だれの」は、`u` が持ち主――つまり自分。`g` が家族、`o` がよその人じゃ。"
              - "{name}: 自分が `u`、家族が `g`、よその人が `o`……。"
              - "グロウプ婆: 「開けるか閉めるか」は、`+` で開けて、`-` で閉める。「どの鍵を」は、さっきの `r` `w` `x` じゃ。"
              - "グロウプ婆: たとえば `chmod u+x 空き家` なら、「自分に、入る鍵を開ける」。"
              - "{name}: じゃあ、のぞく・置く・入る、ぜんぶ開けるなら……`u+rwx`？"
              - "グロウプ婆: ほっほ、そのとおり。空き家は村の中じゃから、ここからなら `chmod u+rwx ../空き家` と唱えればええ。"
            variants:
              - if: ch3_clear
                lines: ["グロウプ婆: 気をつけて行くんじゃよ。……村のことは、心配いらん。扉は、また開く。"]
              - if: gave_haru
                set: [ch3_clear]
                lines:
                  - "グロウプ婆: ハルに、薬を届けてくれたそうじゃな。……ありがとうよ。"
                  - "グロウプ婆: あのがんこなじいさんの扉まで開けさせるとは。閉じた扉も、声は届く。……お前は、それを村に思い出させてくれた。"
                  - "グロウプ婆: ……そういえば、まだ聞いとらんかったな。お前さんたち、なんでこの村へ来なすった？"
                  - "{name}: スドウっていう人を探してるんです。チルダ村を、元に戻してもらうために。"
                  - "グロウプ婆: スドウ……。聞かん名じゃな。して、ここからどこへ向かうつもりじゃ？"
                  - "{name}: 坑道アナグラです。ハルのお兄さんに、薬を届けなきゃ。"
                  - "グロウプ婆: 坑道か。なら、まずは市場町イチバを通っていくとええ。坑道へは、イチバの先の山道を越えていくんじゃ。"
                  - "グロウプ婆: イチバは人の集まる町じゃ。道にくわしい者もおろうし、スドウの噂も、聞けるかもしれん。"
                  - "{name}: ありがとう、グロウプ婆。"
                  - "コダマ: ……人の子よ。この村のありさま、おまえの村と、よく似ておるな。"
                  - "{name}: うん……。見えない支えがいなくなったって、グロウプ婆も言ってた。"
                  - "コダマ: 村の支えが、ひとつ、またひとつと消えておる。……偶然とは思えぬ。"
                  - "コダマ: スドウなら、何か知っておろう。……まずは、イチバへ急ごう。"
                  - "{name}: うん。……待ってて、ムラガレのみんなも。"
                effect: chapterEnd
              - if: asked_medicine
                lines:
                  - "グロウプ婆: じいさんには、`write` で声をかけておくれ。……頑固じゃが、根はやさしい。"
                  - "グロウプ婆: 物置は、組の者なら入れる。鍵の真ん中の三文字を、見てごらん。"
              - if: met_groupu
                lines:
                  - "グロウプ婆: 空き家は、もうお前のものじゃ。`ls -l` で見れば、持ち主の名が分かる。"
                  - "グロウプ婆: `chmod` のうしろに、だれの（`u` 自分・`g` 家族・`o` よその人）、開けるか閉めるか（`+` `-`）、どの鍵（`r` `w` `x`）。"
                  - "グロウプ婆: ここからなら `chmod u+rwx ../空き家`……自分に、ぜんぶの鍵を開ける、じゃ。"
          - name: 古い帳面
            icon: item
            lines:
              - "（村の組の名簿だ。）"
              - "「組 ムラガレ ― グロウプ、ハル、薬屋のじいさん、鍛冶屋のノーハップ……」"
              # 伏線（調べても、本編では何も分からない。くわしくは手元の docs/sequel.md の伏線の表）
              - "（いちばん下に、もう一行ある。インクがにじんでいて、読めない。）"
            variants:
              - if: entered_akiya
                lines:
                  - "（村の組の名簿だ。）"
                  - "「組 ムラガレ ― グロウプ、ハル、薬屋のじいさん、鍛冶屋のノーハップ……{name}」"
                  - "{name}: ……名前が、書いてある。"
                  - "（そのさらに下に、もう一行。インクがにじんでいて、読めない。）"

      - name: 空き家
        icon: house
        theme: wood
        owner: グロウプ婆
        group: ムラガレ
        mode: "---------"
        mark: "met_groupu & !entered_akiya"
        deniedLines:
          - "（扉には、錠がいくつもかかっている。）"
        onChmod:
          - can: x
            once: akiya_unlocked
            lines:
              - "（カチリ、と空き家の錠がはずれる音がした。）"
              - "{name}: 開いた……！ これで、空き家に入れるはず。"
              - "コダマ: うむ。もう、おまえの家だ。入ってみるがよい。"
          - if: "!akiya_unlocked"
            lines:
              - "コダマ: ……鍵は変わったようだが、まだ中へは入れぬな。"
              - "コダマ: 中へ入るための鍵は `x` であったろう。自分に `x` が開いておるか、よく見るがよい。"
        onEnter:
          - once: entered_akiya
            joinGroup: ムラガレ
            set: [asked_medicine]
            learn: [groups, write]
            lines:
              - "（ほこりっぽいけれど、居心地のよさそうな家だ。）"
              - "（そのとき、閉じた扉の外から、グロウプ婆の声が届いた。）"
              - "グロウプ婆: `write {name}` ……ほっほ、開けられたようじゃな。これでお前も、しばらくはこの村の一員じゃ。"
              - "グロウプ婆: 村の組「ムラガレ」に、お前の名も入れておいた。`groups` と唱えれば、自分がどの組にいるか分かる。"
              - "{name}: {me}も、この村の組に……。"
              - "グロウプ婆: 組の者……家族にだけ開く扉もある。鍵の真ん中の三文字が、それじゃよ。"
              - "グロウプ婆: ……それとな、ひとつ頼みがある。"
              - "{name}: 頼み……？"
              - "グロウプ婆: ハルの咳を聞いたかい。あの子の兄のノーハップは鍛冶屋でな、同じ胸の病を持っとった。……とうとう、あの子にも出はじめた。"
              - "グロウプ婆: 薬屋のじいさんなら、よく効く薬を作れる。じゃが、じいさんは扉を閉ざしたきりでな。"
              - "{name}: 扉が閉まってたら、頼みようが……。"
              - "グロウプ婆: 扉は閉まっとっても、声は届く。……いま、わしがこうして、扉の外から話しとるようにな。"
              - "グロウプ婆: `write 名前 \"ことば\"` と唱えれば、扉のすきまに手紙を差しこむように、声を届けられるんじゃ。"
              - "グロウプ婆: ハルの薬を、頼んでみてくれんか。"
        children:
          - name: 古いベッド
            icon: bed
            lines: ["（旅の疲れが、少しとれた気がする。）"]

      - name: 薬屋
        icon: house
        theme: wood
        owner: 薬屋のじいさん
        mode: "rwx------"
        deniedLines:
          - "（「本日休業」の札がかかっている。中で、人の気配がする。）"
        children:
          - name: 薬屋のじいさん
            owner: 薬屋のじいさん
            mark: "(asked_medicine & !asked_herb) | (got_herb & !got_medicine)"
            set: [got_medicine]
            lines:
              - "薬屋のじいさん: よう来た。薬草、ありがとうよ。"
              - "薬屋のじいさん: これが、ハルの薬じゃ。胸の病によう効く。"
              - "（胸の薬を受け取った。）"
              - "{name}: ありがとうございます！ すぐにハルに届けます。"
              - "薬屋のじいさん: ……それとな、もうひと包み、作っておいた。"
              - "薬屋のじいさん: ハルの兄の、ノーハップの分じゃ。あの子も同じ病でな、わしが、いつも薬を渡しておった。"
              - "{name}: お兄さんの……？"
              - "薬屋のじいさん: 坑道へ鉱石を掘りに行ったきり、もう何日も戻らん。薬も、とうに切れておるはずじゃ。"
              - "薬屋のじいさん: わしは足が悪うて、坑道までは行けん。……もし、坑道へ行くことがあったら、渡してやってくれんか。"
              - "{name}: ……コダマ、坑道って……。"
              - "コダマ: 坑道アナグラ……。名だけは知っておる。山の向こうの、深い穴だ。スドウを追うなら、いずれ通ることになろう。"
              - "{name}: ……わかりました。お兄さんに、必ず届けます。"
              - "（兄の分の薬も、預かった。）"
              - "薬屋のじいさん: ……ありがとうよ。まずは、ハルに薬を届けてやっておくれ。"
            variants:
              - if: got_medicine
                lines: ["薬屋のじいさん: ハルの兄の薬、なくさんようにな。"]
            onWrite:
              - if: medicine_open
                lines: ["薬屋のじいさん: 開いとるよ。薬を取りにきなさい。"]
              - if: got_herb
                has: [薬草]
                set: [medicine_open]
                chmod: { path: /home/ムラガレ/薬屋, mode: "rwx---r-x" }
                lines:
                  - "薬屋のじいさん: ……おお、薬草か！ これで薬が作れる。"
                  - "（扉の向こうで、ごりごりと薬を挽く音がする。）"
                  - "薬屋のじいさん: ……できたぞ。扉を開けておいた。取りにきなさい。"
                  - "（ガチャリ、と扉の鍵が変わる音がした。）"
                  - "[`ls -l` で見ると、薬屋の鍵のかけ方が変わっているはずだ。]"
              - has: [開けろ, 早く, さっさと, おい, 出てこい, よこせ]
                lines:
                  - "薬屋のじいさん: ……なんじゃ、その口のきき方は。"
                  - "薬屋のじいさん: 出直してきなさい。"
              - if: asked_herb
                has: [薬草]
                lines: ["薬屋のじいさん: ……薬草は、まだかの？ 物置にあるはずじゃ。"]
              - if: "!asked_herb"
                has: [お願い, ください, 下さい, 頼み, すみません, 薬, ハル, 助けて]
                set: [asked_herb]
                lines:
                  - "薬屋のじいさん: ……ふむ、礼儀を知っとるな。"
                  - "薬屋のじいさん: ……薬がいるのか。咳の音が、ここまで聞こえとった。ハルじゃろう。"
                  - "薬屋のじいさん: あの子にも、兄と同じ病が出たか……。"
                  - "{name}: お願いします。ハルを、助けてあげてください。"
                  - "薬屋のじいさん: じゃがな、薬草を切らして、薬が作れんのじゃ。村の者があんなふうになってから、摘みにも行けん。"
                  - "薬屋のじいさん: 村の物置に、干した薬草があるはずじゃ。……どの棚にしまったかは、すまん、覚えとらん。持ってきてくれたら、薬を作ってやろう。"
                  - "薬屋のじいさん: ……物置は、村の組の者でなければ入れんがの。"
              - if: asked_herb
                has: [お願い, ください, 下さい, 頼み, すみません, 薬, ハル, 助けて]
                lines: ["薬屋のじいさん: 薬草を、頼んだぞ。物置じゃ。"]
              - lines:
                  - "薬屋のじいさん: ……だれじゃ。用件はなんじゃ？"
                  - "薬屋のじいさん: 頼みごとなら、ちゃんと頼みなさい。"
          - name: 薬棚
            icon: item
            lines: ["（小さな引き出しが、いくつも並んでいる。どれも、からっぽだ。）"]
            variants:
              - if: medicine_open
                lines: ["（引き出しのひとつに、できたばかりの薬が入っている。）"]

      - name: 物置
        icon: house
        owner: グロウプ婆
        group: ムラガレ
        mode: "rwxrwx---"
        deniedLines:
          - "（扉に「村の組の者のほか、入るべからず」と書いてある。）"
        onEnter:
          - if: "asked_herb & !herb_found"
            once: entered_storeroom
            lines:
              - "（物置の中は、棚や箱でごちゃごちゃしている。薬草は、どこだろう。）"
              - "コダマ: 探しものなら、森で覚えた言葉があったろう。"
        children:
          # 薬草は棚の奥。find で探す（第1章のおさらい）
          - name: 棚
            icon: item
            children:
              - name: 上の段
                icon: item
                children:
                  - name: 種の袋
                    icon: item
                    lines: ["（来年まくはずだった、作物の種だ。）"]
              - name: 下の段
                icon: item
                children:
                  - name: 縄の束
                    icon: item
                    lines: ["（太い縄が、きちんと巻いてある。）"]
                  - name: 干した薬草
                    icon: item
                    visibleIf: "!got_herb"
                    mark: "asked_herb & !got_herb"
                    set: [got_herb]
                    lines:
                      - "（棚の奥に、干した薬草の束がしまってある。）"
                      - "（ひと束、ていねいに取り出した。）"
                      - "{name}: これで、ハルの薬が作れる……。"
          - name: 古い農具
            icon: item
            lines: ["（くわやかまが、きちんと並べてある。手入れはされているようだ。）"]

      - name: 鍛冶場
        icon: house
        theme: wood
        owner: ノーハップ
        mode: "rwxr--r--"
        deniedLines:
          - "（扉は閉まっている。……でも、窓から中がのぞけそうだ。）"
          - "（入れなくても、`ls` なら中が見えるかもしれない。）"
        children:
          - name: 坑道へ行ってくる_兄より
            icon: item
            lines: ["（手紙だ。中に入れないので、読めない。）"]
          - name: 冷えた炉
            icon: item
            lines: ["（炉の火は、とうに消えている。）"]

      - name: 裏の畑
        icon: moss
        children:
          - name: 育たない作物
            icon: item
            lines:
              - "（作物が、みな途中で育つのをやめている。）"
              - "コダマ: ……時が止まれば、芽も伸びぬ。"
