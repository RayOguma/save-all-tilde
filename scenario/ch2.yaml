# 第2章｜もつれ沼 — 見た目と実体（ls -l / file / ln -s / unlink）
#
# 書き方は ch0.yaml・ch1.yaml の先頭を参照。この章で増えたもの:
#   link       シンボリックリンク。「link: 行き先」と書く（行き先は、リンクのある場所から見た道のり）
#   onFile     リンクを file で調べたときのイベント
#   onBroken   リンク切れのまま cd しようとして、入れなかったときのイベント
#   arg        イベントの条件。コマンドにこの名前を書いたときだけ（リンクと行き先を、呼んだ名前で分ける）
#   fileDesc   file で調べたときの正体（ふつうのファイル）
#   needsLink  リンク（飛び石）を通らないと入れない場所。直接 cd しようとしたときの描写。
#              沼の向こうにあるので、find で見つけるか飛び石で渡るまで、地図にも ls にも出ない
#   mode       rwxrwxrwx のように「その他」に w がある場所には、プレイヤーがリンクを作れる
#   linkable   飛び石（ln -s）を置ける場所。ほかの場所には「置く用事はない」（世界を散らかさないように）
#
# 物語の流れ（フラグの順）:
#   （tried_path_a: 渡り道Aに入れなかった）→ met_tsunagi（ls -l）
#   → heard_ani・heard_otouto（カエルを両方の名前で呼ぶ）→ frog_hint（file）→ frog_revealed → learned_ln（ln -s / unlink）
#   → crossed_1（中州）→ crossed_2（葦の原）→ found_far_shore（find）→ reached_far_shore → ch2_clear
#   寄り道: found_shrine（沈んだ祠）

chapter: { no: 2, title: もつれ沼, startIf: ch1_clear, startAt: /lib }

# この章をクリアすると手に入るもの（「章を選ぶ」で次の章から始めるとき、テストの準備に使う）
clear:
  flags: [tried_path_a, met_tsunagi, heard_ani, heard_otouto, frog_hint, frog_revealed, learned_ln, crossed_1, crossed_2, found_far_shore, reached_far_shore, ch2_clear]
  learned: ["ls -l", file, ln, unlink]
  discovered: [/home/ムラガレ]

characters:
  ツナギ: { sprite: tsunagi, color: "#9fc88a", voice: 240 }
  カエル兄: { sprite: frog, color: "#8fd35a", voice: 760 }

intro:
  - "（苔むした門をくぐると、足もとが、ぐにゃりとやわらかくなった。）"
  - "（にごった水と、からみあった木の根。どこまでも、沼が広がっている。）"
  - "コダマ: ……ここは、もつれ沼。われは、この沼が好かぬ。"
  - "コダマ: 何もかもが、何かに化けておる。見た目を、うのみにするでないぞ。"
guide:
  - "[まずは `ls` で見渡してみよう。]"

objectives:
  - if: ch2_clear
    text: "第3章「ムラガレ」は制作中です"
  - if: reached_far_shore
    text: "ムラガレへの近道をたどろう"
  - if: found_far_shore
    text: "葦の原から、向こう岸へ飛び石をつなごう（`ln -s`）"
  - if: crossed_2
    text: "向こう岸を探そう（`find`）"
  - if: crossed_1
    text: "中州から、葦の原へ道をつなごう"
  - if: learned_ln
    text: "岩場から中州へ、飛び石をつなごう（`ln -s`）"
  - if: frog_revealed
    text: "ツナギのところへ戻ろう"
  - if: met_tsunagi
    text: "浮き草のカエルたちを、静かにさせよう"
  - text: "沼の奥へ進もう"

hints:
  - if: ch2_clear
    steps: ["第2章はここまで。遊んでくれてありがとう！"]
  - if: reached_far_shore
    steps:
      - "向こう岸の道しるべ「ムラガレへの近道」は、リンクだ。"
      - "リンクには、ふつうの場所と同じように `cd` で入れる。"
      - "`cd ムラガレへの近道`"
  - if: found_far_shore
    steps:
      - "向こう岸の住所は `/lib/向こう岸`。中州でしたのと同じように、葦の原から飛び石をつなごう。"
      - "`ln -s 行き先 名前` で、行き先を指さす飛び石ができる。"
      - "`ln -s /lib/向こう岸 飛び石` → `cd 飛び石`"
  - if: crossed_2
    steps:
      - "向こう岸の場所は、まだ分からない。まずは探そう。"
      - "場所を探すなら `find -type d`。「岸」の字を含む場所を探そう。見つけたら、葦の原に飛び石をつなぐ。"
      - "`find /lib -type d -name \"*岸*\"` → `ln -s /lib/向こう岸 飛び石` → `cd 飛び石`"
  - if: crossed_1
    steps:
      - "中州の立て札に、次の行き先が書いてある。"
      - "中州で `ln -s 行き先 名前` と唱えれば、飛び石をつなげる。"
      - "`cat 立て札` → `ln -s /lib/葦の原 飛び石` → `cd 飛び石`"
  - if: learned_ln
    steps:
      - "ツナギの言うとおり、岩場から中州へ飛び石をつなごう。"
      - "`ln -s` のあとに「行き先」、そのあとに「つくる飛び石の名前」を書く。"
      - "`ln -s /lib/中州 飛び石` → `cd 飛び石`（間違えたら `unlink 飛び石` で切れる）"
  - if: frog_revealed
    steps:
      - "カエルたちは静かになった。岩場のツナギに知らせよう。"
      - "ツナギは渡り道Bの先、岩場にいる。"
      - "`cd /lib/渡り道B/岩場` → `cat ツナギ`"
  - if: frog_hint
    steps:
      - "カエル兄とカエル弟は、本当に別々のカエルなのだろうか。"
      - "正体を調べるには `file`。"
      - "`file /lib/浮き草/カエル弟`"
  - if: met_tsunagi
    steps:
      - "浮き草のカエルたちが、うるさいらしい。兄にも弟にも、話しかけてみよう。"
      - "浮き草は、沼の入口（/lib）にある。"
      - "`cd /lib/浮き草` → `cat カエル兄` → `cat カエル弟`"
  - steps:
      - "そっくりな二本道がある。どちらにも、進んでみよう。"
      - "渡り道Aは、入れないようだ。渡り道Bの奥へ行ってみよう。"
      - "`cd 渡り道B` → `cd 岩場` → `cat ツナギ`"

events:
  - on: ls
    at: /lib
    once: swamp_first_look
    lines:
      - "コダマ: ……ふむ。「渡り道A」と「渡り道B」。まったく同じ顔をしておるな。"
      - "コダマ: 化けものだらけの、この沼のことだ。……どちらかは、偽りやもしれぬ。"
      - "{name}: どっちも、ふつうの道に見えるけど……。"
      - "コダマ: 見るだけでは分からぬ。……どちらも、進んでみるがよい。"
  # カエルは、弟が兄を指すリンクなので、どちらの名で呼んでも兄が答える。
  # 両方の名で呼んだとき（2回目）にはじめて、カエルもおかしいと気づき、コダマが file を教える
  - on: cat
    arg: カエル弟
    if: "met_tsunagi & heard_ani"
    once: frog_hint
    lines:
      - "カエル兄: ……あれ？ いま、弟が呼ばれたよな？ なんで、おいらが答えてるんだ？ ケロ？"
      - "{name}: 兄に話しかけたときと、まったく同じことを言ってる……。"
      - "コダマ: ……ふむ。二匹、と言うが。"
      - "コダマ: 見た目を、うのみにするでない。正体を知りたくば、`file` と唱えるがよい。"
      - "コダマ: `file 名前` ――それが、本当は何なのかを教えてくれる言葉だ。"
    learn: [file]
  - on: cat
    arg: カエル兄
    if: "met_tsunagi & heard_otouto"
    once: frog_hint
    lines:
      - "カエル兄: ……あれ？ さっき弟に話しかけられたときも……答えてたのは、おいらだったような……？ ケロ？"
      - "{name}: 弟に話しかけたときと、まったく同じことを言ってる……。"
      - "コダマ: ……ふむ。二匹、と言うが。"
      - "コダマ: 見た目を、うのみにするでない。正体を知りたくば、`file` と唱えるがよい。"
      - "コダマ: `file 名前` ――それが、本当は何なのかを教えてくれる言葉だ。"
    learn: [file]
  - { on: cat, arg: カエル兄, set: [heard_ani] }
  - { on: cat, arg: カエル弟, set: [heard_otouto] }
  # 葦の原で find して、向こう岸を見つけたら
  - on: find
    found: /lib/向こう岸
    if: crossed_2
    once: found_far_shore
    lines:
      - "{name}: あった！ 向こう岸の住所は `/lib/向こう岸`……！"
      - "{name}: あとは、葦の原から向こう岸に向けて、石を置けば……。"
      - "コダマ: うむ。中州でしたのと、同じようにな。"

companions:
  - name: コダマ
    joinIf: kodama_joined
    variants:
      - at: /lib
        lines:
          - "コダマ: ……化けたものばかりで、落ちつかぬ。"
          - "コダマ: そっくりな道が二つあれば、どちらかは偽りであろう。`-l` をつけて、よく見るがよい。"

places:
  # 第0章で「？？？」として置いてあった /lib に、中身を足す
  - path: /lib
    bgm: アラブの砂漠
    icon: swamp
    theme: swamp
    visibleIf: ch1_clear
    children:
      - name: 渡り道A
        icon: swamp
        link: 沈んだ祠
        # 見た目は渡り道Bと同じなので、どちらも調べるべき場所として「!」を出す
        mark: "!tried_path_a & !met_tsunagi"
        onBroken:
          once: tried_path_a
          lines:
            - "{name}: あれ……？ 渡り道Aに、入れない。"
            - "コダマ: ……渡り道Bと、見た目は何も変わらぬのにな。"
            - "コダマ: 同じ顔をしておっても、進めるとは限らぬ、ということか。……もう一方の道を、行ってみよう。"
        onFile:
          once: saw_broken_path
          lines:
            - "コダマ: ……broken。人の子の言葉で「こわれた」という意味だ。"
            - "コダマ: 指さす先の「沈んだ祠」が消えて、道しるべだけが残っておる。……これを、リンク切れと言う。"
            - "コダマ: 祠がどこへ沈んだのか……探してみる値打ちは、あるやもしれぬ。"
      - name: 渡り道B
        icon: swamp
        mark: "!entered_rock"
        children:
          - name: 岩場
            icon: rock
            mode: "rwxrwxrwx"
            linkable: true
            onEnter:
              - once: entered_rock
                lines:
                  - "（道は、平たい岩場で終わっている。この先は、深い沼だ。）"
                  - "（岩の上で、大きな亀が甲羅を干している。）"
            children:
              - name: ツナギ
                mark: "!met_tsunagi | (frog_revealed & !learned_ln)"
                set: [met_tsunagi]
                learn: ["ls -l"]
                lines:
                  - "ツナギ: ……おや……人の子が、来たか……。"
                  - "ツナギ: わしは、ツナギ……この沼の、主じゃ……。"
                  - "{name}: {me}たち、この沼の向こうへ行きたいんです。"
                  - "{name}: でも、この道はここで行き止まりで……。入口には、この道とそっくりな道が、もう一本あったんだけど……。"
                  - "ツナギ: ああ……渡り道Aのことか……。あっちは……入ろうとしても、入れんよ……。"
                  - "{name}: 入れない……？ 見た目は、この渡り道Bと同じなのに……。"
                  - "ツナギ: 見た目が同じでも……その道を進めるかどうかは、分からんものじゃ……。"
                  - "ツナギ: `ls` に `-l` をつけて、よく見てごらん……。"
                  - "ツナギ: 矢印 `->` がついておるのは……「リンク」じゃ……。"
                  - "{name}: リンク……？"
                  - "ツナギ: リンクとはな……遠くにある場所を、ここから指さしておる道しるべのようなもの……。"
                  - "ツナギ: 道しるべをたどれば、指さした先に着く……。だが、指さした先が沈んでしもうたら……道しるべだけが、ぽつんと残る……。"
                  - "ツナギ: 渡り道Aは、そういう道じゃ……。もう、繋がっとらんよ。"
                  - "{name}: 道しるべだけが残ってるから、入れないんだ……。"
                  - "ツナギ: ……それより、浮き草のカエルどもが騒がしゅうて、考えがまとまらん……。"
                  - "ツナギ: あれを静かにしてくれたら……渡り方を、教えよう……。"
                  - "{name}: わかりました。カエルたちのところへ行ってみます。"
                variants:
                  # 伏線（調べても、本編では何も分からない。くわしくは手元の docs/sequel.md の伏線の表）
                  - if: ch2_clear
                    lines:
                      - "ツナギ: ……おや、また来たか……。渡り道Aの先の祠かね……。昔は、あそこへ通う者もおったのう……。"
                      - "ツナギ: 二人連れでな……。年かさの男と、若いのと……。"
                      - "{name}: 二人……？ その人たちは、いまは？"
                      - "ツナギ: ……若いほうは、もう来ん。年かさのほうも……ずいぶん、来んのう……。"
                  - if: reached_far_shore
                    lines: ["ツナギ: ……渡りきったか……。見た目にまどわされぬ目を、大事にな……。"]
                  - if: learned_ln
                    lines:
                      - "ツナギ: ……`ln -s 行き先 名前`、じゃ……。まずは中州へ……`ln -s /lib/中州 飛び石`……。"
                      - "ツナギ: 間違えたら、`unlink` で切って、つなぎ直せばよい……。"
                  - if: frog_revealed
                    set: [learned_ln]
                    learn: ["ln", "unlink"]
                    lines:
                      - "ツナギ: ……静かになったのう……。ありがとうよ……。"
                      - "ツナギ: 約束じゃ……。この沼はな、道がもつれて、ところどころ切れておる……。"
                      - "ツナギ: 道がなければ……繋げばよい……。"
                      - "{name}: 繋ぐ……？ 道を、作れるんですか？"
                      - "ツナギ: `ln -s 行き先 名前` ……と唱えると、行き先を指さす「飛び石」が、ここにできる……。"
                      - "ツナギ: `-s` は、シンボリックの s……。さっきのカエルの名札のようなものを、自分の手で立てる、ということじゃ……。"
                      - "{name}: 自分で、名札を立てる……。"
                      - "ツナギ: たとえば、ここから中州へなら……`ln -s /lib/中州 飛び石`……。"
                      - "ツナギ: そうして、飛び石に `cd` すれば……向こうへ渡れる……。"
                      - "{name}: 中州まで、ひと跳びで……！"
                      - "ツナギ: 間違えてつないだら、`unlink 飛び石` で切って、つなぎ直せばよい……。"
                      - "ツナギ: `unlink` は、繋がりを解く言葉……。立てた石を抜くだけで、指さした先の場所は、なにも壊れはせん……。"
                      - "{name}: 間違えても、やり直せるんだ。"
                      - "ツナギ: ……ただし、石を置けるのは、置ける場所だけじゃ。この岩場や、中州のような……。"
                  - if: met_tsunagi
                    lines: ["ツナギ: ……浮き草のカエルどもを、たのむ……。やかましゅうて、かなわん……。"]

      - name: 浮き草
        icon: reeds
        onEnter:
          - once: entered_reeds
            lines: ["（浮き草の上で、カエルが二匹、にぎやかに鳴いている。……いや、二匹？）"]
        children:
          - name: カエル兄
            fileDesc: "カエル（ふつうのファイル）"
            mark: "met_tsunagi & !heard_ani"
            lines:
              - "カエル兄: ケロッ！ おいらはカエル兄！"
              - "カエル兄: となりのカエル弟とは、ぜんぜん別のカエルだぞ！ ケロケロ！"
              - "カエル兄: うそだと思うなら、弟にも話しかけてみな！"
            variants:
              - if: frog_revealed
                lines:
                  - "カエル兄: ……おいらは、おいら。弟も、おいら。ケロ……。"
                  - "カエル兄: まあいいや！ 名前が二つあるってのも、悪くないぞ！"
          - name: カエル弟
            link: カエル兄
            mark: "(met_tsunagi & !heard_otouto) | (frog_hint & !frog_revealed)"
            onFile:
              once: frog_revealed
              lines:
                - "（カエル弟は、カエル兄を指さしているリンクだった。）"
                - "カエル兄: ……えっ？ おいらが、兄ちゃんを指さしてる……？"
                - "カエル兄: ……ってことは、弟に話しかけても、おいらが答えてたのか！？"
                - "カエル兄: おまえは、おいらだったのか……！ ……ケロ……。"
                - "（カエルたちは、すっかり静かになった。）"
                - "コダマ: 「symbolic link」――人の子の言葉では、シンボリックリンクという。"
                - "コダマ: 本物を指さす「名札」のようなものよ。カエル弟という名札は、カエル兄を指さしておった。"
                - "コダマ: だから、どちらの名で呼んでも、同じ一匹が答える。……同じものに、別の名で呼びかけておるだけなのだ。"
                - "{name}: ……見た目は二匹でも、本当は一匹だったんだ。"

      - name: 沼の底
        icon: swamp
        children:
          - name: 沈んだ祠
            icon: shrine
            onEnter:
              - once: found_shrine
                lines:
                  - "（沼の底に、小さな祠が沈んでいる。水は冷たく、音がしない。）"
                  - "{name}: ……渡り道Aが指さしてたのは、ここだったんだ。"
            children:
              - name: 古い石
                icon: stone
                lines:
                  - "（苔に覆われた石に、文字が刻まれている。）"
                  - "「モリビト 試作一号」"
                  - "「見守り、数え、回すもの。……いつか、村の時を任せられるように。 ― S」"
                  # 伏線（調べても、本編では何も分からない。くわしくは手元の docs/sequel.md の伏線の表）
                  - "（「S」のとなりに、もうひとつ頭文字が刻まれていたあとがある。削られているが……目をこらすと、「N」と読める。）"
                  - "{name}: N……？ もうひとり、だれかいたのかな。"
                  - "{name}: モリビト……！？ それに、S って……森の置き手紙と、同じ……。"
                  - "コダマ: ……スドウは、ここで守り人の最初の姿を、作っておったのかもしれぬな。"

      - name: 中州
        icon: rock
        mode: "rwxrwxrwx"
        linkable: true
        needsLink:
          - "（沼にへだてられて、ここからは行けない。）"
          - "（……道をつなげば、渡れるかもしれない。）"
        onEnter:
          - once: crossed_1
            lines:
              - "（飛び石を踏んで、中州に渡った。）"
              - "{name}: ……渡れた！ リンクって、道にもなるんだ。"
              - "コダマ: うむ。この調子で、次は葦の原へつなげば……向こう岸に、ぐっと近づくぞ。"
              - "コダマ: 葦の原への行き先は……そこの立て札に、書いてあるようだな。"
        children:
          - name: 立て札
            icon: board
            lines:
              - "【中州】"
              - "「葦の原へは、ここから石をつなぐべし。 → /lib/葦の原」"
          - name: サギ
            icon: item
            lines: ["（一本足で立つサギが、じっとこちらを見ている。……動かない。）"]

      - name: 葦の原
        icon: reeds
        mode: "rwxrwxrwx"
        linkable: true
        needsLink:
          - "（沼にへだてられて、ここからは行けない。）"
          - "（……道をつなげば、渡れるかもしれない。）"
        onEnter:
          - once: crossed_2
            lines:
              - "（背の高い葦が、風にざわざわと揺れている。）"
              - "（この先に、向こう岸があるはずだ。）"
              - "{name}: 向こう岸は、どこだろう……。ここからじゃ、何も見えないや。"
              - "コダマ: 見えぬものは、探せばよい。森で鈴を探したときの言葉を、思い出すがよい。"
              - "{name}: そうだ、`find`……！ 「岸」って字のつく場所を探せば……。"
        children:
          - name: 立て札
            icon: board
            lines:
              - "【葦の原】"
              - "「向こう岸へは、自分で探して、自分でつなぐべし。」"

      - name: 向こう岸
        icon: rock
        needsLink:
          - "（沼にへだてられて、ここからは行けない。）"
          - "（……道をつなげば、渡れるかもしれない。）"
        onEnter:
          - once: reached_far_shore
            lines:
              - "（ついに、向こう岸に渡りきった。足もとが、しっかりとしている。）"
              - "コダマ: ……ふう。やっと、化けものの沼を抜けたな。"
        children:
          - name: 古い道しるべ
            icon: board
            lines:
              - "（古い道しるべが立っている。）"
              - "「ムラガレへの近道」"
              - "（そばに、同じ名前の道が口を開けている。……これも、何かを指さしているようだ。）"
          - name: ムラガレへの近道
            link: /home/ムラガレ
            mark: "reached_far_shore & !ch2_clear"

  - path: /home/ムラガレ
    visibleIf: reached_far_shore
    theme: dusk
    drainedIf: "!muragare_restored"
    onEnter:
      - once: ch2_clear
        lines:
          - "（近道を抜けると、見覚えのある景色に出た。）"
          - "{name}: ……え？ ここ、チルダ村のすぐ隣……？"
          - "コダマ: 遠く離れた場所も、道でつながっておる。……それが、リンクというものよ。"
          - "（けれど、この村も、色を失っていた。家々の扉は、かたく閉ざされている。）"
          - "{name}: この村も……チルダ村と、同じ……？"
        effect: chapterEnd
