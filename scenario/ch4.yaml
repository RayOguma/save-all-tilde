# 第4章｜市場町イチバ — 息抜き（mkdir・mv・cp・cp -r）
#
# 書き方は ch0〜ch3.yaml の先頭を参照。この章で増えたもの:
#   movable    mv で運べる（名前を変えられる）物。シナリオの物はふつう動かせない。プレイヤーが作った・写した物は運べる
#   exists / missing   イベントの条件。その道のりの物がある／ないときだけ発火する（運んだ・写した・作ったかを確かめる）
#   target     コマンドのイベントの条件。コマンドに書いた名前が、その道のりの物を指しているときだけ
#   madeIcons  プレイヤーが mkdir で作った場所のアイコン（名前 → アイコン）
#   onMv       人を mv で運ぼうとしたときの、その人の言い返し
#   allow      物語で頼まれた mkdir・mv・cp。この章では、これしかできない（オートセーブなので、世界を散らかさないように）。
#              名前は合っているのに場所がちがうときは、wrong のせりふ（頼んだ人）で正しい場所を教える
#
# 物語の流れ（フラグの順）:
#   （着いてすぐ、コダマ「地図がいる」。露店から「手を貸して」の声）
#   → met_apt（木箱を運ぶ・mv）→ box_moved → told_bag（ふるさとにかばんを作る理由・mkdir）→ bag_made
#   → pass_given（露店で作ったら、そのまま会話がつづく。旅の行き先を聞かれ、山道の関所で要る通行証をもらう）→ pass_in_bag
#   → どの順でも: met_rine → sign_fixed（mv で名前を変える）／ met_pip → stage_built（mkdir 舞台）
#     手伝い終えたら地図のことを聞く。先に手伝ったほうは知らず、あとに手伝ったほうが書写屋を教えてくれる → told_dd
#   → met_dd（ていねいに頼む → 店の宝じゃ → 村を救うため → 直せる者はだれじゃ？ → スドウ → 写しなら）
#   → map_found（棚は奥が深い。find で地図の巻物を探す。第1章のおさらい）→ map_copied（cp）
#   → ディディ爺が金庫の鍵を開ける（chmod o+rx 金庫。金庫はディディ爺の物）→ 金庫の中のスドウの覚え書きを写す → notes_copied（cp -r）
#   → notes_copied で、ディディ爺「スドウどのの足どりは、宿屋の女将に」→ heard_rumor（スドウは片づけ番を気にしていた）
#   → saw_cleaner（広場の片づけ番が弱っている。スドウは山道へ）→ ch4_clear（かばんの地図の巻物を読む）

chapter: { no: 4, title: 市場町イチバ, startIf: ch3_clear, startAt: /tmp }

# この章をクリアすると手に入るもの（「章を選ぶ」で次の章から始めるとき、テストの準備に使う）
clear:
  flags: [met_apt, box_moved, told_bag, bag_made, pass_given, pass_in_bag, met_dd, map_copied, notes_copied,
          met_rine, sign_fixed, met_pip, stage_built, told_dd, map_found, heard_rumor, saw_cleaner, ch4_clear]
  learned: [mv, mkdir, cp, "cp -r"]
  perms:
    /tmp/書写屋/金庫: { mode: "rwx---r-x" }
  discovered: [/tmp, /home/チルダ村/かばん]
  ops:
    - { op: mv, from: /tmp/アプトの露店/木箱, to: /tmp/果物屋/木箱 }
    - { op: mkdir, path: /home/チルダ村/かばん }
    - { op: mv, from: /tmp/アプトの露店/通行証, to: /home/チルダ村/かばん/通行証 }
    - { op: cp, from: /tmp/書写屋/棚/奥の段/地図の巻物, to: /home/チルダ村/かばん/地図の巻物 }
    - { op: cp, from: /tmp/書写屋/金庫/スドウの覚え書き, to: /home/チルダ村/かばん/スドウの覚え書き }
    - { op: mv, from: /tmp/八百尾, to: /tmp/八百屋 }
    - { op: mkdir, path: /tmp/広場/舞台 }

characters:
  アプト: { sprite: apt, color: "#e07a5a", voice: 460 }
  ディディ爺: { sprite: dd, color: "#b8a0e0", voice: 300 }
  リネ: { sprite: rine, color: "#f2d45c", voice: 860 }
  ピップ: { sprite: pip, color: "#7ad0d0", voice: 700 }
  宿屋の女将: { sprite: okami, color: "#f0a060", voice: 560 }
  片づけ番: { sprite: katazuke, color: "#c8b890", voice: 260 }
  呼びこみの男: { sprite: yobikomi, color: "#e8a04a", voice: 520 }
  買い物客: { sprite: kaimono, color: "#c890d0", voice: 640 }
  町の子ども: { sprite: kodomo, color: "#f2d45c", voice: 900 }

madeIcons:
  かばん: bag
  舞台: stage

allow:
  - cmd: mv
    from: /tmp/アプトの露店/木箱
    to: /tmp/果物屋/木箱
    if: "met_apt & !box_moved"
    wrong:
      - "アプト: おいおい、そっちじゃない。木箱は、隣の果物屋へ頼むよ。"
      - "アプト: 露店の中からなら `mv 木箱 ../果物屋/` だ。"
  - cmd: mkdir
    to: ~/かばん
    if: told_bag
    wrong:
      - "アプト: おっと、そこじゃない！ かばんは、あんたのふるさと（`~`）の中に作るんだ。"
      - "アプト: `~/` から書けば、どこにいても、ふるさとの中に作れる。`mkdir ~/かばん`、だ。"
  - cmd: mv
    from: /tmp/アプトの露店/通行証
    to: ~/かばん/通行証
    if: "pass_given & !pass_in_bag"
    wrong:
      - "アプト: 通行証は、かばんにしまっときな。`mv 通行証 ~/かばん/` だ。"
  - cmd: cp
    from: /tmp/書写屋/棚/奥の段/地図の巻物
    to: ~/かばん/地図の巻物
    if: "met_dd & bag_made & !map_copied"
    wrong:
      - "ディディ爺: 写しは、おまえさんのかばんに入れていけ。`cp 棚/奥の段/地図の巻物 ~/かばん/` じゃ。"
  - cmd: cp
    from: /tmp/書写屋/金庫/スドウの覚え書き
    to: ~/かばん/スドウの覚え書き
    if: "map_copied & !notes_copied"
    wrong:
      - "ディディ爺: 覚え書きも、かばんへじゃ。`cp -r スドウの覚え書き ~/かばん/`。"
  - cmd: mv
    from: /tmp/八百尾
    to: /tmp/八百屋
    if: "met_rine & !sign_fixed"
    wrong:
      - "リネ: ちがうちがう！ 「八百屋」だよ。市場の真ん中で `mv 八百尾 八百屋`！"
  - cmd: mkdir
    to: /tmp/広場/舞台
    if: "met_pip & !stage_built"
    wrong:
      - "ピップ: 舞台は、この広場に作ってほしいんだ。広場で `mkdir 舞台` ってお願い！"

intro:
  - "（色とりどりの天幕が、どこまでも並んでいる。呼びこみの声、焼き菓子の匂い。）"
  - "{name}: わあ……！ 人が、いっぱい……！"
  - "コダマ: ……人の多い所は、どうも落ち着かぬ。"
  - "（ここは市場町イチバ。だれでも店を広げられる、にぎやかな町だ。）"
  - "コダマ: ……人の子よ。この先の山道は、われも知らぬ道だ。地図がいるな。"
  - "{name}: 地図……。どこで手に入るんだろう。"
  - "コダマ: これだけ人がおるのだ。いろいろな者に、聞いてまわるとよい。"
  - "（すぐそばの露店から、「おーい、だれか手を貸してくれんかー！」と声がした。）"
guide:
  - "[まずは `ls` で、市場を見渡してみよう。声がしたのは、「アプトの露店」のようだ。]"

objectives:
  - if: ch4_clear
    text: "第5章「廃墟山道」は制作中です"
  - if: saw_cleaner
    text: "かばんの地図の巻物を読もう（`cat ~/かばん/地図の巻物`）"
  - if: heard_rumor
    text: "広場の片づけ番に会ってみよう"
  - if: "map_copied & notes_copied & sign_fixed & stage_built"
    text: "宿屋の女将に、スドウの話を聞こう"
  - if: map_copied
    text: "金庫の中の、スドウの覚え書きを写させてもらおう（`cp -r`）"
  - if: map_found
    text: "地図の巻物を、かばんに写させてもらおう（`cp`）"
  - if: met_dd
    text: "奥の深い棚から、地図の巻物を探そう（`find`）"
  - if: told_dd
    text: "書写屋のディディ爺に、地図のことを頼もう"
  - if: pass_in_bag
    text: "困っている人を手伝いながら、地図のありかを聞いてみよう（看板屋・広場）"
  - if: pass_given
    text: "通行証を、かばんにしまおう（`mv`）"
  - if: bag_made
    text: "かばんができたことを、アプトに知らせよう"
  - if: told_bag
    text: "かばんを作ろう（`mkdir ~/かばん`）"
  - if: box_moved
    text: "アプトのところへ戻ろう"
  - if: met_apt
    text: "木箱を、隣の果物屋へ運ぼう（`mv`）"
  - text: "声のした露店（アプトの露店）へ行ってみよう"

hints:
  - if: saw_cleaner
    steps:
      - "スドウは山道のほうへ行ったらしい。かばんに写した地図の巻物を見てみよう。"
      - "かばんの住所は `~/かばん`。どこにいても、この住所で届く。"
      - "`cat ~/かばん/地図の巻物`"
  - if: heard_rumor
    steps:
      - "スドウは、市場の片づけ番を気にしていたらしい。会いに行ってみよう。"
      - "片づけ番は、広場にいる。"
      - "`cd /tmp/広場` → `cat 片づけ番`"
  - if: "map_copied & notes_copied & sign_fixed & stage_built"
    steps:
      - "スドウの足どりは、宿屋の女将が知っているかもしれない。旅人の噂は、宿に集まる。"
      - "宿屋は、市場の中にある。"
      - "`cd /tmp/宿屋` → `cat 宿屋の女将`"
  - if: "map_copied & !notes_copied"
    steps:
      - "ディディ爺が金庫の鍵を開けてくれた。中に、スドウの覚え書きがある。"
      - "覚え書きは紙の束、つまり「場所」だ。場所を中身ごと写すには `-r` を添える。"
      - "`cd /tmp/書写屋/金庫` → `ls` → `cp -r スドウの覚え書き ~/かばん/`"
  - if: "map_found & !map_copied"
    steps:
      - "地図の巻物は、棚の奥の段にあった。ディディ爺が、写させてくれる。"
      - "写しをとるのは `cp`。元の物は、そのまま残る。行き先にかばんの住所 `~/かばん/` を書けば、かばんの中に写せる。"
      - "`cd /tmp/書写屋` → `cp 棚/奥の段/地図の巻物 ~/かばん/`"
  - if: "met_dd & !map_copied"
    steps:
      - "地図の巻物は、書写屋の棚のどこかにある。棚は奥が深い。"
      - "探しものは `find`（第1章の森で覚えた）。名前の一部で探すなら `*` を使う。"
      - "`cd /tmp/書写屋` → `find . -name \"*地図*\"`"
  - if: "told_dd & !met_dd"
    steps:
      - "地図なら、書写屋のディディ爺のところにあるらしい。"
      - "書写屋は、市場の中にある。"
      - "`cd /tmp/書写屋` → `cat ディディ爺`"
  - if: "pass_in_bag & !sign_fixed"
    steps:
      - "地図がほしい。看板屋のリネが、看板の書きまちがいに困っているらしい。手伝って、聞いてみよう。"
      - "`mv` は、運ぶだけでなく名前も変えられる。行き先に、新しい名前を書けばいい。"
      - "`cd /tmp` → `mv 八百尾 八百屋`"
  - if: "pass_in_bag & !stage_built"
    steps:
      - "地図がほしい。広場の楽師ピップが、演奏する場所を探している。手伝って、聞いてみよう。"
      - "場所がないなら、作ればいい。場所を作るのは `mkdir`。"
      - "`cd /tmp/広場` → `mkdir 舞台`"
  - if: pass_given
    steps:
      - "アプトにもらった通行証を、かばんにしまおう。"
      - "運ぶのは `mv`。行き先にかばんの住所 `~/かばん/` を書けば、かばんの中へ運べる。"
      - "`cd /tmp/アプトの露店` → `mv 通行証 ~/かばん/`"
  - if: bag_made
    steps:
      - "かばんができた。アプトに知らせよう。"
      - "アプトの露店は、市場の中にある。"
      - "`cd /tmp/アプトの露店` → `cat アプト`"
  - if: told_bag
    steps:
      - "旅の荷物をしまう、かばんを作ろう。"
      - "場所を作るのは `mkdir`。ふるさと（`~`）の中に作れば、どこからでも住所の `~/かばん` で届く。"
      - "`mkdir ~/かばん`"
  - if: box_moved
    steps:
      - "木箱を運び終えた。アプトに知らせよう。"
      - "アプトの露店は、市場の中にある。"
      - "`cd /tmp/アプトの露店` → `cat アプト`"
  - if: met_apt
    steps:
      - "アプトの木箱を、隣の果物屋へ運ぼう。"
      - "運ぶのは `mv 運ぶ物 行き先`。果物屋は、アプトの露店から見て「ひとつ外に出た、その中」にある。"
      - "`cd /tmp/アプトの露店` → `mv 木箱 ../果物屋/`"
  - steps:
      - "露店から、「手を貸してくれんか」と声がした。行ってみよう。"
      - "まわりを見るには `ls`。露店の中へは `cd`。"
      - "`ls` → `cd アプトの露店` → `cat アプト`"

events:
  - on: mv
    exists: [/tmp/果物屋/木箱]
    once: box_moved
    lines:
      - "（果物屋のほうから、「木箱、届いたよ！ ありがとね！」と声がした。）"
      - "{name}: ……アプトの露店から、木箱がなくなってる。"
      - "コダマ: 運んだ物は、元の場所には残らぬ。……それが `mv` だ。"
  - on: mkdir
    exists: [~/かばん]
    once: bag_made
    lines:
      - "（遠くのふるさと、チルダ村の中に、新しい場所がひとつできた。）"
      - "{name}: これが、{me}のかばん……！ チルダ村の中にあるのに、ここから手が届くんだ。"
      - "コダマ: ふるさとの中にあれば、どこにいても `~/かばん` で届く。……旅の物は、そこにしまうがよい。"
    # かばんの使い方を、画面を照らして紹介する
    guide:
      - at: bag
        text: "これが、きみのかばん。住所は `~/かばん`（チルダ村の中の、かばん）。クリックすると開いて中身が並び、中の物をクリックすると、読むコマンドが入る。"
      - at: input
        text: "どこにいても、住所の `~/かばん` で届く。たとえば `ls ~/かばん`（中を見る）、`mv 通行証 ~/かばん/`（しまう）、`cat ~/かばん/通行証`（読む）。入力候補にも、いつも「かばん」が出る。選ぶと `~/かばん/` が入る。"
  # アプトの露店でかばんを作ったら、そのまま会話がつづく（ほかの場所で作ったら、アプトに話しかけたときに）
  - on: mkdir
    at: /tmp/アプトの露店
    if: bag_made
    once: pass_given
    reveal: [/tmp/アプトの露店/通行証]
    lines: &pass_talk
      - "アプト: おっ、できたな！ これで、あんたも一人前の旅人だ。"
      - "アプト: ところで、なんで旅なんかしてるんだい？ この先、どこへ向かう？"
      - "{name}: スドウっていう人を探してるんです。坑道アナグラへは、この町の先の山道を越えていくって、ムラガレで聞いて……。"
      - "アプト: 山道か！ なら、木箱の礼に、これをやろう。"
      - "（アプトは、露店の棚に「通行証」を置いた。）"
      - "{name}: 通行証……？"
      - "アプト: 山道の入口には、関所があってな。イチバの通行証がないと、通してもらえんのさ。"
      - "アプト: なくさんように、かばんにしまっときな。`mv 通行証 ~/かばん/` だ。"
  # 通行証をかばんにしまったら、アプトにお礼を言って、地図のことを聞く
  - on: mv
    exists: [~/かばん/通行証]
    once: pass_in_bag
    lines:
      - "（通行証を、かばんにしまった。）"
      - "{name}: ありがとう、アプト！ ……あと、この先の地図を探してるんだけど、どこかで手に入らないかな？"
      - "アプト: 地図？ さあなあ、おれは荷物専門でね。……看板屋のリネに、広場のピップ。この町は手が足りなくてな、手を貸してやりゃ、何か知ってるかもしれんぞ。"
      - "コダマ: うむ。……では、看板屋と広場の者を、手伝いに行ってみよう。"
  # 奥の深い棚から、find で地図の巻物を見つけたら
  - on: find
    found: /tmp/書写屋/棚/奥の段/地図の巻物
    if: met_dd
    once: map_found
    lines:
      - "ディディ爺: おお、そこじゃ、奥の段じゃった。……年をとると、しまった場所も忘れてしまうわい。"
      - "ディディ爺: 写すなら、`cp 棚/奥の段/地図の巻物 ~/かばん/` じゃ。"
  - on: cp
    exists: [~/かばん/地図の巻物]
    once: map_copied
    lines:
      - "ディディ爺: ほっほ、写せたな。元の巻物は、ちゃんと棚に残っておる。"
      - "{name}: ほんとだ……！ 写しだけが、かばんに入ってる。"
      - "ディディ爺: ……さて。スドウどの、と言うたな。実は、見せたいものがある。"
      - "ディディ爺: あの方が昔、ここに置いていった覚え書きじゃ。いつか、あの方をたずねてくる者が来ると思うて、金庫にしまっておいた。"
      - "{name}: スドウの、覚え書き……！"
      - "ディディ爺: 金庫は、わしの物じゃからな。鍵を変えられるのは、持ち主のわしだけじゃ。……ほれ。"
    # 金庫の持ち主（ディディ爺）が、よその人にも開ける
    chmod: { path: /tmp/書写屋/金庫, mode: "rwx---r-x" }
    after:
      - "（ディディ爺は、金庫に向かって `chmod o+rx 金庫` と唱えた。ガチャリ、と鍵の外れる音がした。）"
      - "ディディ爺: よその人にも、のぞけて、入れるようにした。……取っておいて、正解じゃったわい。入って、見てみるとええ。"
      - "[`ls -l` で見ると、金庫の鍵の右の三文字（よその人）に r と x がついたはずだ。]"
  - on: cp
    exists: [~/かばん/スドウの覚え書き]
    once: notes_copied
    lines:
      - "ディディ爺: 束ごと、ちゃんと写せたな。"
      - "{name}: これで、スドウのことが少し分かるかも。……でも、いまどこにいるのかは、分からないや。"
      - "ディディ爺: スドウどのの足どりなら、宿屋の女将に聞いてみるとええ。旅人の噂は、みんなあの宿に集まるからの。"
      - "[`ls ~/かばん/スドウの覚え書き` で中を見て、`cat` で読んでみよう。]"
  - on: mv
    exists: [/tmp/八百屋]
    if: "!stage_built"
    once: sign_fixed
    lines:
      - "（八百屋の看板が、正しい名前に掛けかえられた。）"
      - "リネ: やったー！ 地図の名前も、ちゃんと「八百屋」になってる！"
      - "{name}: 名前を変えても、中身はそのままなんだね。……あの、リネ。このあたりの地図って、どこかで手に入らないかな？"
      - "リネ: 地図？ うーん……ごめん、わかんないや。看板のことなら、なんでも聞いて！"
  - on: mv
    exists: [/tmp/八百屋]
    if: stage_built
    once: sign_fixed
    set: [told_dd]
    lines:
      - "（八百屋の看板が、正しい名前に掛けかえられた。）"
      - "リネ: やったー！ 地図の名前も、ちゃんと「八百屋」になってる！"
      - "{name}: 名前を変えても、中身はそのままなんだね。……あの、リネ。このあたりの地図って、どこかで手に入らないかな？"
      - "リネ: 地図？ それなら、書写屋のディディ爺さんのところに行ってみなよ！ 古い地図がいっぱいあるんだって。"
  - on: mkdir
    exists: [/tmp/広場/舞台]
    if: "!sign_fixed"
    once: stage_built
    lines:
      - "（広場に、小さな舞台ができた。）"
      - "ピップ: すごい！ ほんとうに舞台ができた！"
      - "{name}: 演奏、聞かせて！"
    effect: bell
    after:
      - "（ピップの演奏が始まると、人々が足を止め、市場がいっそうにぎやかになった。）"
      - "{name}: ……あの、ピップ。このあたりの地図って、どこかで手に入らないかな？"
      - "ピップ: 地図かあ。ごめん、ぼくも旅の途中で、この町には来たばかりなんだ。"
  - on: mkdir
    exists: [/tmp/広場/舞台]
    if: sign_fixed
    once: stage_built
    set: [told_dd]
    lines:
      - "（広場に、小さな舞台ができた。）"
      - "ピップ: すごい！ ほんとうに舞台ができた！"
      - "{name}: 演奏、聞かせて！"
    effect: bell
    after:
      - "（ピップの演奏が始まると、人々が足を止め、市場がいっそうにぎやかになった。）"
      - "{name}: ……あの、ピップ。このあたりの地図って、どこかで手に入らないかな？"
      - "ピップ: 地図？ それなら、書写屋のディディ爺さんだよ！ 町いちばん、紙と地図にくわしい人なんだ。"
  # 女将の噂を聞いたあと、かばんに写した地図の巻物を読むと、章の終わり
  - on: cat
    target: ~/かばん/地図の巻物
    if: saw_cleaner
    once: ch4_clear
    lines:
      - "{name}: 山道……。この先に、スドウがいるんだ。"
      - "コダマ: あの片づけ番の弱りよう……。支えが、ひとつ、またひとつ消えていく。"
      - "{name}: チルダ村も、ムラガレも、この町も……。"
      - "コダマ: ……急ごう、人の子よ。"
    effect: chapterEnd

# 旅の仲間（場所ごとのせりふ）
companions:
  - name: コダマ
    joinIf: kodama_joined
    variants:
      - at: /home/チルダ村/かばん
        lines:
          - "コダマ: ふるさとにつながったかばん、か。……おまえの村は止まっておるが、かばんの中は、おまえの旅の物でいっぱいだな。"
      - at: /tmp
        lines:
          - "コダマ: にぎやかな町だ。……じゃが、どこか、ほこりっぽい。"
          - "コダマ: 売れ残りが、あちこちに積まれたままになっておる。"

places:
  - path: /tmp
    bgm: よろずや道中
    visibleIf: ch3_clear
    icon: stall
    theme: market
    mode: "rwxrwxrwx"
    children:
      # 町のにぎわい。話しかけると、露店のアプトや片づけ番のことを、それとなく教えてくれる
      - name: 呼びこみの男
        lines:
          - "呼びこみの男: さあさあ、寄ってらっしゃい！ イチバは、だれでも店を出せる町だよ！"
          - "呼びこみの男: ……そこの露店のアプトなんか、店を広げすぎて、荷物で身動きとれなくなってるけどな。はっはっは！"
      - name: 買い物客
        lines:
          - "買い物客: あら、旅の子？ にぎやかでしょう、この町。"
          - "買い物客: ……でも近ごろ、朝来ると、通りが売れ残りだらけなのよ。前は、夜のうちにきれいになってたのにねえ。"
      - name: 町の子ども
        lines:
          - "町の子ども: ねえねえ、広場の片づけ番のおじいちゃん、知ってる？"
          - "町の子ども: 最近、ほうきを持ったまま、うとうとしてるんだよ。……だいじょうぶかなあ。"
      - name: 掲示板
        icon: board
        lines:
          - "【市場町イチバ 掲示板】"
          - "・だれでも、店を広げてかまいません。"
          - "・近ごろ、夜のうちに売れ残りが片づかなくなりました。各店は、品物を自分の店へしまってください。 ― 市場組合"

      - name: アプトの露店
        icon: stall
        owner: アプト
        mode: "rwxrwxrwx"
        onEnter:
          - once: entered_apt
            lines: ["（荷物が山のように積まれた露店だ。木箱や袋が、通路にまではみ出している。）"]
        children:
          - name: アプト
            mark: "!met_apt | (box_moved & !told_bag) | (bag_made & !pass_given)"
            set: [met_apt]
            learn: [mv]
            onMv:
              - "アプト: おいおい、おれは荷物じゃないぞ！ 運ぶのは、品物だけにしてくれ。"
            lines:
              - "アプト: いらっしゃい！ ……っと、客じゃなさそうだな。旅の人かい？"
              - "{name}: うん。「手を貸して」って声が聞こえたから……。"
              - "アプト: おお、聞こえたか！ 見てのとおり、荷物があふれててな。"
              - "アプト: その木箱を、隣の果物屋へ運んでくれんか。運ぶ言葉は `mv`。`mv 運ぶ物 行き先` だ。"
              - "{name}: 隣の果物屋……。"
              - "アプト: 果物屋は、この露店の外だ。`..` が「ひとつ外」なのは、知ってるな？"
              - "{name}: うん。`cd ..` で、外に出られる。"
              - "アプト: その `..` のあとに `/果物屋` と続ければ、「ひとつ外に出た、その中の果物屋」になる。"
              - "アプト: 最後の `/` は「その中へ」のしるしだ。`mv 木箱 ../果物屋/`、ってな。"
            variants:
              - if: ch4_clear
                lines: ["アプト: 気をつけてな！ 山道の関所では、通行証を忘れずにな！"]
              - if: pass_in_bag
                lines:
                  - "アプト: 地図？ さあなあ、おれは荷物専門でね。"
                  - "アプト: 看板屋のリネに、広場のピップ……この町は、手が足りなくてな。手を貸してやりゃ、何か知ってるかもしれんぞ。"
              - if: pass_given
                lines:
                  - "アプト: 通行証は、かばんにしまっときな。`mv 通行証 ~/かばん/` だ。山道の関所で要るからな。"
              - if: bag_made
                set: [pass_given]
                reveal: [/tmp/アプトの露店/通行証]
                lines: *pass_talk
              - if: told_bag
                lines:
                  - "アプト: かばんは `mkdir ~/かばん` で作れる。あんたのふるさと（`~`）の中に作っとけば、どこからでも `~/かばん` で届くぞ。"
              - if: box_moved
                set: [told_bag]
                learn: [mkdir]
                lines:
                  - "アプト: おお、運んでくれたか！ 助かったよ。……ん？ あんた、かばんも持ってないのかい？"
                  - "{name}: え……うん。急いで村を出てきたから……。"
                  - "アプト: 旅人に、かばんは欠かせんぞ。……あんた、どこから来たんだい？"
                  - "{name}: チルダ村から。"
                  - "アプト: チルダ村か。あんたのふるさとのチルダ村は、`~` だったな。かばんは、そこに作るといい。"
                  - "{name}: 旅先じゃなくて、ふるさとに？"
                  - "アプト: 旅先のあちこちに荷物を置いとくと、どこに置いたか忘れちまうからな。"
                  - "アプト: ふるさとにひとつ、まとめておけば迷わん。それに `~` は、どこにいても届く場所だろ？ そこに作れば、どの町からでも `~/かばん` で出し入れできる。"
                  - "{name}: そっか……！ でも、かばんって、どうやって作るの？"
                  - "アプト: `mkdir` は、新しい場所を作る言葉だ。囲いを立てて、場所をひとつ増やすのさ。`mkdir ~/かばん`、だ。"
              - if: met_apt
                lines:
                  - "アプト: 木箱を、隣の果物屋へ頼むよ。`mv 木箱 ../果物屋/` だ。"
          - name: 木箱
            icon: crate
            movable: true
            mark: "met_apt & !box_moved"
            lines: ["（リンゴがぎっしり詰まった木箱だ。ずっしり重い。）"]
          - name: 通行証
            icon: item
            movable: true
            visibleIf: pass_given
            mark: "pass_given & !pass_in_bag"
            lines:
              - "（市場町イチバの通行証だ。アプトの名前が書いてある。山道の関所で見せるものらしい。）"
          - name: 麻袋
            icon: item
            lines: ["（中身のわからない麻袋が、いくつも積まれている。……ずいぶん前から、ここにあるようだ。）"]

      - name: 果物屋
        icon: stall
        mode: "rwxrwxrwx"
        children:
          - name: リンゴの山
            icon: item
            lines: ["（真っ赤なリンゴが、山のように積まれている。）"]

      - name: 書写屋
        icon: house
        theme: wood
        onEnter:
          - once: entered_dd
            lines: ["（紙とインクの匂い。棚には、巻物や紙の束がぎっしり並んでいる。）"]
        children:
          - name: ディディ爺
            mark: "told_dd & !met_dd"
            lines:
              - "ディディ爺: ……ほう、旅の子か。ここは書写屋。本や巻物の写しをとる店じゃ。"
              - "ディディ爺: 棚のものは、どれも古いものばかりでな。さわらんように頼むぞ。"
            variants:
              - if: ch4_clear
                lines: ["ディディ爺: 写しは、元を大事にする者の知恵じゃ。……気をつけて行け。"]
              - if: notes_copied
                lines:
                  - "ディディ爺: 覚え書きは、ゆっくり読むとええ。スドウどのは、この町に何度も来ておった。"
              - if: map_copied
                lines:
                  - "ディディ爺: 金庫は開けておいた。中の覚え書きは紙の束、場所じゃ。`-r` を忘れずにな。"
              - if: map_found
                lines:
                  - "ディディ爺: 奥の段じゃったな。`cp 棚/奥の段/地図の巻物 ~/かばん/` で、かばんへ写すとええ。"
              - if: met_dd
                lines:
                  - "ディディ爺: 棚は奥が深くてな。名前に「地図」とつく巻物を、`find` で探してみなされ。"
                  - "ディディ爺: 見つけたら、その道のりを `cp` のうしろに書いて、おまえさんのかばん（`~/かばん/`）へ写すとええ。"
              - if: "told_dd & !bag_made"
                lines:
                  - "ディディ爺: 地図を探しておるのか。……じゃが、旅の子よ、しまうかばんもないようじゃな。"
                  - "ディディ爺: アプトの露店で、かばんのことを聞いてきなさい。話はそれからじゃ。"
              - if: told_dd
                set: [met_dd]
                learn: [cp]
                lines:
                  - "{name}: あの……はじめまして。地図を探しています。この先の山道の地図を、見せていただけませんか。"
                  - "ディディ爺: ……ほう、ていねいな子じゃ。地図なら、奥の棚にしまってある巻物がそうじゃよ。"
                  - "ディディ爺: じゃが、あれは店の宝でな。やるわけにはいかん。"
                  - "{name}: ……{me}の村が、止まってしまったんです。お母さんも、村のみんなも。"
                  - "{name}: 直せる人を探しに行くのに、どうしても、その地図が必要なんです。"
                  - "ディディ爺: …………村が、止まった、とな。……直せる者とは、だれのことじゃ？"
                  - "{name}: スドウっていう、賢者らしいです。"
                  - "ディディ爺: ……スドウどの、か。"
                  - "ディディ爺: ……わかった。巻物はやれんが、写しなら持っていけ。"
                  - "{name}: 写し……？"
                  - "ディディ爺: 写しをとる言葉は `cp`。`cp 元 先` と唱えれば、元はそのまま残って、写しが先にできる。"
                  - "ディディ爺: ……じゃが、棚は奥が深くてな。どの段にしまったか、わしも忘れてしもうた。"
                  - "{name}: 探しものなら……森で覚えた `find` だ！"
                  - "ディディ爺: ほう、探す言葉を知っとるか。名前に「地図」とつく巻物じゃ。見つけたら、その道のりを `cp` のうしろに書いて、おまえさんのかばん（`~/かばん/`）へ写すとええ。"
          # 奥の深い棚。地図の巻物は find で探す（第1章のおさらい）
          - name: 棚
            icon: item
            children:
              - name: 上の段
                icon: item
                children:
                  - name: 古い暦
                    icon: scroll
                    lines: ["（何十年も前の暦だ。めくると、ほこりが舞った。）"]
              - name: 中の段
                icon: item
                children:
                  - name: 詩の写本
                    icon: scroll
                    lines: ["（旅の詩を写した本だ。「山を越え、谷を越え……」）"]
              - name: 奥の段
                icon: item
                children:
                  - name: 地図の巻物
                    icon: scroll
                    mark: "met_dd & bag_made & !map_copied"
                    lines:
                      - "（古い地図だ。市場町イチバから北へ、細い山道が描かれている。）"
                      - "「イチバ ― 廃墟山道 ― ？？？」"
                      - "（山道の先は、かすれて読めない。）"
          # ディディ爺の金庫。はじめは鍵が全部閉まっていて、のぞくことも入ることもできない
          - name: 金庫
            icon: lock
            owner: ディディ爺
            mode: "rwx------"
            mark: "map_copied & !notes_copied"
            deniedLines:
              - "（重たい鉄の金庫だ。鍵がかかっている。……持ち主は、ディディ爺らしい。）"
            onEnter:
              - once: entered_vault
                lines:
                  - "（金庫の中には、古い紙の束が、ひとつだけしまってあった。）"
                  - "ディディ爺: それが、スドウどのの覚え書きじゃ。紙の束、つまり「場所」じゃな。"
                  - "ディディ爺: 場所を中身ごと写すには、`-r` を添える。「奥の奥まで」という意味じゃよ。"
                  - "ディディ爺: `cp -r スドウの覚え書き ~/かばん/`、じゃ。"
                learn: ["cp -r"]
            children:
              - name: スドウの覚え書き
                icon: scroll
                mark: "map_copied & !notes_copied"
                children:
                  - name: 一枚目
                    icon: item
                    lines:
                      - "（細い字で書かれている。）"
                      - "「守り人は、ひとりで村を守っているのではない。この町の片づけ番も、ほかの村の支えも、みな守り人から枝分かれした子らだ。根が枯れれば、枝もまた枯れる。 ― S」"
                  - name: 二枚目
                    icon: item
                    lines:
                      - "「鍵束が重い。どんな扉でも開けられる鍵など、ひとりの人間が持つべきではないのかもしれない。 ― S」"
                      # 伏線（調べても、本編では何も分からない。くわしくは手元の docs/sequel.md の伏線の表）
                      - "（その下に、走り書きが一行。）"
                      - "「弟子は、もうとらぬ。」"
                  - name: 三枚目
                    icon: item
                    lines:
                      - "「守り人の設計図は、山道に預けた。……もしも、わたしに何かあったときのために。 ― S」"
          - name: 写本の山
            icon: item
            lines: ["（書きかけの写本が、机の上に山になっている。）"]

      - name: 看板屋
        icon: stall
        onEnter:
          - once: entered_rine
            lines: ["（ペンキの匂い。描きかけの看板が、壁に立てかけてある。）"]
        children:
          - name: リネ
            set: [met_rine]
            learn: [mv]
            mark: "pass_in_bag & !met_rine"
            lines:
              - "リネ: うわーん、どうしよう！ 八百屋さんの看板、「八百尾」って書いちゃった！"
              - "{name}: やおび……。"
              - "リネ: ねえ、知ってる？ `mv` って、運ぶだけじゃなくて、名前も変えられるの。同じ場所のまま、札を掛けかえるみたいにね。"
              - "{name}: 名前も……？"
              - "リネ: 市場の真ん中から、`mv 八百尾 八百屋`。行き先に、新しい名前を書くの。……お願い、直して！"
            variants:
              - if: sign_fixed
                lines: ["リネ: 看板、ばっちり！ 今度は、まちがえないように描くね！"]
              - if: met_rine
                lines:
                  - "リネ: 市場の真ん中（`/tmp`）で、`mv 八百尾 八百屋` だよ！"
          - name: 描きかけの看板
            icon: board
            lines: ["（「いらっしゃいませ」と描きかけの看板だ。ペンキがまだ乾いていない。）"]

      - name: 八百尾
        icon: stall
        movable: true
        mark: "met_rine & !sign_fixed"
        children:
          - name: 野菜の山
            icon: item
            lines: ["（大根、かぶ、にんじん。……看板以外は、立派な八百屋だ。）"]

      - name: 広場
        icon: path
        mode: "rwxrwxrwx"
        onEnter:
          - once: entered_hiroba
            lines: ["（市場の真ん中の広場。人が行き交っているが、ひと休みする場所もない。）"]
        children:
          - name: ピップ
            set: [met_pip]
            learn: [mkdir]
            mark: "pass_in_bag & !met_pip"
            lines:
              - "ピップ: やあ、旅の人。ぼくは楽師のピップ。……演奏したいんだけど、この広場には舞台がなくてさ。"
              - "{name}: 舞台……作れないかな。"
              - "コダマ: 場所がないなら、作ればよい。`mkdir` と唱えれば、場所がひとつ増える。"
              - "ピップ: ほんと！？ じゃあ、ここに `mkdir 舞台` ってお願い！"
            variants:
              - if: stage_built
                lines: ["ピップ: ♪～ ……舞台って、いいなあ。きみのおかげだよ！"]
              - if: met_pip
                lines: ["ピップ: この広場で、`mkdir 舞台` ってお願い！"]
          # 夜のうちに売れ残りを片づける、町の「見えない支え」。弱りはじめている
          - name: 片づけ番
            mark: "heard_rumor & !saw_cleaner"
            lines:
              - "（年老いた男が、ほうきを手に、ゆっくりと売れ残りを片づけている。……手が、ふるえている。）"
              - "片づけ番: ……ああ、すまんの……通り道を、ふさいでしもうて……。"
              - "片づけ番: 夜のうちに、片づけきれんでな……。年かのう……。"
            variants:
              - if: saw_cleaner
                lines:
                  - "片づけ番: ……旅の子よ……あのお方に会えたら……よろしく、伝えておくれ……。"
              - if: heard_rumor
                set: [saw_cleaner]
                lines:
                  - "{name}: あの……片づけ番さん、ですか？"
                  - "片づけ番: ……ああ……旅の子かい……。すまんの……体が、重うてな……。"
                  - "片づけ番: 夜のうちに町を片づけるのが、わしの仕事なんじゃが……近ごろは、朝までに終わらんのじゃ……。"
                  - "{name}: スドウっていう人が、ここに来たって聞いて……。"
                  - "片づけ番: ……ああ、あのお方か……。わしの手を握ってな……『もうしばらく、もちこたえてくれ』と……。"
                  - "片づけ番: それから……山道のほうへ、急いで行かれた……。"
                  - "コダマ: ……この者も、おまえの村の守り人と同じ……町を支える、見えない支えなのやもしれぬ。"
                  - "コダマ: 人の子よ。ディディ爺の地図の巻物、かばんに写してあったな。見てみよ。"
          - name: 噴水
            icon: well
            lines: ["（小さな噴水だ。底に、硬貨がいくつも沈んでいる。）"]

      - name: 宿屋
        icon: house
        theme: wood
        onEnter:
          - once: entered_inn
            lines: ["（にぎやかな宿屋だ。旅人たちが、食卓を囲んで笑っている。）"]
        children:
          - name: 宿屋の女将
            mark: "map_copied & notes_copied & sign_fixed & stage_built & !heard_rumor"
            lines:
              - "宿屋の女将: いらっしゃい！ ……今日は、てんてこまいでね。"
