# 第7章｜物見の塔 — 止まった時間（date・echo・>・>>・crontab）
#
# 書き方は ch0〜ch6.yaml の先頭を参照。この章で増えたもの:
#   text       紙に書かれた字（予定表など）。cat すると、せりふではなく字のまま出る（そのあとに lines）
#   date       章の date: [{ if, text }]。date と唱えたときに出す日時（上から、条件が合った最初のもの）
#   allow      cmd: echo で、echo > / >> で書いてよい紙（to）。名前は合っているのに場所がちがうときは wrong
#   wrote      イベントの wrote: パス。echo > / >> で、その紙に書いたときだけ
#   cron       crontab 紙 で塔に渡したときの決まり。jobs（key を含む仕事の行の時刻が at のどれかなら flag、
#              key を含む行があれば flag_written。all: true なら、key を含む行がぜんぶ合っていないとだめ）
#              → onInstall の、条件が合った最初のイベント
#   onChmod    物にも書ける（予定表に、書く鍵 w がついたとき）
#   deniedLines 物にも書ける（echo > で書こうとして、Permission denied だったとき）
#   "<towerbell>" "<tick>" "<unlock>"  せりふの途中の演出（塔の鐘・大時計の秒針・扉の錠がはずれる音）
#
# 物語の流れ（フラグの順）:
#   met_kron（date を覚える）→ saw_date → asked_schedule → read_cron（予定表の読み方。写しを頼まれる）
#   → backed_up（cp 予定表 予定表.bak。予定表を預かる）→ cron_writable（ls -l・chmod u+w。echo を覚える）
#   → wrote_cron（echo > 予定表。crontab を覚える）→ bell_fixed（crontab 予定表。時が動きだす）
#   → read_door1（>> を覚える）→ door1_open → door2_open → door3_open（date で今日を確かめる）
#   → tower_view（頂上。地図の「？？？」が名前に変わる）= ch7_clear
#   わな: 扉の行を > で書くと、鐘の行が消えて、大時計がまた止まる（bell_fixed & !cron_bell）

chapter: { no: 7, title: 物見の塔, startIf: ch6_clear, startAt: /etc }

# この章をクリアすると手に入るもの（「章を選ぶ」で次の章から始めるとき、テストの準備に使う）
clear:
  flags: [read_tower_log, met_kron, saw_date, date_twice, asked_schedule, read_cron, backed_up, cron_writable, tried_echo,
          wrote_cron, bell_fixed, cron_bell, cron_bell_written, read_door1, door1_open, cron_door1, cron_door1_written,
          read_door2, door2_open, cron_door2, cron_door2_written, read_door3, door3_open, cron_door3, cron_door3_written,
          tower_view, ch7_clear]
  learned: [date, echo, "echo >", "echo >>", crontab, "crontab -l"]
  discovered: [/etc, /var/log, /root]
  ops:
    - { op: cp, from: /etc/予定表, to: /etc/予定表.bak }
  perms:
    /etc/予定表: { owner: きみ, mode: "rw-r--r--" }
  texts:
    /etc/予定表: ["0 9 * * * 鐘を鳴らす", "0 9 * * * 銅の扉を開ける", "30 9 * * * 銀の扉を開ける", "0 12 13 7 * 金の扉を開ける"]
    /etc/予定表.bak: ["# 分 時 日 月 曜日 仕事", "* * * * * 鐘を鳴らす"]
  history: [ls, cat クロン, date, date, cat 予定表, cp 予定表 予定表.bak, ls -l, chmod u+w 予定表, echo やっほー,
            "echo \"0 9 * * * 鐘を鳴らす\" > 予定表", crontab 予定表, "echo \"0 9 * * * 銅の扉を開ける\" >> 予定表",
            crontab 予定表, cd 銅の扉, crontab -l, cd 銀の扉, date, cd 金の扉/頂上]

characters:
  クロン: { sprite: kron, color: "#d8c8a0", voice: 300 }

allow:
  # 書き直す前に、予定表の写しをとる
  - cmd: cp
    from: /etc/予定表
    to: /etc/予定表.bak
    if: "read_cron & !backed_up"
    wrong:
      - "クロン: 写しは、この部屋に、`予定表.bak` という名でとっておいてくだされ。"
  # 予定表に書く（書き直す・書き足す）
  - cmd: echo
    to: /etc/予定表
    if: cron_writable
    wrong:
      - "クロン: 予定表は、塔の入口（`/etc`）にあるものじゃよ。どこからでも届く住所で書くとよい。"

# date で出す日時。止まっている間は、何度見ても同じ。時が動きだすと、扉が開くたびに進む
date:
  - if: "door1_open & !cron_bell"
    text: "7月13日 水曜日 09:00:00"
  - if: "bell_fixed & !cron_bell"
    text: "7月12日 火曜日 09:00:00"
  - if: door3_open
    text: "7月13日 水曜日 12:00:12"
  - if: door2_open
    text: "7月13日 水曜日 09:30:24"
  - if: door1_open
    text: "7月13日 水曜日 09:00:16"
  - if: bell_fixed
    text: "7月12日 火曜日 09:00:41"
  - text: "7月12日 火曜日 09:00:00"

# 予定表（crontab 予定表 で塔に渡す）
cron:
  jobs:
    # 鐘は、毎分鳴らす古い行が残っていたら、だめ（鳴りやまない）
    - { key: 鐘, at: ["0 9 * * *"], flag: cron_bell, all: true }
    - { key: 銅の扉, at: ["0 9 * * *"], flag: cron_door1 }
    - { key: 銀の扉, at: ["30 9 * * *"], flag: cron_door2 }
    # 今日（7月13日・水曜日）の正午だけ
    - { key: 金の扉, at: ["0 12 13 7 *", "0 12 13 7 3"], flag: cron_door3 }
  # 行の形がおかしくて、渡せなかったとき。はじめは直し方をくわしく、2回目からは短く
  onError:
    - once: told_cron_fix
      lines:
        - "クロン: おや、予定表の字に、まちがいがあるようじゃ。塔は、まちがいのある予定表は受け取らんでな。"
        - "{name}: どうやって直せばいいの？ 書いた字は、消せないし……。"
        - "クロン: まずは予定表を読んで、どの行がおかしいか確かめなされ。"
        - "クロン: 直すときは、`>` で書き直すのじゃ。`>` は、紙をまっさらにしてから書くでな。まちがえた字も、いっしょに消える。"
        - "{name}: じゃあ、正しい行を、もう一度書けばいいんだ。"
        - "クロン: そうじゃ。いちばん上の行を `>` で書いて、残りの行は `>>` で、ひとつずつ書き足せばよい。"
    - lines:
        - "クロン: まちがえた予定表は、`>` で書き直すのじゃ。残りの行は `>>` で書き足す。……まずは予定表を読んで、確かめなされ。"
  onInstall:
    # わな: > で書き直して、鐘の行が消えた
    - if: "bell_fixed & !cron_bell & !cron_bell_written"
      lines:
        - "（……鐘が、鳴らない。）"
        - "（大時計の振り子が、ぴたりと止まった。）"
        - "クロン: な、なんと！ 予定表から、鐘の行が消えておる！"
        - "{name}: えっ……！？"
        - "クロン: `>` は、紙を書き直す言葉じゃ。前の字は、みんな消えてしまう。……予定表を、読んでみなされ。"
        - "クロン: まずは鐘の行を、書き直してくだされ。ほかの行は、そのあと `>>` で書き足すのじゃ。"
    - if: "!cron_bell & cron_bell_written"
      lines:
        - "（……鐘は、鳴らない。大時計も、動かないままだ。）"
        - "クロン: 鐘の行に、刻のちがうものがあるようじゃ。予定表を、読んでみなされ。"
        - "クロン: 鐘は、毎日9時0分に一度だけ。左から、分、時の順じゃよ。"
        - "{name}: まちがえた行は、どうすれば……。"
        - "クロン: `>` で書き直せば、まちがえた字ごと消える。正しい鐘の行を `>` で書いて、ほかの行があれば `>>` で書き足すのじゃ。"
    - if: "!cron_bell"
      lines:
        - "（……鐘は、鳴らない。）"
        - "クロン: 予定表に、鐘の仕事が見当たらんのう。仕事の名は『鐘を鳴らす』じゃ。"
    # 時が動きだす
    - if: "!bell_fixed"
      once: bell_fixed
      learn: ["crontab -l"]
      lines:
        - "（塔のてっぺんで、鐘が鳴った。）"
        - "<towerbell>"
        - "（……一度だけ。鐘は、それきり鳴りやんだ。）"
        - "（……そのとき。カチ、と、大時計から小さな音がした。）"
        - "<tick>"
        - "（振り子が揺れて、針が、9時から動きだした。）"
        - "クロン: おお……おお！ 時が、動いた……！"
        - "{name}: やった……！ でも、7月12日のまま……。外では、もう何日もたってるのに。"
        - "クロン: 塔の暦は、あの日の朝で止まっておったでな。外の暦とは、ずれてしもうたが……塔の暦は、ここから数えなおしじゃ。"
        - "クロン: ありがとうよ、旅の方。塔に渡した予定は、`crontab -l` で、いつでも見られるでな。"
        - "クロン: ……ついでと言ってはなんじゃが、もうひとつ、頼まれてくれんか。"
        - "{name}: うん、なに？"
        - "クロン: この塔の上へ続く扉も、予定表のとおりに開くようにできておる。銅の扉の札に、開く刻が書いてあるはずじゃ。"
        - "コダマ: 塔の上からなら、スドウの行き先も見渡せるやもしれぬな。"
    - if: "!door1_open & cron_door1"
      once: door1_open
      lines:
        - "<tick>"
        - "（大時計の針が、くるくると回りだした。日が暮れ、夜が明けて……次の朝の、9時。）"
        - "<towerbell>"
        - "（鐘の音とともに、扉の錠が、ひとりでに回った。）"
        - "<unlock>"
        - "（銅の扉が、ゴゴゴ……と開いた。）"
        - "クロン: 開いた、開いた。銀の扉の札は、銅の扉の中じゃ。"
    - if: "!door1_open & cron_door1_written"
      lines:
        - "（次の朝……鐘は鳴ったが、銅の扉は、開かない。）"
        - "クロン: 銅の扉の行の刻が、札とちがうようじゃな。札を、もう一度読んでみなされ。"
    - if: "!door1_open"
      lines:
        - "（……銅の扉は、閉ざされたままだ。）"
        - "クロン: 予定表に、銅の扉の行がないようじゃ。札を読んで、書き足してから渡してくだされ。"
    - if: "!door2_open & cron_door2"
      once: door2_open
      lines:
        - "<tick>"
        - "（針が回り……9時30分。）"
        - "<unlock>"
        - "（ゴゴゴ……。銀の扉が、ゆっくりと開いた。）"
        - "クロン: よしよし。金の扉の札は、銀の扉の中じゃ。"
    - if: "!door2_open & cron_door2_written"
      lines:
        - "（……銀の扉は、びくともしない。）"
        - "クロン: 銀の扉の刻が、ちがうようじゃ。銅の扉が開いたのは、9時0分。その30分のちじゃよ。"
    - if: "!door2_open"
      lines:
        - "（……銀の扉は、閉ざされたままだ。）"
        - "クロン: 予定表に、銀の扉の行がないようじゃ。"
    - if: "!door3_open & cron_door3"
      once: door3_open
      lines:
        - "<tick>"
        - "（針が回り……正午。昼の光が、塔の窓から差しこんだ。）"
        - "<unlock>"
        - "（ゴゴゴ……。金の扉が、ゆっくりと開いた。）"
        - "クロン: 開いた……！ 金の扉の先は、頂上じゃ。……わしも、あとから登ろう。"
    - if: "!door3_open & cron_door3_written"
      lines:
        - "（正午になった。……でも、金の扉は、びくともしない。）"
        - "クロン: 札には『今日という日の』とある。塔の暦で今日が何月何日か、大時計に聞いてみなされ。日と月の欄じゃよ。"
    - if: "!door3_open"
      lines:
        - "（……金の扉は、閉ざされたままだ。）"
        - "クロン: 予定表に、金の扉の行がないようじゃ。"
    - lines:
        - "（塔は、予定表のとおりに、静かに時を刻んでいる。）"

intro:
  - "（古い竪坑のはしごを、どこまでも登っていく。）"
  - "（はしごの先の扉を押し開けると……石づくりの、高い塔の中だった。）"
  - "（カーン……カーン……。どこかで、鐘が鳴りつづけている。）"
  - "コダマ: ……やかましい鐘じゃな。さっきから、少しも鳴りやまぬ。"
guide:
  - "[まずは `ls` で、あたりを見渡してみよう。]"

objectives:
  - if: ch7_clear
    text: "第8章「記憶の書庫」は制作中です"
  - if: door3_open
    text: "金の扉の先の、頂上へ登ろう"
  - if: "bell_fixed & !cron_bell"
    text: "鐘の行を書き直して、塔に渡そう"
  - if: door2_open
    text: "金の扉の札を読んで、予定表に書き足そう"
  - if: door1_open
    text: "銀の扉の札を読んで、予定表に書き足そう"
  - if: bell_fixed
    text: "銅の扉の札を読んで、予定表に書き足そう（`>>`）"
  - if: wrote_cron
    text: "書いた予定表を、塔に渡そう（`crontab`）"
  - if: cron_writable
    text: "予定表を、`echo` で書き直そう"
  - if: backed_up
    text: "予定表の鍵を確かめて、書けるようにしよう"
  - if: read_cron
    text: "書き直す前に、予定表の写しをとろう（`予定表.bak`）"
  - if: asked_schedule
    text: "予定表を読もう"
  - if: saw_date
    text: "塔守クロンに、大時計のことを話そう"
  - if: met_kron
    text: "大時計に、今の日時を聞こう（`date`）"
  - text: "鐘の鳴りやまない塔を、調べよう"

hints:
  - if: ch7_clear
    steps: ["第7章はここまで。遊んでくれてありがとう！"]
  - if: door3_open
    steps:
      - "金の扉が開いた。その先が、頂上だ。"
      - "金の扉の中へ入って、頂上へ。"
      - "`cd /etc/銅の扉/銀の扉/金の扉/頂上`"
  - if: "bell_fixed & !cron_bell"
    steps:
      - "予定表から、鐘の行が消えてしまった。まずは、予定表を読んで確かめよう。"
      - "`>` は書き直し、`>>` は書き足し。鐘の行を `>` で書いてから、扉の行を `>>` で書き足し、`crontab` で渡そう。"
      - "`echo \"0 9 * * * 鐘を鳴らす\" > /etc/予定表` → 扉の行を `>>` で書き足す（例: `echo \"0 9 * * * 銅の扉を開ける\" >> /etc/予定表`）→ `crontab /etc/予定表`"
  - if: door2_open
    steps:
      - "金の扉の札は「今日という日の、正午にだけ開く」。今日は、何月何日だろう？"
      - "今日の日付は `date` で分かる。予定表は左から「分 時 日 月 曜日」。日と月の欄にも、数を書こう。"
      - "`date` → `echo \"0 12 13 7 * 金の扉を開ける\" >> /etc/予定表` → `crontab /etc/予定表`"
  - if: door1_open
    steps:
      - "銀の扉の札は「銅の扉が開いてから、30分ののちに開く」。銅の扉が開いたのは、9時0分。"
      - "9時30分を、予定表の書き方（分 時 日 月 曜日）で書いて、`>>` で書き足そう。予定表は、塔の入口（`/etc`）にある。"
      - "`echo \"30 9 * * * 銀の扉を開ける\" >> /etc/予定表` → `crontab /etc/予定表`"
  - if: bell_fixed
    steps:
      - "銅の扉の札は「朝の鐘と、同じ刻に開く」。"
      - "鐘の行は消さずに、`>>` で書き足そう。書けたら `crontab` で渡す。"
      - "`echo \"0 9 * * * 銅の扉を開ける\" >> 予定表` → `crontab 予定表`"
  - if: wrote_cron
    steps:
      - "書き直した予定表を、塔に渡そう。"
      - "塔に渡すのは `crontab 紙の名前`。"
      - "`crontab 予定表`"
  - if: cron_writable
    steps:
      - "コダマに教わった `echo` で、予定表を書き直そう。"
      - "`>` のうしろに紙の名前を書くと、声が紙に写る。`*` を使うときは、ことばを `\"` で囲む。"
      - "`echo \"0 9 * * * 鐘を鳴らす\" > 予定表`"
  - if: backed_up
    steps:
      - "予定表には、鍵がかかっているかもしれない。"
      - "鍵のかけ方を見るのも、自分の鍵を開けるのも、ムラガレで覚えた言葉だ。"
      - "`ls -l` → `chmod u+w 予定表`"
  - if: read_cron
    steps:
      - "書き直す前に、予定表の写しをとっておこう。写しの名は `予定表.bak`。"
      - "写しをとるのは、市場町で覚えた言葉だ。"
      - "`cp 予定表 予定表.bak`"
  - if: asked_schedule
    steps:
      - "クロンに頼まれて、予定表を読もう。"
      - "読むのは `cat`。"
      - "`cat 予定表`"
  - if: saw_date
    steps:
      - "大時計の時刻が、止まっているようだ。塔守に話そう。"
      - "話しかけるのは `cat`。"
      - "`cat クロン`"
  - if: met_kron
    steps:
      - "今の日時を、大時計に聞いてみよう。"
      - "日時を確かめるのは `date`。"
      - "`date`"
  - steps:
      - "塔の中に、だれかいるようだ。"
      - "まわりを見るのは `ls`、話しかけるのは `cat`。"
      - "`ls` → `cat クロン`"

events:
  # 2回目の date（止まっている間）。1回目と同じ時刻
  - on: date
    if: "saw_date & !date_twice & !bell_fixed"
    once: date_twice
    lines:
      - "{name}: ……また、9時ちょうど。さっきと、1秒も変わってない！"
      - "コダマ: 時が、止まっておるのか……。"
  - on: date
    once: saw_date
    lines:
      - "{name}: 7月12日、9時ちょうど……？ {me}が、村を出た日だ。あれから、もう何日も旅をしてきたのに……。"
      - "コダマ: ……もう一度、確かめてみよ。"
  # 予定表の読み方。書き直す前に、写しを頼まれる
  - on: cat
    target: /etc/予定表
    if: asked_schedule
    once: read_cron
    lines:
      - "{name}: 『`* * * * *` 鐘を鳴らす』って書いてある。"
      - "クロン: ……なんと。予定表の書き方はな、左から『分 時 日 月 曜日』、そのうしろに仕事じゃ。"
      - "クロン: 欄には、どれも数を書く。曜日も数でな、0が日曜、1が月曜、2が火曜……6が土曜じゃ。"
      - "クロン: `*` は『いつでも』のしるし。`* * * * *` は、毎月、毎日、毎時、毎分……一分ごとに鐘を鳴らせ、ということじゃ。"
      - "{name}: だから、鐘が鳴りやまないんだ……！"
      - "クロン: 鐘は、時を告げるもの。鳴るたびに、塔は『9時の鐘じゃ』と思いこんで、針を9時に戻してしまう。"
      - "コダマ: それで、時が9時から進まぬのか。"
      - "クロン: 本当は『`0 9 * * *`』……毎日、9時0分に一度だけ、のはずじゃ。モリビトさまが止まったあの日から、字がくずれてしまったのじゃろう。"
      - "{name}: （モリビト……ここにも……。）"
      - "クロン: 書き直してくれんか。……ただ、その前に。"
      - "クロン: 先代の塔守が書いた予定表じゃ。書きそこねても戻せるよう、写しをとっておいてくれ。写しの名は、昔からの決まりで `予定表.bak`（バック）じゃ。"
  # 写しがとれたら、予定表を預かる（持ち主がきみになる）
  - on: cp
    exists: [/etc/予定表.bak]
    once: backed_up
    chown: { path: /etc/予定表, owner: きみ }
    lines:
      - "クロン: よしよし、写しができたの。"
      - "クロン: では、この予定表は、しばらくお前さんに預けよう。持ち主は、お前さんじゃ。"
      - "{name}: {me}が、持ち主に……。"
      - "クロン: じゃが、先代は、うっかり書きかえられぬよう、紙に鍵をかけておったはずじゃ。鍵の具合を、確かめてみなされ。"
  # 予定表に書けた（echo を試す前に、いきなり書いても）
  - on: echo
    wrote: /etc/予定表
    once: wrote_cron
    set: [tried_echo]
    learn: ["echo >", crontab]
    lines:
      - "クロン: おお、書けたかの。書いた字は、予定表を読めば確かめられるぞ。"
      - "クロン: 書けたら、`crontab 予定表` と唱えて、塔に渡してくだされ。塔は、渡された予定表のとおりに動く。"
      - "{name}: `crontab`……塔に、予定を渡す言葉。"
  # はじめての echo。こだまのように返ってくる
  - on: echo
    if: "cron_writable & !wrote_cron"
    once: tried_echo
    learn: ["echo >"]
    lines:
      - "コダマ: そうじゃ。われと同じ、こだまよ。言ったことが、そのまま返ってくる。"
      - "コダマ: そのうしろに `>` と紙の名を書けば、声が返ってくるかわりに、紙に写る。`>` は、紙を書き直す。前の字は、消えてしまうがの。"
      - "{name}: じゃあ、予定表を書き直すなら……。"
      - "コダマ: `echo \"0 9 * * * 鐘を鳴らす\" > 予定表` じゃ。`*` を使うときは、ことばを `\"` で囲むのを忘れるでないぞ。"

companions:
  - name: コダマ
    joinIf: kodama_joined
    variants:
      - at: /etc
        if: bell_fixed
        lines: ["コダマ: 静かになったの。……時の流れる音がする。"]
      - at: /etc
        lines: ["コダマ: ……鐘の音が、頭に響く。この塔、なにかがおかしいぞ。"]

places:
  # 第0章で「？？？」として置いてあった /etc（物見の塔）に、中身を足す
  - path: /etc
    visibleIf: ch6_clear
    icon: tower
    theme: tower
    bgm: 時の風
    bellIf: "!bell_fixed"
    mode: "rwxrwxrwx"
    children:
      - name: クロン
        owner: クロン
        mark: "!met_kron | (saw_date & !asked_schedule)"
        set: [met_kron]
        learn: [date]
        lines:
          - "（白いひげの老人が、椅子にもたれて、うとうとしている。）"
          - "クロン: ……むにゃ。おお、9時じゃ。鐘を鳴らさねば……。"
          - "{name}: あの……。"
          - "クロン: おや、旅の方。わしはクロン、この物見の塔の塔守じゃ。……いま、何時かのう？"
          - "{name}: えっ……？ いま、9時って……。"
          - "クロン: そうそう、9時じゃ。……いや、さっきも9時じゃった気がするのう。"
          - "クロン: 時が気になるなら、大時計に聞くとよい。`date` と唱えれば、今の日時を教えてくれる。"
        variants:
          - if: tower_view
            lines:
              - "クロン: 頂上からの眺めは、よかったじゃろう。……鍵束の男は、書庫のほうへ向かったよ。"
              # 伏線（調べても、本編では何も分からない。くわしくは手元の docs/sequel.md の伏線の表）
              - "クロン: ……そういえば、時が止まる前の晩じゃ。夜更けに、だれかが塔の階段を上る足音を聞いた気がする。"
              - "{name}: 夜更けに……？ だれが？"
              - "クロン: さあのう……。降りてくる足音は、聞かなんだ。……寝ぼけておったのかもしれん。"
          - if: door3_open
            lines: ["クロン: 金の扉の先が、頂上じゃ。……わしも、あとから登ろう。"]
          - if: "bell_fixed & !cron_bell"
            lines:
              - "クロン: 予定表から、鐘の行が消えておる。まずは鐘の行を書き直してくだされ。"
              - "クロン: ほかの行は、そのあと `>>` で書き足すのじゃ。書けたら、また塔に渡してくだされ。"
          - if: door2_open
            lines: ["クロン: 金の扉の札は、銀の扉の中じゃ。『今日という日』……今日が何日か、大時計に聞いてみなされ。"]
          - if: door1_open
            lines: ["クロン: 銀の扉の札は、銅の扉の中じゃ。予定表は、この部屋（`/etc`）にあるのを忘れずにな。"]
          - if: bell_fixed
            lines: ["クロン: 銅の扉の札に、開く刻が書いてある。書き足すときは `>>` じゃよ。"]
          - if: wrote_cron
            lines: ["クロン: 書けたら、`crontab 予定表` で塔に渡してくだされ。"]
          - if: cron_writable
            lines: ["クロン: 紙に書く言葉なら、お連れの狐どのが知っておるようじゃ。"]
          - if: backed_up
            lines: ["クロン: 予定表は、お前さんに預けた。……じゃが、鍵がかかっておるかもしれん。鍵の具合を、確かめてみなされ。"]
          - if: read_cron
            lines: ["クロン: 書き直す前に、写しじゃ。名は `予定表.bak`。この部屋にとっておいてくだされ。"]
          - if: asked_schedule
            lines: ["クロン: そこの予定表を、読んでみてくれんか。わしは、目がかすんでのう。"]
          - if: saw_date
            set: [asked_schedule]
            lines:
              - "{name}: クロンさん、大時計が、ずっと9時のままなんだ。何度見ても、1秒も進まない。"
              - "クロン: ……やはりそうか。この塔は、予定表のとおりに鐘を鳴らし、時を進めておる。"
              - "クロン: 時が止まったのなら、予定表がおかしいのじゃろう。……そこの予定表を、読んでみてくれんか。わしは、目がかすんでのう。"
          - if: met_kron
            lines: ["クロン: `date` と唱えれば、大時計が今の日時を教えてくれる。"]
      - name: 塔の記録
        icon: item
        set: [read_tower_log]
        text: ["09:00 鐘を鳴らす", "09:00 鐘を鳴らす", "09:00 鐘を鳴らす", "09:00 鐘を鳴らす", "09:00 鐘を鳴らす", "09:00 鐘を鳴らす", "09:00 鐘を鳴らす", "09:00 鐘を鳴らす"]
        lines:
          - "（同じ行が、紙の終わりまで、びっしりと続いている。）"
          - "{name}: ずっと、9時……？"
      - name: 大時計
        icon: clock
        lines: ["（大きな振り子の時計だ。針は、9時を指したまま、ぴくりとも動かない。）"]
        variants:
          - if: "bell_fixed & cron_bell"
            lines: ["（振り子が、こち、こちと揺れている。針は、ちゃんと進んでいる。）"]
          - if: met_kron
            lines: ["（大きな振り子の時計だ。針は、9時を指したまま、ぴくりとも動かない。`date` と唱えれば、日時を教えてくれるらしい。）"]
      - name: 予定表
        icon: scroll
        owner: クロン
        mode: "r--r--r--"
        mark: "(asked_schedule & !read_cron) | (backed_up & !cron_writable)"
        text: ["# 分 時 日 月 曜日 仕事", "* * * * * 鐘を鳴らす"]
        deniedLines:
          - "コダマ: ……書けぬな。紙の鍵を、確かめてみよ。"
        onChmod:
          - can: w
            once: cron_writable
            learn: [echo]
            lines:
              - "（予定表の鍵が開いた。これで、書きこめる。）"
              - "{name}: でも、どうやって紙に書くんだろう……。"
              - "コダマ: ……ふふ。それなら、われの名のもとになった言葉がある。"
              - "コダマ: `echo` じゃ。言ったことが、こだまのように、そのまま返ってくる。……`echo やっほー` と唱えてみよ。"
      - name: 銅の扉の札
        icon: board
        mark: "bell_fixed & !read_door1"
        lines:
          - "「銅の扉 ― 朝の鐘と、同じ刻に開く。仕事の名は『銅の扉を開ける』」"
          - "{name}: 予定表で、扉が開くのかな……。"
        variants:
          - if: bell_fixed
            set: [read_door1]
            learn: ["echo >>"]
            lines:
              - "「銅の扉 ― 朝の鐘と、同じ刻に開く。仕事の名は『銅の扉を開ける』」"
              - "クロン: 鐘の行は、もう予定表に書いてある。そこに、銅の扉の行を書き足すのじゃ。"
              - "クロン: 書き足すときは、`>` ではなく `>>`。`>` は紙を書き直すので、前の字が消えてしまうでな。"
              - "{name}: `>>` は、書き足し……。"
      - name: 銅の扉
        icon: door
        gate:
          if: "!door1_open"
          lines: ["（扉は、かたく閉ざされている。……予定どおりの刻にしか、開かないようだ。）"]
        children:
          - name: 銀の扉の札
            icon: board
            mark: "door1_open & !read_door2"
            set: [read_door2]
            lines:
              - "「銀の扉 ― 銅の扉が開いてから、30分ののちに開く。仕事の名は『銀の扉を開ける』」"
              - "{name}: 銅の扉が開いたのは、9時ちょうど。その30分あと……。"
          - name: 銀の扉
            icon: door
            gate:
              if: "!door2_open"
              lines: ["（扉は、かたく閉ざされている。……予定どおりの刻にしか、開かないようだ。）"]
            children:
              - name: 金の扉の札
                icon: board
                mark: "door2_open & !read_door3"
                set: [read_door3]
                lines:
                  - "「金の扉 ― 今日という日の、正午にだけ開く。仕事の名は『金の扉を開ける』」"
                  - "{name}: 今日って……何月何日だろう。"
              - name: 金の扉
                icon: door
                gate:
                  if: "!door3_open"
                  lines: ["（扉は、かたく閉ざされている。……予定どおりの刻にしか、開かないようだ。）"]
                children:
                  - name: 頂上
                    icon: tower
                    mark: "door3_open & !tower_view"
                    onEnter:
                      - once: ch7_clear
                        set: [tower_view]
                        lines:
                          - "（長い階段を登りきると、塔のてっぺんに出た。）"
                          - "（風が吹きぬける。……眼下に、世界が広がっていた。）"
                          - "{name}: すごい……。森も、沼も、市場町も……ぜんぶ見える。"
                          - "コダマ: 見よ、人の子。まだ行っておらぬ場所も、見えるぞ。"
                        effect: reveal
                        reveal: [/var/log, /root]
                        guide:
                          - { at: map, text: "地図に、まだ行っていない場所の名前が現れた。山道の下の谷にあるのが、記憶の書庫（`/var/log`）。いちばん遠く、雲の上にあるのが、賢者の庵（`/root`）。" }
                        after:
                          - "（息を切らして、クロンが階段を登ってきた。）"
                          - "クロン: ふう、ふう……。どうじゃ、よい眺めじゃろう。"
                          - "{name}: クロンさん……。チルダ村も、見える。あそこだけ、色がない……。"
                          - "クロン: チルダ村、とな。……あの村のパン屋の窯は、毎朝6時に、ひとりでに火がつかなんだか？"
                          - "{name}: え……！ どうして知ってるの！？"
                          - "クロン: あれも、予定表の仕事じゃよ。『`0 6 * * *` 窯に火を入れる』……世界じゅうの村の予定が、この塔に預けられておる。"
                          - "クロン: じゃがな、わしは、預かった予定表を読むだけの者。毎朝わしを起こし、世界じゅうの予定を回させていたのは……モリビトさまじゃ。"
                          - "{name}: モリビトが……。"
                          - "コダマ: 見えない支え、とは……村の時間そのもの、であったか。"
                          - "{name}: ……{me}が止めたから、窯の火も、つかなくなったんだ。"
                          - "クロン: ……なんと？ お前さんが……モリビトさまを、止めた……？"
                          - "{name}: ……うん。村はずれの石碑に刻まれていた言葉を、唱えちゃったんだ。何が起きるかも、知らずに。"
                          - "（クロンは、しばらく何も言わずに、遠くのチルダ村を見つめていた。）"
                          - "クロン: ……そうか。それで、世界じゅうの時が、狂ってしまったのか……。"
                          - "コダマ: ……やはり、そうであったか。"
                          - "{name}: コダマ……気づいてたの？"
                          - "コダマ: 薄々な。森で会うたときから、おまえの目は、何か重いものを背負っておった。"
                          - "クロン: ……正直に言えば、わしは、たまげたよ。ずっと塔の時が止まって、わけも分からず、ひとりで9時を数えておったでな。"
                          - "{name}: ……ごめんなさい。"
                          - "クロン: じゃがな。止まった塔の時を、もう一度動かしてくれたのも、お前さんじゃ。"
                          - "クロン: 止めてしまったものは、また動かせる。……今日、この塔で、お前さんがしてみせたようにな。"
                          - "{name}: ……うん。"
                          - "クロン: 鍵束の男なら、少し前に、ここから谷のほうをじっと見ておった。記憶の書庫……世界じゅうの記録が眠る場所じゃ。"
                          - "コダマ: スドウは、書庫へ向かったか。……行こう、人の子よ。"
                          - "{name}: うん。"
                          - "<chapterEnd>"
                    children: []

  # 頂上から見える、まだ行っていない場所（第8章・第9章）。見えるようになるだけで、まだ入れない
  - path: /var
    children:
      - name: log
        label: 記憶の書庫
        icon: scroll
        visibleIf: tower_view
        gate:
          if: "!ch7_clear"
          lines: ["（谷の底の書庫へは、塔を降りてから向かおう。）"]
        children: []
  - path: /root
    visibleIf: tower_view
    gate:
      if: "!ch8_clear"
      lines: ["（雲の上の庵へ続く道は、まだ見えない。）"]
