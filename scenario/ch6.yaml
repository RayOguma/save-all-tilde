# 第6章｜坑道アナグラ — 正しい kill（ps・fg・bg・kill 番号・chgrp）
#
# 書き方は ch0〜ch5.yaml の先頭を参照。この章で増えたもの:
#   procs        目に見えずに動いている者たち。pid（番号）・name・state（裏にいるときの状態）。
#                fg で表に呼ぶと fg_番号、kill すると killed_番号 のフラグが立つ。
#                onFg / onBg / onKill（それぞれのイベント）、noFg（呼べないときのせりふ）、
#                killIf / killBlocked（止めてよい条件と、まだ止められないときのせりふ）、onWrite（裏にいても声は届く）
#   gameOver     イベントに書くと、せりふのあとゲームオーバー。やり直しの場所（rewindPoint）から始め直す
#   rewindPoint  ここを、ゲームオーバーのときのやり直しの場所にする。cwd で、やり直す場所を変えられる
#   timeLimit    時間制限。seconds 秒のうちに path の場所が group の組・mode の鍵になれば onSuccess、だめなら onTimeout。
#                残り時間は見せず、warnings（at 秒）で迫ってくることを伝える
#
# 物語の流れ（フラグの順）:
#   read_roll（点呼板。ps を覚える）→ saw_ps → wrote_nohup（write で声をかける。fg を覚える）→ fg_0231
#   → gave_medicine（薬を渡す。ムラガレの組の話。出口まで案内してくれる）→ fg_0455 → talked_minashigo（bg を覚える）
#   → minashigo_hidden（bg 0455）→ 深い坑道 → beast_appeared（分かれ道。3分の時間制限）
#   → hid_together（mkdir・chgrp・chmod で隠れ場）→ kill_returned → beast_killed（kill 0999）→ ch6_clear（find で古い竪坑へ）
#   ゲームオーバー: 時間切れ／ノーハップ（0231）・ミナシゴ（0455）を kill する

chapter: { no: 6, title: 坑道アナグラ, startIf: ch5_clear, startAt: /proc }

# この章をクリアすると手に入るもの（「章を選ぶ」で次の章から始めるとき、テストの準備に使う）
clear:
  flags: [read_roll, saw_ps, wrote_nohup, gave_medicine, talked_minashigo, minashigo_hidden, beast_appeared, hid_together,
          kill_returned, killed_0999, beast_killed, ch6_clear]
  learned: [ps, fg, bg, chgrp]
  discovered: [/proc]
  ops:
    - { op: mkdir, path: /proc/深い坑道/分かれ道/隠れ場 }
  perms:
    /proc/深い坑道/分かれ道/隠れ場: { group: ムラガレ, mode: "rwxrwx---" }
  history: [ls, cat 点呼板, ps, "write ノーハップ \"ハルから、薬を預かってきました\"", fg 0231, cat ノーハップ, fg 0455,
            cat ミナシゴ, bg 0455, cd /proc/深い坑道, cd 分かれ道, mkdir 隠れ場, chgrp ムラガレ 隠れ場,
            "chmod g+rwx,o-rwx 隠れ場", ps, kill 0999, "find /proc -name \"*竪坑*\"", cd 下り坂/崩れた横穴/古い竪坑]

characters:
  ノーハップ: { sprite: nohup, color: "#d8a070", voice: 380 }
  ミナシゴ: { sprite: minashigo, color: "#a8c0e0", voice: 880 }
  影の獣: { sprite: beast, color: "#c05050", voice: 180 }

madeIcons:
  隠れ場: hideout

allow:
  # 獣から隠れる。隠れ場は、分かれ道に作る
  - cmd: mkdir
    to: /proc/深い坑道/分かれ道/隠れ場
    if: "beast_appeared & !hid_together"
    wrong:
      - "ノーハップ: そこじゃない！ ここ（分かれ道）に作るんだ！"

procs:
  - pid: "0231"
    name: ノーハップ
    state: 裏で動く
    onWrite:
      - once: wrote_nohup
        learn: [fg]
        lines:
          - "（カン、カン……と、鉄を打つ音が、ふっと止まった。）"
          - "ノーハップ: ……ごほっ、ごほっ。……だれだ？ こんな坑道の奥まで、人が来るなんて。"
          - "ノーハップ: 悪いが、手が離せん。……顔が見たけりゃ、`fg` で呼べ。`fg` のうしろに、おれの番号札だ。"
      - lines: ["ノーハップ: 用があるなら、`fg` で呼んでくれ。"]
    onFg:
      once: nohup_appeared
      lines:
        - "（暗がりから、すすだらけの青年が現れた。手には、まだ金槌をにぎっている。）"
        - "ノーハップ: ……ほんとに呼ばれちまった。表に出るのは、久しぶりだ。……ごほっ。"
    onBg:
      lines:
        - "（ノーハップは、暗がりへ戻っていった。……カン、カン、と、また鉄を打つ音がする。）"
        - "コダマ: ……案内してもらうのであろう。表に呼んでおかねばな。"
    onKill:
      gameOver: true
      lines:
        - "（`kill 0231`――。その番号は……。）"
        - "ノーハップ: ……ぐっ……！ お前……番号、を……。"
        - "（ノーハップの姿が、ふっと消えた。鉄を打つ音も、もう聞こえない。）"
        - "コダマ: ……人の子よ。おまえは、また……。"
        - "（コダマは、なにも言わずに背を向けて、暗がりへ去っていった。）"
        - "（{me}は……その場から、一歩も動けなくなった。）"
  - pid: "0455"
    name: ミナシゴ
    state: 眠っている
    onFg:
      once: minashigo_appeared
      lines:
        - "（小さな子が、目をこすりながら現れた。……泣いている。）"
    onBg:
      once: minashigo_hidden
      lines:
        - "（ミナシゴは、こくりとうなずいて、暗がりへ消えていった。）"
        - "ノーハップ: よし。……じゃあ、出口へ案内してやる。次は `cd /proc/深い坑道` だ。"
    onKill:
      gameOver: true
      lines:
        - "（`kill 0455`――。その番号は……。）"
        - "ミナシゴ: ……え……？"
        - "（小さな姿が、ふっと消えた。）"
        - "ノーハップ: お前……なんてことを……！"
        - "コダマ: ……人の子よ。おまえは、また……。"
        - "（コダマは、なにも言わずに背を向けて、暗がりへ去っていった。）"
        - "（{me}は……その場から、一歩も動けなくなった。）"
  # 伏線（調べても、本編では何も分からない。くわしくは手元の docs/sequel.md の伏線の表）
  - pid: "0000"
    name: ""
    state: "？"
    noFg:
      - "（`fg 0000` と唱えた。……呼んでも、何も返ってこない。声が、穴に吸いこまれていくようだ。）"
      - "コダマ: ……なんじゃ、今のは。名も持たぬ者が、坑道におるのか……？"
    # 止められない（このフラグは立たない）
    killIf: null_never
    killBlocked:
      - "（`kill 0000`――。唱えたはずの言葉が、見えない手に、はじかれた。）"
      - "コダマ: ……手ごたえが、まるでない。底のない穴に、石を投げこんだようじゃ。"
  - pid: "0999"
    name: 影の獣
    state: 暴走
    noFg:
      - "コダマ: やめよ！ あれを表に呼べば、ひとたまりもないぞ。"
    killIf: hid_together
    killBlocked:
      - "（……唱えようとして、のどが固まった。あの日の、モリビトの姿が浮かぶ。）"
      - "コダマ: ……人の子よ。いまは、まだ早い。"
    onKill:
      once: beast_killed
      lines:
        - "（`kill 0999`――。その言葉を、唱えた。）"
        - "（坑道の奥で、獣の叫び声が響いた。）"
        - "<roar>"
        - "影の獣: ……ム……ラ……ガ……レ……。"
        - "（叫び声は、すうっと消えていった。……坑道に、ランプの明かりが戻ってくる。）"
        - "{name}: ……ムラガレ……？"
        - "コダマ: ……あの獣は、ムラガレの見えない支えの、成れの果てだったのやもしれぬ。"
        - "コダマ: 支えを失い、行き場をなくして……暴れるしかなかったのであろう。"
        - "{name}: ……{me}が……。"
        - "ノーハップ: ……よくやった。辛かったろう。"
        - "ノーハップ: お前が、どうしてその言葉を知ってたのかは、おれには分からん。……聞くつもりもない。"
        - "{name}: …………。"
        - "ノーハップ: だがな、`kill` は、それだけで悪い言葉じゃない。番号をよく確かめて、止めるべきものだけを止める。"
        - "ノーハップ: 正しく使えば、ちゃんと人を守れる言葉なんだ。……今日、お前がそうしたようにな。"
        - "{name}: ……うん。"
        - "ノーハップ: この先に『古い竪坑』ってところがある。そこが出口だ。"
        - "ノーハップ: 鍵束の男も、竪坑のほうへ抜けていった。どこまで行ったかは分からんがな。"

intro:
  - "（狭い抜け道を抜けると、ひんやりとした空気に包まれた。）"
  - "（真っ暗だ。手さぐりで進むと、古いランプが、かすかに灯っている。）"
  - "コダマ: ……人の気配はある。……じゃが、目には見えぬ。"
guide:
  - "[まずは `ls` で、あたりを見渡してみよう。]"

objectives:
  - if: ch6_clear
    text: "第7章「物見の塔」は制作中です"
  - if: beast_killed
    text: "出口の「古い竪坑」を探して、坑道を抜けよう"
  - if: hid_together
    text: "影の獣を止めよう。番号を、よく確かめて"
  - if: beast_appeared
    text: "獣が入れない隠れ場を作って、隠れよう！"
  - if: minashigo_hidden
    text: "ノーハップの案内で、坑道の奥へ進もう"
  - if: talked_minashigo
    text: "ミナシゴを、裏に隠してあげよう（`bg`）"
  - if: gave_medicine
    text: "ミナシゴ（0455）に会いに行こう"
  - if: nohup_appeared
    text: "ノーハップと話そう"
  - if: wrote_nohup
    text: "ノーハップを、表に呼ぼう（`fg`）"
  - if: saw_ps
    text: "裏で働いている、ハルの兄に声をかけよう"
  - if: read_roll
    text: "坑道にいる者たちを、点呼しよう（`ps`）"
  - text: "暗い坑道を調べよう"

hints:
  - if: ch6_clear
    steps: ["第6章はここまで。遊んでくれてありがとう！"]
  - if: beast_killed
    steps:
      - "ノーハップによると、出口は「古い竪坑」。場所は、探せば分かる。"
      - "探しものは `find`。「竪坑」とつく場所を探そう。"
      - "`find /proc -name \"*竪坑*\"` → 見つけた道のりへ `cd`"
  - if: hid_together
    steps:
      - "影の獣を、止めるしかない。番号を、よく確かめよう。"
      - "番号は `ps` で分かる。止めるのは `kill 番号`。"
      - "`ps` → `kill 0999`"
  - if: beast_appeared
    steps:
      - "急げ！ ムラガレの組の者だけが入れる隠れ場を作ろう。"
      - "場所を作る → 組を変える → 家族に開けて、よその者に閉める。"
      - "`mkdir 隠れ場` → `chgrp ムラガレ 隠れ場` → `chmod g+rwx,o-rwx 隠れ場`"
  - if: minashigo_hidden
    steps:
      - "ノーハップの案内で、坑道の奥へ進もう。"
      - "まずは深い坑道へ。その先が、分かれ道だ。"
      - "`cd /proc/深い坑道` → `cd 分かれ道`"
  - if: talked_minashigo
    steps:
      - "この先の道は危ない。ミナシゴを、裏に隠してあげよう。"
      - "裏に戻すのは `bg 番号`。"
      - "`bg 0455`"
  - if: gave_medicine
    steps:
      - "ノーハップが、ミナシゴのことを頼んできた。"
      - "ミナシゴの番号は、`ps` で分かる。表に呼ぶのは `fg 番号`。"
      - "`fg 0455` → `cat ミナシゴ`"
  - if: nohup_appeared
    steps:
      - "表に出てきたノーハップと、話そう。"
      - "話しかけるのは `cat`。"
      - "`cat ノーハップ`"
  - if: wrote_nohup
    steps:
      - "ノーハップを、表に呼ぼう。"
      - "表に呼ぶのは `fg 番号`。番号は `ps` で分かる。"
      - "`fg 0231`"
  - if: saw_ps
    steps:
      - "ハルの兄は、裏で働いていて姿が見えない。でも、声なら届くかもしれない。"
      - "扉の向こうの人に声を届けたのは `write`（第3章）。ハルの兄の名前は、`ps` で分かる。"
      - "`write ノーハップ \"ハルから、薬を預かってきました\"`"
  - if: read_roll
    steps:
      - "目には見えない者たちを、点呼しよう。"
      - "点呼するのは `ps`。"
      - "`ps`"
  - steps:
      - "暗い坑道。なにか、手がかりになるものはないだろうか。"
      - "まわりを見るのは `ls`、読むのは `cat`。"
      - "`ls` → `cat 点呼板`"

events:
  # はじめての ps。通路の番号と、同じ
  - on: ps
    once: saw_ps
    lines:
      - "{name}: 0231、0455、0999……。通路の番号と、同じだ……。"
      - "コダマ: 姿は見えずとも、名と番号は分かる、ということか。……ノーハップ、という名に、聞きおぼえはないか。"
      - "{name}: ノーハップ……ムラガレの名簿にあった、鍛冶屋の……ハルのお兄さんだ！ 裏で動いてるって、どういうことだろう。"

companions:
  - name: コダマ
    joinIf: kodama_joined
    variants:
      - at: /proc
        lines:
          - "コダマ: ……暗いのう。目には見えぬ者たちが、あちこちで動いておるようだ。"
  # ノーハップは、fg で表に呼ぶと、出口まで一緒に来て案内してくれる
  - name: ノーハップ
    joinIf: "fg_0231 & !ch6_clear"
    set: [gave_medicine]
    lines:
      - "ノーハップ: おれはノーハップ。ムラガレの鍛冶屋さ。"
      - "{name}: ノーハップ……ハルのお兄さん！ {me}、ムラガレから来たんだ。"
      - "ノーハップ: ハルを、知ってるのか？ ……ごほっ、ごほっ。"
      - "{name}: その咳……！ ハルにも咳が出てて……薬屋のおじいさんが、薬を作ってくれたんだ。これ、ノーハップの分。"
      - "（預かっていた薬を、ノーハップに渡した。）"
      - "（ノーハップは薬を飲んだ。……しばらくすると、荒かった息が、少し落ち着いた。）"
      - "ノーハップ: ……おれの薬だ。じいさん、覚えててくれたのか……。ハルは、無事か？"
      - "{name}: うん。薬を飲んだら、咳もおさまったよ。……それと、{me}もグロウプ婆に、ムラガレの組に入れてもらったんだ。"
      - "ノーハップ: 婆さんが？ そうか……なら、お前も、ムラガレの仲間だな。"
      - "ノーハップ: 支えが弱ってから、坑道はずっと真っ暗でな。おれは、裏でひたすら働き続けてた。手を止めたら、坑道ごと崩れそうでな。"
      - "{name}: ずっと、ひとりで……。"
      - "ノーハップ: 薬の礼がしたい。坑道は迷いやすい。出口まで、おれが案内してやる。"
      - "ノーハップ: ……ただ、その前に。0455番の、ミナシゴって子がいてな。親をなくして、ひとりで眠ってる。……見てやってくれないか。"
    variants:
      - if: beast_killed
        lines: ["ノーハップ: 出口は『古い竪坑』だ。……この坑道のどこかにある。探してみてくれ。"]
      - if: hid_together
        lines: ["ノーハップ: `ps` で獣の番号を確かめて、`kill` だ。……まちがえるなよ。"]
      - if: beast_appeared
        lines: ["ノーハップ: 急げ！ `mkdir 隠れ場`、`chgrp ムラガレ 隠れ場`、`chmod g+rwx,o-rwx 隠れ場` だ！"]
      - if: minashigo_hidden
        lines: ["ノーハップ: 出口まで案内する。次は `cd /proc/深い坑道` だ。"]
      - if: gave_medicine
        lines: ["ノーハップ: ミナシゴは、0455番だ。`fg` で呼んでやってくれ。"]
  - name: ミナシゴ
    joinIf: "fg_0455"
    set: [talked_minashigo]
    learn: [bg]
    lines:
      - "ミナシゴ: ……ひっく……。だれ……？"
      - "{name}: {me}は、{name}。……どうしたの？"
      - "ミナシゴ: ……おとうも、おかあも、いなくなっちゃった。"
      - "ミナシゴ: 親がいなくなったら、守り人さまが拾ってくれるはずなのに……。いつまで待っても、来てくれないの。"
      - "（守り人さま――モリビト。……{me}が、止めてしまった……。）"
      - "{name}: …………。"
      - "{name}: ……あのね。{me}、これから賢者に会いに行くんだ。会えたら、親のことも、なんとかなるかもしれない。"
      - "ミナシゴ: ……ほんと？"
      - "{name}: うん。……だから、もう少しだけ、待っててくれる？"
      - "ノーハップ: この先の道は、危ない。ミナシゴ、お前は裏に隠れていな。"
      - "ノーハップ: 裏に戻すのは `bg` だ。`bg` のうしろに、この子の番号札。……隠してやってくれ。"
    variants:
      - if: talked_minashigo
        lines: ["ミナシゴ: ……うん。かくれて、まってる。"]

places:
  # 第0章で「？？？」として置いてあった /proc（坑道アナグラ）に、中身を足す
  - path: /proc
    visibleIf: ch5_clear
    icon: mine
    theme: mine
    bgm: 不気味な塔
    children:
      - name: 点呼板
        icon: board
        set: [read_roll]
        learn: [ps]
        lines:
          - "（古い板に、坑夫たちの名前が彫ってある。ほとんど、かすれて読めない。）"
          - "「坑道で働く者は、目に見えずとも、点呼すれば名と番号札が分かる。点呼は `ps`」"
          - "コダマ: ……番号札、か。坑道の者は、名と番号で呼ばれるのだな。"
      - name: 0231番通路
        icon: path
        onEnter:
          - once: entered_0231
            lines:
              - "（カン、カン……と、どこかで鉄を打つ音がする。……でも、姿は見えない。）"
              - "コダマ: 姿は見えずとも、声なら届こう。"
              - "{name}: 声……。ムラガレで、グロウプ婆が扉の外から話しかけてくれたみたいに？"
              - "コダマ: うむ。あのときは、婆が言葉を届けてくれた。……こんどは、おまえが届ける番やもしれぬな。"
        children:
          - name: 鍛冶の炉
            icon: item
            lines: ["（小さな炉に、火がくすぶっている。だれかが、ついさっきまで使っていたようだ。）"]
      - name: 0455番通路
        icon: path
        children:
          - name: 小さな寝床
            icon: bed
            lines: ["（ぼろ布を重ねた、小さな寝床だ。……まだ、あたたかい。）"]
      - name: 0999番通路
        icon: path
        gate:
          if: "!beast_killed"
          lines: ["（奥から、低いうなり声がする。……近づかないほうがいい。）", "影の獣: ……グルルル……。"]
        children:
          - name: 爪あと
            icon: rock
            lines: ["（岩の壁に、大きな爪あとが残っている。……もう、なにもいない。）"]
      - name: 深い坑道
        icon: path
        gate:
          if: "!minashigo_hidden"
          lines: ["（暗くて、どこへ続いているのか分からない。……坑道にくわしい人に、案内してもらいたい。）"]
        onEnter:
          - once: guided_deep
            lines:
              - "ノーハップ: この先が、分かれ道だ。`cd 分かれ道` で行ける。足もとに気をつけろ。"
        children:
          - name: 分かれ道
            icon: path
            mode: "rwxrwxrwx"
            onEnter:
              # 獣が現れる。ここが、ゲームオーバーのときのやり直しの場所（深い坑道から、もう一度）
              - once: beast_appeared
                rewindPoint: { cwd: /proc/深い坑道 }
                learn: [chgrp]
                lines:
                  - "（そのとき――地の底から、うなり声が響いた。）"
                  - "<stomp>"
                  - "（暗がりの奥で、赤い目がふたつ、光った。）"
                  - "影の獣: グルルル……ガアアアッ！！"
                  - "<roar>"
                  - "ノーハップ: 影の獣だ……！ こっちに向かってくるぞ！ 逃げろ！"
                  - "<stomp>"
                  - "（ずしん！ ずしん！ 地面をゆらして、獣が追ってくる！）"
                  - "<stomp>"
                  - "（分かれ道の壁ぎわまで、走って逃げた。……でも、獣の足音は、まだ追ってくる。）"
                  - "ノーハップ: どこかに隠れるぞ！ ……お前、ムラガレの組に入ったって言ってたよな！？"
                  - "{name}: う、うん！"
