                  - "ノーハップ: 最後に鍵だ。家族（`g`）には開けて、よその者（`o`）には閉める。`chmod g+rwx,o-rwx 隠れ場`！ 急げ！"
                effect: stomp
                timeLimit:
                  seconds: 180
                  path: /proc/深い坑道/分かれ道/隠れ場
                  group: ムラガレ
                  mode: "^...rwx---$"
                  warnings:
                    - { at: 20, lines: ["（ずしん……。どこかで、獣の足音がした。）"], effect: stomp }
                    - { at: 45, lines: ["（ずしん……ずしん……。獣の足音が、近づいてくる。）", "影の獣: グルルル……。"], effect: stomp }
                    - { at: 70, lines: ["影の獣: グオオオオッ！！", "（坑道じゅうに、叫び声が響きわたる！）"], effect: roar }
                    - { at: 95, lines: ["（ずしん、ずしん！ 天井から、砂がぱらぱら落ちてくる。）"], effect: stomp }
                    - { at: 120, lines: ["（うなり声が、すぐそこまで迫っている！）", "影の獣: ガアアッ！！"], effect: roar }
                    - { at: 145, lines: ["（ずしん！！ 足もとが、大きくゆれた！）"], effect: stomp }
                    - { at: 165, lines: ["影の獣: フシュー……フシュー……。", "（獣の息づかいが、背中に聞こえる……！）"], effect: stomp }
                  onSuccess:
                    once: hid_together
                    set: [kill_returned]
                    lines:
                      - "（ノーハップと、隠れ場に飛びこんだ。……息をひそめる。）"
                      - "<stomp>"
                      - "（ずしん、ずしん……。獣の足音が、隠れ場のすぐ前で止まった。）"
                      - "影の獣: グルル……？ ……フシュー……。"
                      - "（獣は、隠れ場のまわりをかぎまわって……やがて、隠れ場のすぐ前を通りすぎていく。）"
                      - "（……やがて、足音は、坑道の奥へ遠ざかっていった。）"
                      - "ノーハップ: ……行ったか。助かった……。"
                      - "{name}: ……でも、このままじゃ、先へ進めない。また出てきたら……。"
                      - "ノーハップ: ……`kill` するしかないか。"
                      - "{name}: `kill`！？"
                      - "ノーハップ: ……お前、その言葉を知ってるんだな。"
                      - "{name}: …………。"
                      - "ノーハップ: 事情は聞かん。……だが、辛いだろうが、あいつは止めるしかない。あのままじゃ、坑道ごと飲みこまれる。"
                      - "ノーハップ: 番号を、よく確かめろ。`ps` で見て、獣の番号に `kill`。……まちがえるなよ。"
                  onTimeout:
