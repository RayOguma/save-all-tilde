# 第0章｜チルダ村 — 日常と過ち（チュートリアル）
#
# ノードの書き方:
#   name       名前（. で始まると ls -a でしか見えない）
#   label      地図に出す名前（/usr → 迷いの森）。なければ name
#   icon       地図のアイコン（src/ui/sprites.ts）。人は characters の立ち絵が使われる
#   type       dir / file / process（children があれば dir、省略時は file）
#   mode       "rwxr-xr-x" 形式。プレイヤーは「その他」の3文字で判定される
#   owner      所有者（ls -l に出る）
#   visibleIf  このフラグ条件のときだけ存在する（"a & !b"、"(a & b) | c" のように書ける）
#   teaser     存在しない間も、この条件なら地図に「？？？」として出す
#   mark       この条件の間、物語を進めるために必要な場所・人（地図に赤い「!」。そこへ続く場所にも付く）
#   seen       ls や find で見つけた（名前が出た）ときに立てるフラグ。「見つけたら !」は mark の条件にこれを使う
#   gate       条件の間は入れない（物語上の通行止め）
#   drainedIf  この条件の間、この場所（と中の場所）では世界から色が抜ける
#   staticIf   この条件の間、この場所（と中の場所）では、ときどき画面が乱れて「ザザッ」と鳴る
#   bgm        この場所（と中の場所）で流す曲（public/bgm/ のファイル名から .mp3 を除いたもの）。none で無音。条件つき: [{ if, name }]
#   theme      ターミナルの枠のデザイン（src/ui/frame.ts）。中の場所は受け継ぐ。条件つき: [{ if, name }]
#              新しい場所を作るときは、その場所らしい枠を必ず用意する
#   lines      cat したときの表示
#   variants   条件つきの差し替え。上から最初に合ったものを使う（garble: true で lines を文字化け）
#   set/learn  cat したら立てるフラグ／手帳に載せるコマンド
#   onEnter    cd で入ったときのイベント（if / once / lines / effect / after / set / learn / reveal / guide / demo）
#   guide      画面の一部を枠で照らして説明する吹き出し [{ at, text, item }]。at は output（直前の出力）/ output-prev（そのひとつ前の行）/
#              dir（直前の出力の中の場所の名前）/ mark（地図の「!」）/ here（地図の、いまいる場所）/ map / input / book（右の手帳）/
#              prompt（打った行の左の住所）/ suggest（入力候補。item に候補の名前を書くと、その候補だけ）/
#              row・sub（地図の item の場所の行・右の住所 ~ や /usr。item は /usr のような道のり）
#   demo       だれかが入力欄にゆっくりコマンドを打ってみせる（兄の手本）。{ by: 打つ人, steps: [{ say, type, pauseAt, hold, tab, guide, after }] }
#              say（打つ前のせりふ）→ type を1文字ずつ打つ（pauseAt まで打ったら止まって hold の吹き出し、tab なら Tab で残りを補う）
#              → 実行 → guide → after。人の variants にも、イベントにも書ける
#
# 行の書式: 「名前: せりふ」は立ち絵つきの会話（主人公は「{name}: せりふ」）、「（…）」はナレーション、「[…]」はシステム表示、「― … ―」は見出し
# コマンドは `ls -a` のようにバッククォートで囲む（画面では枠つきで表示される）
# {name} はプレイヤー名、{me} は主人公の一人称（男の子なら「ぼく」、女の子なら「わたし」）に置き換わる
# 台本（docs/chapters/ch0_script.md）は npm run script で、このファイルから書き出す
#
# 物語の流れ（フラグの順）:
#   errand_bread（章のはじめに兄が起こしに来る。行き方がわからないと言うと、ls・cat・cd をやってみせ、そのままパン屋まで。cd .. と / を覚える）
#   → got_bread → brother_left（兄は先に帰る）→ bread_delivered（cd ~ を覚える）→ gave_share
#   → talked_piko → found_hole → saw_stone → morihito_killed → saw_mom_frozen → quest_given → world_revealed（cd /usr を覚える）→ ch0_clear
#
# 移動の教え方: はじめは .. と名前（兄の手本）→ 少し歩いたら ~（兄が家で）→ 旅立ちの前に /usr（村長）

chapter: { no: 0, title: チルダ村 }

# この章をクリアすると手に入るもの（「章を選ぶ」で次の章から始めるとき、テストの準備に使う）
clear:
  flags: [errand_bread, got_bread, talked_nano, brother_left, bread_delivered, gave_share,
          talked_piko, found_hole, saw_stone, found_morihito, morihito_killed, saw_mom_frozen, quest_given, world_revealed, ch0_clear]
  learned: ["cd ..", "cd 場所/場所", pwd, "cd ~", "ls -a", "ls 場所", kill, "cd /usr"]
  discovered: [/, /home, /usr]
  # この章で打ったはずのコマンド（「章を選ぶ」で後の章から始めたときの history。第8章で自分の記録を読む）
  history: [ls, cat バッシュ, cd .., cd パン屋, cat ナノ, pwd, cd ~, cat お母さん, cd ~/チョウン爺の家, cat チョウン爺,
            cd ~/井戸端, cat ピコ, cd ~/村はずれ/柵の裏, ls -a, cd .抜け穴, cat 古い石碑, ls -a, kill .モリビト,
            cd ~/きみの家/リビング, cat お母さん, cd ~/チョウン爺の家, cat チョウン爺, cd /usr]
host: moribito
home: /home/チルダ村
start: /home/チルダ村/きみの家/自分の部屋
startCommands: [ls, cd, cat]

# voice は文字の音の高さ（Hz）。高いほど高い声
characters:
  お母さん: { sprite: mom, color: "#f09ab4", voice: 600 }
  バッシュ: { sprite: bash, color: "#f0b060", voice: 420 }
  チョウン爺: { sprite: chown, color: "#e8c77a", voice: 300 }
  ナノ: { sprite: nano, color: "#f29a7a", voice: 660 }
  ピコ: { sprite: pico, color: "#f2b25a", voice: 820 }
  ヴィム婆: { sprite: vim, color: "#7ccf7c", voice: 480 }
  イーマ爺: { sprite: emacs, color: "#b39cf0", voice: 360 }
  キャット: { sprite: cat, color: "#b8b8c8", voice: 1000 }

# 兄のバッシュは、パン屋へ行く間だけついてくる（どこにいても cat バッシュ で話せる。ヒントも兄がくれる）
companions:
  - name: バッシュ
    joinIf: "errand_bread & !brother_left"
    lines:
      - "バッシュ: おいおい、パン屋はそっちじゃないぞ。地図の「!」をたどってみな。"
    variants:
      - at: /home/チルダ村/パン屋
        lines:
          - "バッシュ: ほら、ナノに話しかけてみな。人に話しかけるのは `cat ナノ` だ。"

# 章のはじめのナレーション。このあと画面の説明（はじめての人だけ）→ guide の順に出る
intro:
  - "（……朝だ。窓から差しこむ光で、目が覚めた。）"
  - "（{name}――きみは、チルダ村で生まれ育った、ふつうの子ども。）"
  - "（この世界では、場所は「フォルダ」、人や物は「ファイル」でできている。）"
guide: []

# 章のはじめのイベント。兄のバッシュが、当たり前のように呪文を口にしながら起こしに来る。
# パン屋へ行くことになり、主人公が「行き方がわからない」と言ってから、手本（チュートリアル）に入る
opening:
  once: errand_bread
  lines:
    - "（コンコン。部屋の扉が開いた。）"
    - "バッシュ: `ls`……っと。ベッドに、窓に、本棚に……"
    - "バッシュ: お、いたいた。`cat {name}`！ おーい、起きろー！"
    - "{name}: ……うーん……兄ちゃん……？ あと5分……。"
    - "バッシュ: だめだ。母さんが、朝ごはんのパンを切らしたってさ。いっしょにナノのパン屋まで買いに行くぞ。"
    - "{name}: ……パン屋？ 行く行く！ ……あ、でも{me}、どうやって行くのか、よくわからないよ。"
    - "バッシュ: え、まだ村の歩き方、知らないのか？"
    - "{name}: うん……いつも兄ちゃんについていくだけだったし。"
    - "バッシュ: しょうがないな。じゃあ、おれがやってみせるから、よく見てろよ。そこの入力欄だ。"
  demo:
    by: バッシュ
    steps:
      - say:
          - "バッシュ: まずは、まわりを見渡す呪文 `ls`。さっき、おれが部屋に入ってくるときに言ってたやつだ。"
        intro:
          - { at: terminal, text: "ここが「ターミナル」。いちばん下の入力欄にコマンドを打って Enter を押すと、世界に働きかけられる。結果や会話は、その上に流れていく。" }
        type: ls
        guide:
          - { at: output, text: "これが `ls` の結果。いまいる場所（自分の部屋）にある人や物が、ここに一覧で出る。" }
          - { at: dir, text: "名前のうしろに「/」がついているのは「場所」（フォルダ）。本棚は、中に入れる場所だ。" }
          - { at: found, text: "`ls` で見つけたものは、左の「地図」にも出る。いま見つけたベッド・窓・本棚が、自分の部屋の中に並んでいる。" }
          - { at: book, text: "右は「コマンド手帳」。いま使えるコマンドの書き方がのっている。`ls` もここにある。何を打てばいいか忘れたら、ここを見よう。" }
      - say:
          - "バッシュ: 人に話しかけたり、物を調べたりするのは `cat 名前`。さっきおまえを起こしたのも、これだ。"
          - "バッシュ: ……ためしに、窓を調べてみるか。"
        type: "cat 窓"
        guide:
          - { at: input, text: "`cat 名前` で、人と話したり、物を調べたりできる。名前は途中まで打って Tab キーを押すと、残りを補ってくれる。" }
        after:
          - "バッシュ: パン屋の煙突から、煙が出てるな。焼きたてだぞ。"
      - say:
          - "バッシュ: 次は、場所を移る呪文 `cd`。`cd 場所の名前` で、その中に入れる。"
        type: "cd 本棚"
        pauseAt: "cd "
        hold:
          - { at: suggest, text: "`cd` のうしろには、行き先の場所の名前を書く。`cd ` まで打つと、行ける場所が「入力候補」としてここに出る。いまいる場所の中にある場所と、外へ出る `..` だ。" }
          - { at: suggest, text: "候補は、↓ ↑ キーで選んで、Tab か Enter で入力欄に入れられる。クリックしてもいい。名前を打たなくても、選ぶだけで入力できる。" }
        guide:
          - { at: here, text: "本棚の中に入った。左の地図の「いまここ」も、本棚に動いた。" }
          - { at: map, text: "地図では、一段右にずれている場所が、上の場所の「中」にある。本棚は、自分の部屋の中だ。地図の場所をクリックすると、そこへ行くコマンドが入力欄に入る。" }
      - say:
          - "バッシュ: 新しい場所に来たら、まず `ls` で見渡す。これが基本だ。"
        type: ls
        after:
          - "バッシュ: ……本ばっかりだな。出るぞ。"
      - say:
          - "バッシュ: 外へ出るのは `cd ..`。点を2つだ。"
        type: "cd .."
        pauseAt: "cd "
        learn: ["cd .."]
        hold:
          - { at: suggest, item: "..", text: "`..`（点を2つ）は「ひとつ外」。本棚のひとつ外は、自分の部屋だ。" }
        guide:
          - { at: here, text: "自分の部屋に戻った。`cd 名前` で中へ、`cd ..` で外へ。これで、どこへでも歩ける。" }
        after:
          - "バッシュ: よし。じゃあ、パン屋へ行くぞ。道は、このままおれがやってみせる。"
      - say:
          - "バッシュ: 部屋から出るのも `cd ..`。自分の部屋のひとつ外は、家（きみの家）の中だ。"
        type: "cd .."
        guide:
          - { at: here, text: "家の中に出た。地図の「いまここ」も、自分の部屋から、ひとつ外の「きみの家」に動いた。" }
      - say:
          - "バッシュ: 新しい場所に来たら……そう、まず `ls` だ。"
        type: ls
        guide:
          - { at: output, text: "家の中にあるのは、リビングと自分の部屋。パン屋は、家の中にはない。" }
        after:
          - "バッシュ: パン屋は家の外――チルダ村の中にある。"
          - "バッシュ: 名前だけで行けるのは、いまいる場所の中にあるもの（`ls` で見えるもの）だけ。だから、もうひとつ外へ出なきゃいけない。"
          - "{name}: じゃあ、もう一回 `cd ..`？"
          - "バッシュ: それでもいい。でも、もっと早い書き方があるんだ。……その前に、村のほうをのぞいておくか。"
      - say:
          - "バッシュ: `ls` のうしろに場所を書くと、入らなくても、その中が見える。`..` なら、ひとつ外――チルダ村の中だ。"
        type: "ls .."
        learn: ["ls 場所"]
        guide:
          - { at: output, text: "`ls ..` で、ひとつ外（チルダ村）の中にある場所が見えた。パン屋もある。中に入らなくても、のぞける。" }
          - { at: found, text: "のぞいて見つけた場所も、地図に出る。地図に出ている場所なら、`cd` の入力候補にも出てくる。" }
        after:
          - "バッシュ: あった、パン屋だ。じゃあ、早い書き方で行くぞ。"
      - say:
          - "バッシュ: `/` は「の中の」って読む。`../パン屋` なら「ひとつ外の中の、パン屋」だ。"
        type: "cd ../パン屋/"
        learn: ["cd 場所/場所"]
        pauseAt: "cd ../パ"
        tab: true
        hold:
          - { at: suggest, text: "`..` に `/` をつなげると、`..`（ひとつ外のチルダ村）の中にある場所が、候補として出てくる。行き先まで一気に書けば、一気に移動できる。" }
          - { at: input, text: "ここで Tab キーを押すと、名前の残りを補ってくれる。長い名前も、打ちまちがえずにすむ。" }
        guide:
          - { at: here, text: "一度で、パン屋に着いた。きみの家のひとつ外はチルダ村。そのチルダ村の中の、パン屋だ。" }
        after:
          - "バッシュ: な？ 一度で着いただろ。"
      - say:
          - "バッシュ: 着いたら……？"
          - "{name}: まず `ls`！"
        type: ls
        guide:
          - { at: mark, text: "地図で、赤い「!」がついているのが、次に話す人・行く場所。迷ったら「!」をたどろう。" }
          - { at: objective, text: "左下の「目的」には、いまやることが出る。" }
          - { at: book, text: "ここまでに出てきた `cd ..` や `../パン屋` の書き方も、右の手帳にたまっている。" }
          - { at: hint, text: "困ったら「💡 ヒント」を押すか、`hint` と打とう。押すたびに、だんだんくわしく教えてくれる。" }
          - { at: bookbtn, text: "「📖 手帳」で、右の手帳を閉じたり開いたりできる。くわしい説明は、手帳の「くわしく」から。" }
        after:
          - "バッシュ: そういうこと。……さて、ここからは、おまえがやってみな。"
          - "{name}: え、{me}が？"
          - "バッシュ: 人に話しかけるのは `cat 名前` だったろ。名前は途中まで打って、Tab キーで補える。"
          - "[`cat ナノ` で、ナノに話しかけよう。]"

# cat 自分の名前 で読む、主人公自身
self:
  lines:
    - "（自分のことだ。……今日も、元気。）"
  variants:
    - if: morihito_killed
      lines:
        - "（手が、少しふるえている。……しっかりしなきゃ。）"


# 🎯 目的。上から最初に条件が合ったものを表示する
objectives:
  - if: quest_given
    text: "村の外、迷いの森へ向かおう（`cd /usr`）"
  - if: saw_mom_frozen
    text: "チョウン爺の家へ急ごう（`cd ~/チョウン爺の家`）"
  - if: morihito_killed
    text: "家に帰って、お母さんの様子を見よう（`cd ~/きみの家/リビング`）"
  # 石碑を読む前に ls -a で守り人を見つけたとき（kill は石碑を読んで覚える）
  - if: "found_morihito & !saw_stone"
    text: "抜け穴の奥の「古い石碑」を読んでみよう"
  - if: found_morihito
    text: "石碑の言葉が、頭から離れない……"
  - if: saw_stone
    text: "石碑に書かれた「守り人」は、どこにいるんだろう……"
  - if: found_hole
    text: "抜け穴の奥を調べよう"
  - if: talked_piko
    text: "村はずれの「柵の裏」で、隠れたものを探そう"
  - if: gave_share
    text: "井戸端でピコを探そう（`cd ~/井戸端`）"
  - if: bread_delivered
    text: "チョウン爺にパンをおすそわけしよう（`cd ~/チョウン爺の家`）"
  - if: got_bread
    text: "パンを家に持って帰ろう（`cd ../きみの家/リビング`）"
  - if: errand_bread
    text: "ナノに話しかけて、パンを買おう（`cat ナノ`）"
  - text: "兄のバッシュの手本を見よう"

# 💡 ヒント（方向性 → 使うコマンド → 答え）。hint を打つたびに1段ずつ進む
hints:
  - if: quest_given
    steps:
      - "地図の「迷いの森」の右に、`/usr` と書いてある。それが森の住所だ。"
      - "`cd` のうしろに `/` から始まる住所を書くと、どこからでもその場所へ行ける。"
      - "`cd /usr` と打とう。"
  - if: saw_mom_frozen
    steps:
      - "お母さんまで止まってしまった。村長なら何か知っているかもしれない。"
      - "チョウン爺の家は、チルダ村の中。`~/` から書けば、どこからでも一度で行ける。"
      - "`cd ~/チョウン爺の家` → `cat チョウン爺`"
  - if: morihito_killed
    steps:
      - "村の様子がおかしい。家のお母さんは無事だろうか。"
      - "家のリビングへは、`~/` から道のりを書くと一度で行ける。"
      - "`cd ~/きみの家/リビング` → `cat お母さん`"
  - if: "found_morihito & !saw_stone"
    steps:
      - "隠れていた「.モリビト」を見つけた。そばの石碑に、何か書いてあるかもしれない。"
      - "書かれたものを読むなら `cat`。"
      - "`cat 古い石碑`"
  - if: found_morihito
    steps:
      - "石碑には「唱えるな」と刻まれていた。……でも、唱えると何が起こるんだろう。"
      - "`kill` のうしろに、守り人の名前を書くらしい。"
      - "`kill .モリビト`"
  - if: saw_stone
    steps:
      - "石碑には「その姿、見えざる場所に隠されん」とあった。守り人は、隠れているらしい。"
      - "ピコは、名前が「.」で始まるものは隠れていて、`ls -a` で見えると言っていた。"
      - "`ls -a`"
  - if: found_hole
    steps:
      - "ここは立入禁止の奥。何か大切なものがありそうだ。"
      - "見えているものを調べるなら `cat`。隠れているものを探すなら `ls -a`。"
      - "`cat 古い石碑` → `ls -a` → `cat .モリビト`"
  - if: talked_piko
    steps:
      - "ピコは「名前が . で始まるものは隠れている」と言っていた。"
      - "隠れたものは `ls -a` で見える。行く前に `ls -a ~/村はずれ/柵の裏` で、のぞいてもいい。"
      - "`cd ~/村はずれ/柵の裏` → `ls -a` → `cd .抜け穴`"
  - if: gave_share
    steps:
      - "ナノの妹、ピコを探そう。チョウン爺は井戸端のほうへ行くのを見たらしい。"
      - "井戸端は、チルダ村の中。`cd ~` で村に戻ってから `cd 井戸端`。`cd ~/井戸端` なら一度で着く。"
      - "`cd ~/井戸端` → `cat ピコ`"
  - if: bread_delivered
    steps:
      - "お母さんに、チョウン爺へのおすそわけを頼まれた。"
      - "チョウン爺の家は、チルダ村の中。`~/` から住所を書けば、どこからでも一度で行ける。"
      - "`cd ~/チョウン爺の家` → `cat チョウン爺`"
  - if: got_bread
    steps:
      - "焼きたてのパンを、家のお母さんに届けよう。"
      - "パン屋のひとつ外（`..`）がチルダ村。そこから「きみの家の中の、リビング」と、`/` でつなげて書けば一気に帰れる。"
      - "`cd ../きみの家/リビング` → `cat お母さん`"
  - if: errand_bread
    steps:
      - "パン屋で、ナノからパンを買おう。"
      - "人に話しかけるのは `cat`。パン屋にいなければ、地図の「!」をたどろう。"
      - "`cat ナノ`"
  - steps:
      - "まずは、まわりを見渡してみよう。"
      - "まわりを見るコマンドは `ls`。"
      - "`ls` と打って Enter を押そう。"

# コマンドを打ったあとに起きるイベント
events:
  # パンを買えたら、兄は「これで移動はバッチリだな」と言って、先に帰る
  - on: cat
    if: got_bread
    once: brother_left
    lines:
      - "バッシュ: よし、パンも買えたな。"
      - "バッシュ: さて、おれは先に帰って、皿を並べとく。パンは任せたぞ。"
      - "{name}: え、{me}ひとりで帰るの？"
      - "バッシュ: さっきの `../パン屋` を思い出せ。ここのひとつ外がチルダ村。その中の、きみの家の中の、リビングだ。"
      - "バッシュ: つなげて書けば `cd ../きみの家/リビング`。一気に帰れるぞ。……ひとりで帰れるな？"
      - "{name}: うん、やってみる！"
      - "（バッシュは、ひと足先に帰っていった。）"
    after:
      - "[ためしに `pwd` と打って、パン屋の「住所」を見てみよう。]"
  # 村長に旅を頼まれると、村の外が地図に現れる。ほかのステージへの行き方（/usr）を、地図を照らして教える
  - on: cat
    if: quest_given
    once: world_revealed
    lines:
      - "（遠くで、村の門が開く音がした。）"
    effect: reveal
    reveal: [/, /home, /usr]
    learn: ["cd /usr"]
    guide:
      - { at: sub, item: /home/チルダ村, text: "村の中では、チルダ村の右の `~` を使って、`cd ~` で一気に村へ戻れた。" }
      - { at: sub, item: /usr, text: "地図に、村の外の場所が現れた。ほかのステージでは、`~` のかわりに、右に書いてある住所を打つ。迷いの森なら `cd /usr` で、森のいちばん大きな場所（入口）へ行ける。" }
      - { at: row, item: /home, text: "`/` から書く住所は、世界から数えた住所。チルダ村も、世界から書くと `/home/チルダ村`（世界の中の、居住区の中の、チルダ村）。`/` から書けば、世界のどこからでも届く。" }
    after:
      - "[地図に新しい場所が現れた。`cd /usr` で、迷いの森へ向かおう。]"

root:
  name: ""
  label: 世界
  icon: world
  gate:
    if: "!quest_given"
    lines: ["（村の門は閉ざされている。外へ出るには、村長の許しがいる。）"]
  children:
    - name: home
      label: 居住区
      icon: homes
      gate:
        if: "!quest_given"
        lines: ["（村の門は閉ざされている。外へ出るには、村長の許しがいる。）"]
      children:
        - name: チルダ村
          icon: village
          owner: きみ
          # モリビトを止めてから直すまで、村は色が抜け、空がどす黒くなる
          drainedIf: "morihito_killed & !morihito_revived"
          # モリビトを止めたあとは、ときどき画面が乱れて「ザザッ」と鳴る（村の時が壊れた）
          staticIf: "morihito_killed & !morihito_revived"
          # 村の曲（タイトルと同じ）。モリビトを止めたあとは、無音
          bgm:
            - { if: "morihito_killed & !morihito_revived", name: none }
            - { name: 水平線を見据えて }
          theme:
            - { if: "morihito_killed & !morihito_revived", name: dusk }
            - { name: sky }
          children:
            - name: きみの家
              icon: house
              theme: wood
              owner: きみ
              onEnter:
                - once: entered_hall
                  lines: ["（家の廊下だ。リビングと、自分の部屋、玄関につながっている。）"]
              children:
                - name: 自分の部屋
                  icon: bed
                  owner: きみ
                  children:
                    - name: ベッド
                      icon: bed
                      lines: ["（まだぬくもりが残っている。……もう少し寝ていたい。）"]
                    - name: 窓
                      icon: item
                      set: [looked_window]
                      lines:
                        - "（窓の外に、チルダ村が見える。パン屋の煙突から、白い煙がのぼっている。）"
                        - "（ずっと向こう、村はずれの柵の先は、いつも霧がかかっていて見えない。）"
                      variants:
                        - if: morihito_killed
                          lines: ["（パン屋の煙突から、煙がのぼっていない。鳥が、空中で止まっている。）"]
                    # 「場所の中に、また場所がある」を最初に見せるための小さなフォルダ
                    - name: 本棚
                      icon: shelf
                      onEnter:
                        - once: entered_shelf
                          lines: ["（子どものころから読んでいる本が並んでいる。）"]
                      children:
                        - name: チルダ村のむかしばなし
                          icon: item
                          lines:
                            - "（子どものころ、何度も読んでもらった絵本だ。）"
                            - "（村を見守る「守り人」の話。……守り人は、誰にも見えないところで、ずっと村の時を回しているのだという。）"
                        - name: 基本情報技術者試験の参考書
                          icon: item
                          lines:
                            - "（分厚い参考書だ。表紙に『基本情報技術者試験』と書いてある。）"
                            - "（ぱらぱらめくると、「ディレクトリ」「パス」「プロセス」……どこかで聞いたような言葉が並んでいる。）"
                            - "{name}: ……いつか、ちゃんと読もう。"
                        - name: 応用情報技術者試験の参考書
                          icon: item
                          lines:
                            - "（さらに分厚い参考書だ。表紙に『応用情報技術者試験』と書いてある。）"
                            - "（開いたとたん、文字の多さに目がくらんだ。）"
                            - "{name}: ……これは、もう少し大きくなってから。"
                - name: リビング
                  icon: table
                  owner: きみ
                  onEnter:
                    - once: entered_living
                      lines: ["（食卓にはお皿が並んでいる。……でも、今朝はパンがない。）"]
                  children:
                    - name: お母さん
                      mark: "(got_bread & !bread_delivered) | (morihito_killed & !saw_mom_frozen)"
                      lines:
                        - "お母さん: おはよう、{name}。よく眠れた？"
                        - "お母さん: ごめんね、朝ごはんのパンを切らしちゃったの。バッシュと一緒に、ナノちゃんのパン屋で買ってきてくれる？"
                        - "お母さん: バッシュなら、あなたたちの部屋にいるわよ。"
                      variants:
                        - if: quest_given
                          lines:
                            - "（お母さんは、止まったままだ。）"
                            - "（……必ず、元に戻す。）"
                        - if: saw_mom_frozen
                          lines:
                            - "（お母さんは、止まったままだ。）"
                            - "{name}: ……待ってて。チョウン爺に聞いてくる。"
                        - if: morihito_killed
                          set: [saw_mom_frozen]
                          lines:
                            - "{name}: お母さん！"
                            - "（お母さんは、朝ごはんの片付けの途中で、ぴたりと止まっている。）"
                            - "お母さん: {name}……？ 縺ゅ……繧九……"
                            - "{name}: お母さん！？ ねえ、お母さんってば！"
                            - "（返事はない。お皿を持った手が、宙で止まったままだ。）"
                            - "（となりで、バッシュも皿を並べる途中のまま、動かない。）"
                            - "{name}: 兄ちゃんまで……！"
                            - "{name}: ……{me}が、あんなことをしたから……？"
                            - "{name}: ……村長。チョウン爺なら、何か知ってるかもしれない……！"
                        - if: gave_share
                          lines:
                            - "お母さん: 今日はお休みでしょ。夕ごはんまでには帰ってくるのよ。"
                        - if: bread_delivered
                          lines:
                            - "お母さん: チョウン爺さんの家は、`cd ~/チョウン爺の家` って言えば、どこにいても一度で着くわ。"
                        # パンを届けると、兄が ~ を教えてくれる（いろいろ歩いて、.. に慣れてから）
                        - if: got_bread
                          set: [bread_delivered]
                          learn: ["cd ~"]
                          lines:
                            - "{name}: ただいま！"
                            - "お母さん: おかえり！ わあ、いい匂い。ありがとう。"
                            - "バッシュ: おう、ちゃんとひとりで帰ってこれたな。これで移動はバッチリだな。"
                            - "{name}: 入力候補も出てくるし、{me}にもできたよ！"
                            - "バッシュ: ……まあ、本当のLinuxには、候補がこんなふうに出てくる機能はないんだけどな。でも、覚えやすいだろ？"
                            - "{name}: 本当のLinux？ なにそれ？"
                            - "バッシュ: ああ、こっちの話。"
                            - "{name}: そういえば、ナノが、妹のピコを探してたよ。朝から遊びに行ったきりなんだって。"
                            - "お母さん: あら、ピコちゃんが？ あの子なら、よく井戸端で遊んでるわよ。"
                            - "お母さん: そうだ、ピコちゃんを探しに行くなら、ついでにこのパン、ひとつチョウン爺さんにもおすそわけしてきてくれる？ 一人暮らしだから、ちゃんと食べてるか心配でね。"
                            - "{name}: わかった、持っていくね。"
                            - "（パンをひとつ、あずかった。）"
                            - "バッシュ: チョウン爺の家か。……そうだ、ひとつ便利な呪文を教えてやる。"
                            - "バッシュ: 村の中なら、どこにいても `cd ~` で、一気にチルダ村まで戻れるんだ。`..` を何回も打たなくていい。"
                            - "{name}: `~`……？ にょろにょろ？"
                            - "バッシュ: 「チルダ」って読むんだ。チルダ村の印だよ。地図を見てみな。"
                          guide:
                            - { at: sub, item: /home/チルダ村, text: "チルダ村の右の `~` が、その印。`~` は「チルダ村」の短い呼び名だ。村の中なら、どこからでも `cd ~` でここへ戻れる。" }
                            - { at: prompt, text: "打った行の左にも `~` がある。`~/きみの家/リビング` は「チルダ村の中の、きみの家の中の、リビング」。いまいる場所の住所だ。" }
                          after:
                            - "バッシュ: `~/` のうしろに続けて書けば、村の中のどこへでも一度で行ける。チョウン爺の家なら `cd ~/チョウン爺の家` だ。"
                            - "{name}: どこにいても、一度で……！"
                            - "バッシュ: そういうこと。ほら、行ってこい。"
                        - if: errand_bread
                          lines:
                            - "お母さん: あら、パンは？ ナノちゃんのパン屋で買ってきてね。"
                    - name: バッシュ
                      visibleIf: brother_left
                      lines:
                        - "バッシュ: おかえり。パンは母さんに渡してくれ（`cat お母さん`）。"
                      variants:
                        - if: saw_mom_frozen
                          lines:
                            - "（バッシュは、皿を並べる途中のまま、止まっている。）"
                            - "{name}: ……兄ちゃん。待ってて。"
                        - if: morihito_killed
                          lines:
                            - "（バッシュは、皿を持ったまま、ぴくりとも動かない。）"
                            - "{name}: 兄ちゃん！ ……ねえ、兄ちゃんってば！"
                        - if: gave_share
                          lines:
                            - "バッシュ: ピコなら井戸端だろ。`cd ~/井戸端` だ。"
                        - if: bread_delivered
                          lines:
                            - "バッシュ: チョウン爺の家なら `cd ~/チョウン爺の家` だぞ。……`~` は「チルダ村」の印、忘れるなよ。"
                    - name: 食卓
                      icon: table
                      lines: ["（お皿が並んでいるが、パンはない。）"]
                      variants:
                        - if: morihito_killed
                          lines: ["（パンは、冷え切っている。）"]
                        - if: bread_delivered
                          lines: ["（焼きたてのパンが、お皿にのっている。）"]
                # 玄関（第9章で、スドウとコダマが待っている）
                - name: 玄関
                  icon: door
                  children:
                    - name: くつ箱
                      icon: shelf
                      lines: ["（家族のくつが並んでいる。兄ちゃんのくつは、いつも泥だらけだ。）"]

            - name: 掲示板
              icon: board
              lines:
                - "【チルダ村 掲示板】"
                - "・`ls` ………… まわりを見渡す"
                - "・`cat 名前` … 人と話す／ものを調べる"
                - "・`cd 場所` …… その場所へ行く（`cd ..` でひとつ外へ）"
                - "・本日の予定 … パン屋 焼きたて 朝6時／井戸端会議 いつでも"
                - "※ 村はずれの「立入禁止」には、決して近づかないこと。 ― 村長チョウン"
              variants:
                - if: morihito_killed
                  garble: true

            - name: キャット
              set: [talked_cat]
              lines:
                - "キャット: にゃあ。"
                - "（キャットは、きみの足にすり寄ってきた。）"
              variants:
                - if: morihito_killed
                  lines:
                    - "キャット: フーッ！"
                    - "（毛を逆立てて、村はずれのほうをにらんでいる。）"
                - if: talked_cat
                  lines:
                    - "キャット: ……にゃ。"
                    - "（キャットは、村はずれのほうをじっと見ている。）"

            - name: チョウン爺の家
              icon: house
              theme: wood
              onEnter:
                - once: entered_chown
                  lines: ["（チョウン爺の家だ。壁には、たくさんの鍵がかかっている。）"]
              children:
                - name: チョウン爺
                  mark: "(bread_delivered & !gave_share) | (saw_mom_frozen & !quest_given)"
                  lines:
                    - "チョウン爺: おお、{name}か。おはよう。朝ごはんはもう食べたかの？"
                  variants:
                    - if: quest_given
                      lines:
                        - "チョウン爺: 頼んだぞ……{name}……。"
                        - "チョウン爺: 森へは……`cd /usr` じゃ……。"
                    - if: saw_mom_frozen
                      set: [quest_given]
                      lines:
                        - "{name}: チョウン爺！ お母さんが……村のみんなが……！"
                        - "チョウン爺: き……きみか……。"
                        - "チョウン爺: モリビトが……なぜか、止まってしまったようじゃ……。"
                        - "{name}: モリビト……？ ナノが言ってた、モリビト様……？"
                        - "チョウン爺: モリビトはな……この村の時を回しておった……見えない守り人じゃ……。"
                        - "{name}: （……あの石碑の、言葉……。）"
                        - "チョウン爺: わしらはもう……あまり……動けん……。"
                        - "チョウン爺: 村の外……ずっと遠くに……スドウという賢者がおる……。"
                        - "チョウン爺: あの方なら……モリビトを直す術を……知っておるはずじゃ……。"
                        - "{name}: スドウ……。その人に会えば、みんな元に戻るの……？"
                        - "チョウン爺: 村の門を……開けておく……。"
                        - "{name}: 村の外へ……？"
                        - "チョウン爺: おまえたちが「~」と呼んできたこのチルダ村も……世界から数えれば `/home/チルダ村`……"
                        - "チョウン爺: 外の世界は……「/」から始まる……。まずは森へ……`cd /usr` と唱えるのじゃ……。"
                        - "チョウン爺: 頼む……{name}……。"
                        - "{name}: ……わかった。必ず、スドウって人を見つけてくる。"
                    - if: morihito_killed
                      lines:
                        - "（チョウン爺は、椅子に座ったまま、じっと動かない。）"
                        - "{name}: ……お母さんは？ お母さんは無事かな……。"
                    - if: gave_share
                      lines:
                        - "チョウン爺: 立入禁止には近づくでないぞ。……ほっほ、わかっとるならよい。"
                    - if: bread_delivered
                      set: [gave_share]
                      lines:
                        - "チョウン爺: おお、{name}か。……なに、わしにパンを？ ほっほ、ありがたいのう。"
                        - "チョウン爺: この村はな、わしが子どものころから何ひとつ変わらん。"
                        - "チョウン爺: 朝が来て、夜が来て、また朝が来る。……それを当たり前と思えるのは、ありがたいことなんじゃよ。"
                        - "{name}: 当たり前なのが、ありがたいの……？"
                        - "チョウン爺: ほっほ。いつか、分かる日が来るじゃろうて。"
                        - "チョウン爺: ああ、そうじゃ。村はずれの「立入禁止」にだけは、近づくでないぞ。"
                        - "チョウン爺: あそこの鍵は、わしが持っておる。この村ではな、持ち主の許しなしに、よその扉は開けられんのじゃ。"
                        - "{name}: 立入禁止……？ あそこには、何があるの？"
                        - "チョウン爺: ……村にとって、とても大事なものじゃ。子どもが触れてよいものではない。"
                        - "{name}: ……わかった。近づかないよ。"
                        - "チョウン爺: ほっほ、いい子じゃ。"
                        - "{name}: ……あ、そうだ。チョウン爺、ピコを見なかった？"
                        - "チョウン爺: ピコなら、さっき井戸端のほうへ走っていったぞ。元気な子じゃ。"
                        - "チョウン爺: 井戸端なら `cd ~/井戸端` じゃ。わしの家の中にはないから、チルダ村（`~`）から数えるんじゃよ。"
                - name: 古い日記
                  icon: item
                  lines:
                    - "（チョウン爺の日記だ。開いたままのページがある。）"
                    - "「今日もモリビト様のおかげで、村は静かに回っておる。」"
                    - "「スドウどのが村を去って、もう何年になるか。あの方は今、どこで何を見ておられるのか。」"

            - name: パン屋
              icon: bakery
              theme: wood
              onEnter:
                - once: entered_bakery
                  lines: ["（焼きたてのパンの香りが、ふわりと広がった。）"]
              children:
                - name: ナノ
                  mark: "errand_bread & !got_bread"
                  set: [got_bread, talked_nano]
                  learn: [pwd]
                  lines:
                    - "ナノ: いらっしゃい、{name}！ バッシュも一緒なのね。おばさんのおつかい？ ちょうど焼きあがったところよ。"
                    - "ナノ: はい、焼きたて。"
                    - "{name}: いい匂い……！ ナノ、毎朝こんなに早くから焼いてるの？"
                    - "ナノ: ううん、火を入れてるのは、わたしじゃないの。この窯ね、毎朝6時になると、ひとりでに火がつくのよ。"
                    - "{name}: ひとりでに……？"
                    - "ナノ: 村のみんなは「モリビト様が、見えないところで村を回してくださってるから」って言うの。"
                    - "{name}: モリビト様……？"
                    - "ナノ: 村の守り人。……でも、見た人は誰もいないんだって。窯の火がつくのは、本当なのにね。"
                    - "ナノ: あ、そうだ。妹のピコを見なかった？ 朝から遊びに行ったきりなの。お昼には帰ってきなさいって、伝えてくれる？"
                    - "{name}: うん、見かけたら伝えるね。"
                    - "ナノ: それと、村の中で迷ったら `pwd` って唱えてみて。いまどこにいるか、ちゃんと教えてくれるから。"
                    - "（焼きたてのパンを受け取った。）"
                  variants:
                    - if: morihito_killed
                      garble: true
                    - if: talked_piko
                      lines:
                        - "ナノ: ピコに会えた？ まったく、あの子ったら秘密ばっかりなんだから。"
                    - if: got_bread
                      lines:
                        - "ナノ: ピコ、見つかった？ 井戸端はね、ここからなら `cd ../井戸端` だよ。"
                    - if: "!errand_bread"
                      lines:
                        - "ナノ: おはよう、{name}！ いま焼いてるところなの、もうちょっと待ってね。……バッシュは一緒じゃないの？"
                - name: 焼きたてパン
                  icon: item
                  lines:
                    - "（棚いっぱいに、焼きたてのパンが並んでいる。）"
                  variants:
                    - if: morihito_killed
                      lines: ["（冷え切っている。窯の火が、消えている。）"]

            - name: 井戸端
              icon: well
              onEnter:
                - once: entered_well
                  lines: ["（井戸のまわりで、おばあさんとおじいさんが言い争っている。）"]
              children:
                - name: ヴィム婆
                  set: [talked_vim]
                  lines:
                    - "ヴィム婆: おや{name}。聞いとくれよ、この爺さんがまた言うんだよ。わしの家は「一度入ったら出られない」ってね。"
                    - "ヴィム婆: 失礼な話さ。出口ならちゃんとある。……ちょっと呪文がいるだけでね。"
                    - "{name}: 呪文……？"
                    - "ヴィム婆: ほら、昨日来た客も、まだ帰れずにいるよ。ひっひっひ。"
                    - "ヴィム婆: そうそう、立入禁止の奥には村の宝が眠ってるって噂、知ってるかい？"
                  variants:
                    - if: morihito_killed
                      garble: true
                    - if: talked_vim
                      lines:
                        - "ヴィム婆: 出口の呪文かい？ コロンとキューさ。……なんのことかって？ ひっひ、いつか分かるよ。"
                - name: イーマ爺
                  set: [talked_emacs]
                  lines:
                    - "イーマ爺: ばあさんの家は狭すぎるんじゃ。わしの家を見てみい、台所も書斎も、占いの部屋まである。"
                    - "イーマ爺: もはや家というより、一つの国じゃな。わっはっは。"
                    - "{name}: 国……！？"
                    - "イーマ爺: ……ただ、広すぎて、たまに自分でも迷うがの。"
                    - "イーマ爺: 宝の噂？ ばあさんの作り話じゃよ。立入禁止にあるのは、宝なんかよりもっと大事なもんじゃ。"
                  variants:
                    - if: morihito_killed
                      garble: true
                    - if: talked_emacs
                      lines:
                        - "イーマ爺: わしの家の扉はな、指を三本同時に使って開けるんじゃ。便利じゃろ？"
                - name: ピコ
                  mark: "gave_share & !talked_piko"
                  set: [talked_piko]
                  learn: ["ls 場所", "ls -a"]
                  lines:
                    - "ピコ: あっ、{name}！ ……もしかして、お姉ちゃんに言われて来た？ まだ帰らないもんね！"
                    - "ピコ: そのかわり、ないしょの話、教えてあげる。"
                    - "ピコ: 村はずれの「柵の裏」にはね、ヒミツの抜け穴があるんだよ！"
                    - "{name}: 抜け穴？ 柵の裏なんて、何もなかったような……。"
                    - "ピコ: ピコね、行く前に、いっつもここからのぞいてるの。`ls` のうしろに場所を書くと、入らなくても中が見えるんだよ。"
                    - "{name}: あ、兄ちゃんも `ls ..` って、家の中から村をのぞいてた！"
                    - "ピコ: そう！ もっと遠くの場所でも見えるの。ここからなら `ls ~/村はずれ/柵の裏`。村はずれに行ってからなら、`ls 柵の裏` だけでいいの。"
                    - "{name}: へえ……！ じゃあ、抜け穴もそれで見えるの？"
                    - "ピコ: でも、ふつうに `ls` しても見えないの。名前が「.」ではじまるものは、隠れてるんだって。"
                    - "ピコ: `ls -a` って打つと、隠れてるものも見えるんだよ！ ……ぜったい、ないしょだからね！"
                  variants:
                    - if: morihito_killed
                      lines:
                        - "ピコ: ね、ねえ……{name}……。"
                        - "ピコ: みんな、へんなの。話しかけても、へんな言葉しか返ってこないの……。"
                        - "ピコ: お姉ちゃんも……。ピコ、こわいよ……。"
                    - if: talked_piko
                      lines:
                        - "ピコ: 抜け穴、見つけた？ 村はずれの「柵の裏」で `ls -a` だよ！ ここからなら `ls -a ~/村はずれ/柵の裏` でのぞけるよ！"
                        # 伏線（調べても、本編では何も分からない。くわしくは手元の docs/sequel.md の伏線の表）
                        - "{name}: ねえ、ピコ。そのひみつ、だれに教わったの？"
                        - "ピコ: えへへ。前に村に来た、旅のおじさん！ 「だれかに教えてあげな」って。"
                        - "{name}: 旅のおじさん？ なんていう人？"
                        - "ピコ: 名前……聞いたんだけど……。……あれ？ なんでか、思い出せないの。"
                        - "ピコ: あ、お昼には帰るって、お姉ちゃんに言っといて！"
                - name: 井戸
                  icon: item
                  lines: ["（深い井戸だ。のぞきこむと、自分の顔がうつっている。）"]
                  variants:
                    - if: morihito_killed
                      lines: ["（水面が、ノイズのようにざらざらと揺れている。）"]

            - name: 村はずれ
              icon: path
              onEnter:
                - once: entered_edge
                  lines: ["（村の端。この先は、あまり人が来ない。）"]
              children:
                - name: 看板
                  icon: board
                  lines: ["【この先 立入禁止】 ― 村長チョウン"]
                - name: 立入禁止
                  icon: lock
                  mode: "rwx------"
                  owner: チョウン爺
                  deniedLines:
                    - "（扉には重い錠がかかっている。錠には「持ち主: チョウン」と刻まれている。）"
                  children:
                    - name: 古い鍵束
                      icon: item
                      lines: ["（たくさんの鍵が束ねられている。）"]
                - name: 柵の裏
                  icon: fence
                  onEnter:
                    - once: entered_fence
                      lines: ["（古い柵が、ぐるりと村はずれを囲んでいる。）"]
                  children:
                    - name: 古い柵
                      icon: fence
                      lines:
                        - "（ところどころ板が外れかけている。子どもなら、くぐれそうな隙間がある。）"
                        - "（……でも、ここからは何も見えない。）"
                    - name: .抜け穴
                      icon: hole
                      mark: "talked_piko & !found_hole"
                      onEnter:
                        - once: found_hole
                          lines:
                            - "（身をかがめて、柵の隙間をくぐった。）"
                            - "{name}: ……ほんとうに、あった……！"
                            - "{name}: ピコの言ってたこと、本当だったんだ。"
                            - "（ひんやりとした空気。……ここは、立入禁止の奥だ。）"
                            - "{name}: ちょっとだけ。ちょっと見るだけだから……。"
                      children:
                        - name: 古い石碑
                          icon: stone
                          # 読むまでと、ls -a で守り人を見つけるまでは、石碑に「!」（もう一度読むと、ピコの話を思い出す）
                          mark: "found_hole & !saw_stone | found_hole & !found_morihito"
                          set: [saw_stone]
                          learn: [kill]
                          lines:
                            - "（苔むした石碑に、かすれた文字が刻まれている。）"
                            - "「ここに 村の守り人 在り。その姿、見えざる場所に隠されん。」"
                            - "「守り人の名を呼び、`kill` と唱うることなかれ。唱えし時――」"
                            - "（その先は、削り取られていて読めない。削られたところだけ、苔が生えていない。）"
                            - "{name}: 唱えちゃいけない言葉……？ `kill`……唱えると、どうなるんだろう。"
                          variants:
                            - if: morihito_killed
                              lines: ["（石碑の文字は、もう光っていない。）"]
                            # 石碑を読む前に、ls -a で守り人を見つけていたとき。ここで kill を覚える
                            - if: "found_morihito & !saw_stone"
                              set: [saw_stone]
                              learn: [kill]
                              lines:
                                - "（苔むした石碑に、かすれた文字が刻まれている。）"
                                - "「ここに 村の守り人 在り。その姿、見えざる場所に隠されん。」"
                                - "「守り人の名を呼び、`kill` と唱うることなかれ。唱えし時――」"
                                - "（その先は、削り取られていて読めない。削られたところだけ、苔が生えていない。）"
                                - "{name}: 唱えちゃいけない言葉……？ `kill`……"
                                - "{name}: 守り人って……さっき `ls -a` で見つけた、あの「.モリビト」のこと……？"
                                - "（石碑の文字が、淡く光りはじめた。）"
                                - "（「`kill .モリビト`」――その言葉が、なぜか頭から離れない。）"
                            - if: found_morihito
                              lines:
                                - "（石碑の文字が、淡く光っている。）"
                                - "（「`kill .モリビト`」――その言葉が、なぜか頭から離れない。）"
                            # 2回目からは、ls -a で守り人を見つけるまで、ピコの話を思い出す
                            - if: saw_stone
                              lines:
                                - "（「守り人の名を呼び」……でも、ここには石碑のほかに、何も見当たらない。）"
                                - "{name}: 「その姿、見えざる場所に隠されん」……見えない場所……？"
                                - "{name}: ……そういえば、ピコが言ってた。名前が「.」で始まるものは隠れていて、`ls -a` で見えるって……！"
                                - "[`ls -a` で、隠れているものを探してみよう。]"
                        - name: .モリビト
                          type: process
                          icon: proc
                          owner: スドウ
                          # ls -a で見つけたら立つ。見つけるまでは kill できない
                          seen: found_morihito
                          mark: "found_morihito & !morihito_killed"
                          stoppedIf: morihito_killed
                          lines:
                            - "[実行中のプロセス]"
                            - "（これが何なのか、きみにはわからない。）"
                            - "（ただ、何かとても大切なものだという気配だけはする。）"
                            - "（耳をすますと、かすかな鼓動が聞こえる。トクン……トクン……）"
                          variants:
                            - if: morihito_killed
                              lines:
                                - "[停止したプロセス]"
                                - "（鼓動は、もう聞こえない。）"
                          onKill:
                            set: [morihito_killed]
                            lines: ["[モリビトを停止しました。]"]
                            effect: glitch
                            after:
                              - "（……音が、消えた。）"
                              - "（風も、鳥の声も、止まっている。）"
                              - "{name}: え……？ なに、いまの……。"
                              - "{name}: 鼓動が、聞こえない……。{me}、いま、なにを……。"
                              - "{name}: ……どうしよう。とんでもないことを、しちゃったのかもしれない。"
                              - "{name}: そうだ、お母さん……！ 家に帰らなきゃ……！"

        - name: ムラガレ
          icon: village
          visibleIf: never
          teaser: quest_given
          children: []

    - name: usr
      label: 迷いの森
      icon: forest
      theme: forest
      visibleIf: quest_given
      mark: "quest_given & !ch0_clear"
      onEnter:
        - once: ch0_clear
          lines:
            - "（村の門を抜けると、見たこともない景色が広がっていた。）"
            - "（振り返ると、チルダ村が小さく見える。）"
            - "（村を救うため、きみは賢者スドウを探す旅に出る。）"
          effect: chapterEnd
      children: []

    # まだ行けない場所。村長に頼まれると「？？？」として地図に現れる
    - { name: lib, label: もつれ沼, visibleIf: never, teaser: quest_given, children: [] }
    - { name: tmp, label: 市場町イチバ, visibleIf: never, teaser: quest_given, children: [] }
    - { name: proc, label: 坑道アナグラ, visibleIf: never, teaser: quest_given, children: [] }
    - { name: etc, label: 物見の塔, visibleIf: never, teaser: quest_given, children: [] }
    - { name: var, label: 書庫と山道, visibleIf: never, teaser: quest_given, children: [] }
    - { name: root, label: 賢者の庵, visibleIf: never, teaser: quest_given, children: [] }
